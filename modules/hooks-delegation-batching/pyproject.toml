[project]
name = "amplifier-module-hooks-delegation-batching"
version = "0.1.0"
description = "Detects sequential delegation waves and nudges toward batching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["amplifier-core>=1.0.0"]

[project.entry-points."amplifier.modules"]
hooks-delegation-batching = "amplifier_module_hooks_delegation_batching:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_delegation_batching"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
