name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A Windows failure must not cancel the POSIX legs -- those tell us whether
    # we regressed the population that actually works today, which is the more
    # expensive outcome by far.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install dependencies (with grpc-adapter)
        run: uv sync --extra grpc-adapter

      # `-rA` appends the short-summary section listing every test by node id.
      # Without it `-q` prints one dot per test and the log can never name what
      # ran, so "prove test X executed in CI" is unanswerable from the log --
      # you are reduced to inferring it from the passed COUNT, which is
      # arithmetic about a number, not evidence about a test. Nothing about
      # which tests run changes here; only whether the log says their names.
      - name: Run tests
        run: uv run pytest tests/ -q --tb=short -rA

  media-core2:
    name: Participating media graph (Ubuntu, Core 2.0.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      # Keep Foundation's maintained Core 1.3 lock/matrix above unchanged.
      # Positive cooperative graph construction is qualified against this exact
      # ABI; a negative/unsupported test in the old matrix is not its substitute.
      - name: Prepare locked media dependencies and exact qualified Core
        run: |
          uv sync --locked --extra media --extra grpc-adapter
          uv pip install --python .venv/bin/python --no-deps amplifier-core==2.0.2
          uv run --no-sync python -c "from importlib.metadata import version; assert version('amplifier-core') == '2.0.2'; print(version('amplifier-core'))"
      - name: Qualify actual public graph and private media boundaries
        run: |
          uv run --no-sync pytest tests/test_media_hook_bridge.py tests/test_media_foundation_integration.py tests/test_session_media.py tests/test_media_projection.py tests/test_media_provider.py tests/test_session_checkpoint.py tests/test_configurator_coordinator.py -q --tb=short -rA

  macos-shared-sources:
    name: Shared source publication (macOS, Python 3.13)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Prepare locked dependencies and record platform
        run: |
          sw_vers
          uname -m
          id -u
          git rev-parse HEAD
          shasum -a 256 uv.lock amplifier_foundation/sources/shared.py tests/test_shared_build_views.py
          uv sync --locked
          uv run --no-sync python --version
      - name: Old-source contract discriminator (expected failure, not native reproduction)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8d26eceb9b7cafe6e93346f8f4294596bd45dcd1
          mkdir -p "$RUNNER_TEMP/shared-source-old"
          cp -R amplifier_foundation "$RUNNER_TEMP/shared-source-old/"
          git show 8d26eceb9b7cafe6e93346f8f4294596bd45dcd1:amplifier_foundation/sources/shared.py > "$RUNNER_TEMP/shared-source-old/amplifier_foundation/sources/shared.py"
          cd "$RUNNER_TEMP/shared-source-old"
          shasum -a 256 amplifier_foundation/sources/shared.py
          export PYTHONPATH="$RUNNER_TEMP/shared-source-old"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "from pathlib import Path; import amplifier_foundation.sources.shared as s; print(s.__file__); assert Path(s.__file__).resolve() == Path('amplifier_foundation/sources/shared.py').resolve()"
          set +e
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_shared_sources.py::test_publication_obeys_write_enabled_rename_contract" --import-mode=importlib -q --tb=long > "$RUNNER_TEMP/old-source-result.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/old-source-result.txt"
          test "$result" -eq 1
          grep -E '^>[[:space:]]+assert path.stat\(\).st_mode & stat.S_IWUSR$' "$RUNNER_TEMP/old-source-result.txt"
          grep -E '^E[[:space:]]+AssertionError:' "$RUNNER_TEMP/old-source-result.txt"
      - name: Source publication, build views and native rename controls
        run: uv run --no-sync pytest tests/test_shared_sources.py tests/test_shared_build_views.py tests/test_gap_rmtree_readonly.py -q --tb=short -rA
      - name: Install exact wheel and check outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          shasum -a 256 dist/*.whl
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/shared-source-installed"
          cp tests/test_shared_sources.py tests/test_shared_build_views.py tests/test_gap_rmtree_readonly.py "$RUNNER_TEMP/shared-source-installed/"
          cd "$RUNNER_TEMP/shared-source-installed"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -c "from pathlib import Path; import amplifier_foundation as f; p = Path(f.__file__).resolve(); print(p); assert 'site-packages' in p.parts"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m pytest . --import-mode=importlib -o asyncio_mode=strict -o asyncio_default_fixture_loop_scope=function -q --tb=short -rA

  installed-consumers:
    name: Installed consumers (${{ matrix.os }}, Python 3.13 x64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: x64

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      # The script builds ONE non-editable candidate wheel, then resolves the
      # pinned consumers independently. Agent's Core==2.0.1 is not compatible
      # with the CLI/Unified Core>=2.0.2 graph. Never combine those environments.
      # Windows also builds the exact pre-PR456 wheel into TWO separate baseline
      # venvs. Default-creation candidate/baseline cells use fresh synthetic HOME
      # boundaries, no session precreation, and the same pinned consumer graphs.
      # Pinned Agent/CLI cells qualify unchanged legacy defaults. Independent
      # Foundation append/reader checks select private before I/O and qualify
      # public private creation, not strict acceptance of an updated consumer.
      # Ubuntu retains only the existing privately prepared qualification cells.
      # Short build/install paths stay on the runner temp volume. Runtime state
      # separately uses canonical original TEMP, like native pytest, with full
      # production ancestor validation before creation; neither volume is trusted
      # merely because its path was selected or its spelling was normalized.
      - name: Select compact Windows fixture location
        id: windows-root
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $driveRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          if ($driveRoot -notmatch '^[A-Za-z]:\\$') { throw 'Expected a local runner temp drive' }
          $work = Join-Path $driveRoot ("ic-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          "work=$work" >> $env:GITHUB_OUTPUT

      - name: Build candidate and install isolated consumer graphs
        run: python -I -X utf8 tests/installed_consumer_compat.py --prepare --work "${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}"

      - name: Qualify installed SDK and CLI persistence
        if: ${{ always() && !cancelled() }}
        run: python -I -X utf8 tests/installed_consumer_compat.py --run --work "${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}"

      # Rescan the saved, normalized JSON. Failure withholds the entire upload;
      # never publish raw private state, command output, or exception messages.
      - name: Check public evidence before upload
        id: public-evidence
        if: ${{ always() && !cancelled() }}
        run: python -I -X utf8 tests/installed_consumer_compat.py --check-public --work "${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}"

      - name: Retain installed-consumer evidence
        if: ${{ always() && steps.public-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-consumers-${{ matrix.os }}-py313-x64
          path: ${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}/evidence/*.json
          if-no-files-found: error
