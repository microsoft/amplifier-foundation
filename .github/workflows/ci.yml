name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A Windows failure must not cancel the POSIX legs -- those tell us whether
    # we regressed the population that actually works today, which is the more
    # expensive outcome by far.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies (with grpc-adapter)
        env:
          # The pinned Core wheel hit uv's 30s download timeout on Win/Python 3.11.
          # Allow a bounded slow transfer without adding retries or hiding failures.
          UV_HTTP_TIMEOUT: '120'
        run: uv sync --extra grpc-adapter

      # `-rA` appends the short-summary section listing every test by node id.
      # Without it `-q` prints one dot per test and the log can never name what
      # ran, so "prove test X executed in CI" is unanswerable from the log --
      # you are reduced to inferring it from the passed COUNT, which is
      # arithmetic about a number, not evidence about a test. Nothing about
      # which tests run changes here; only whether the log says their names.
      - name: Run tests
        run: uv run pytest tests/ -q --tb=short -rA

  media-binding:
    name: Media binding (released Core 2.0.2, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Positive binding tests require this exact released ABI and POSIX.
      # Resolve independently: do not change the ordinary Core 1.x root lock.
      - name: Install candidate with released Core and Pillow
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python '.[media]' 'amplifier-core==2.0.2' 'pytest>=9.0.3' 'pytest-asyncio>=1.3.0' 'pytest-timeout>=2.3.0'
          .venv/bin/python -c "import os; from importlib.metadata import version; from PIL import Image; print('Core', version('amplifier-core'), 'Pillow', version('Pillow')); assert os.name == 'posix'; assert version('amplifier-core') == '2.0.2'"

      - name: Qualify binding, hooks and media without skips
        run: |
          .venv/bin/python -m pytest tests/test_media_host_binding.py tests/test_media_hook_bridge.py tests/test_session_media.py -q --tb=short -rA --junitxml=media-binding-results.xml
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("media-binding-results.xml").getroot()
          cases = report.findall(".//testcase")
          assert cases, "Media qualification ran no tests"
          skipped = report.findall(".//skipped")
          assert not skipped, f"Media qualification unexpectedly skipped {len(skipped)} tests"
          print(f"Qualified {len(cases)} media tests with no skips")
          PY

  # Hosted Windows runners have long paths ON; a default Windows PC has them
  # OFF and changing that needs an administrator. With them off, Windows
  # refuses an ordinary path of 260 characters or more. The shared source store
  # must stage, seal, clean up and build repositories whose files exceed that.
  # This job turns the setting off for new processes, REQUIRES the canary to
  # show the limit is in force (a failure, never a skip), runs the store's
  # tests, then restores the runner's original value.
  windows-long-paths-off:
    name: Source store with Windows long paths off (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        env:
          # This lane also downloads the locked notebook/debugpy test graph.
          UV_HTTP_TIMEOUT: '120'
        run: uv sync --extra grpc-adapter

      - name: Turn Windows long paths off for new processes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $before = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($null -eq $before) { $before = 'absent' }
          "LONG_PATHS_BEFORE=$before" >> $env:GITHUB_ENV
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0 -Type DWord
          $now = (Get-ItemProperty -Path $key -Name LongPathsEnabled).LongPathsEnabled
          "LongPathsEnabled was $before and is now $now"
          if ($now -ne 0) { throw 'Long paths are still on; this job cannot prove anything.' }

      # This temporary root puts each test's store root at about 63 characters;
      # a store root measured on a real install has 64. pytest's default root
      # on the runner is about 40 characters deeper than that. The deep-tree
      # tests size their own paths from the store root, so they exceed the
      # limit by the same amount under any root.
      - name: Require the path limit, then run the source store tests under it
        env:
          AMPLIFIER_REQUIRE_WINDOWS_PATH_LIMIT: '1'
        run: uv run --no-sync pytest tests/test_source_store_long_paths.py tests/test_shared_sources.py tests/test_shared_build_views.py tests/test_gap_rmtree_readonly.py tests/test_git_longpaths.py -q --tb=short -rA --basetemp "${{ runner.temp }}/long-paths-off"

      - name: Restore the runner's long-path setting
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          if (-not $env:LONG_PATHS_BEFORE) { 'The setting was never changed.'; exit 0 }
          if ($env:LONG_PATHS_BEFORE -eq 'absent') {
            Remove-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue
          } else {
            Set-ItemProperty -Path $key -Name LongPathsEnabled -Value ([int]$env:LONG_PATHS_BEFORE) -Type DWord
          }
          $after = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          if ($null -eq $after) { $after = 'absent' }
          "LongPathsEnabled is $after; it was $env:LONG_PATHS_BEFORE before this job"
          if ("$after" -ne "$env:LONG_PATHS_BEFORE") { throw 'The runner long-path setting was not restored.' }

  macos-shared-sources:
    name: Shared source publication (macOS, Python 3.13)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Prepare locked dependencies and record platform
        run: |
          sw_vers
          uname -m
          id -u
          git rev-parse HEAD
          shasum -a 256 uv.lock amplifier_foundation/sources/shared.py tests/test_shared_build_views.py
          uv sync --locked
          uv run --no-sync python --version
      - name: Old-source contract discriminator (expected failure, not native reproduction)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 8d26eceb9b7cafe6e93346f8f4294596bd45dcd1
          mkdir -p "$RUNNER_TEMP/shared-source-old"
          cp -R amplifier_foundation "$RUNNER_TEMP/shared-source-old/"
          git show 8d26eceb9b7cafe6e93346f8f4294596bd45dcd1:amplifier_foundation/sources/shared.py > "$RUNNER_TEMP/shared-source-old/amplifier_foundation/sources/shared.py"
          cd "$RUNNER_TEMP/shared-source-old"
          shasum -a 256 amplifier_foundation/sources/shared.py
          export PYTHONPATH="$RUNNER_TEMP/shared-source-old"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "from pathlib import Path; import amplifier_foundation.sources.shared as s; print(s.__file__); assert Path(s.__file__).resolve() == Path('amplifier_foundation/sources/shared.py').resolve()"
          set +e
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_shared_sources.py::test_publication_obeys_write_enabled_rename_contract" --import-mode=importlib -q --tb=long > "$RUNNER_TEMP/old-source-result.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/old-source-result.txt"
          test "$result" -eq 1
          grep -E '^>[[:space:]]+assert path.stat\(\).st_mode & stat.S_IWUSR$' "$RUNNER_TEMP/old-source-result.txt"
          grep -E '^E[[:space:]]+AssertionError:' "$RUNNER_TEMP/old-source-result.txt"
      - name: Source publication, build views and native rename controls
        run: uv run --no-sync pytest tests/test_shared_sources.py tests/test_shared_build_views.py tests/test_gap_rmtree_readonly.py -q --tb=short -rA
      - name: Install exact wheel and check outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          shasum -a 256 dist/*.whl
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/shared-source-installed"
          cp tests/test_shared_sources.py tests/test_shared_build_views.py tests/test_gap_rmtree_readonly.py "$RUNNER_TEMP/shared-source-installed/"
          cd "$RUNNER_TEMP/shared-source-installed"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -c "from pathlib import Path; import amplifier_foundation as f; p = Path(f.__file__).resolve(); print(p); assert 'site-packages' in p.parts"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m pytest . --import-mode=importlib -o asyncio_mode=strict -o asyncio_default_fixture_loop_scope=function -q --tb=short -rA

  installed-consumers:
    name: Installed consumers (${{ matrix.os }}, Python 3.13 x64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The script builds ONE non-editable candidate wheel, then resolves the
      # pinned consumers independently. Agent's Core==2.0.1 is not compatible
      # with the CLI/Unified Core>=2.0.2 graph. Never combine those environments.
      # Windows also builds the exact pre-PR456 wheel into TWO separate baseline
      # venvs. Default-creation candidate/baseline cells use fresh synthetic HOME
      # boundaries, no session precreation, and the same pinned consumer graphs.
      # Pinned Agent/CLI cells qualify unchanged legacy defaults. Independent
      # Foundation append/reader checks select private before I/O and qualify
      # public private creation, not strict acceptance of an updated consumer.
      # Ubuntu retains only the existing privately prepared qualification cells.
      # Short build/install paths stay on the runner temp volume. Runtime state
      # separately uses canonical original TEMP, like native pytest, with full
      # production ancestor validation before creation; neither volume is trusted
      # merely because its path was selected or its spelling was normalized.
      - name: Select compact Windows fixture location
        id: windows-root
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $driveRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          if ($driveRoot -notmatch '^[A-Za-z]:\\$') { throw 'Expected a local runner temp drive' }
          $work = Join-Path $driveRoot ("ic-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          "work=$work" >> $env:GITHUB_OUTPUT

      - name: Build candidate and install isolated consumer graphs
        run: python -I -X utf8 tests/installed_consumer_compat.py --prepare --work "${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}"

      - name: Qualify installed SDK and CLI persistence
        if: ${{ always() && !cancelled() }}
        run: python -I -X utf8 tests/installed_consumer_compat.py --run --work "${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}"

      # Rescan the saved, normalized JSON. Failure withholds the entire upload;
      # never publish raw private state, command output, or exception messages.
      - name: Check public evidence before upload
        id: public-evidence
        if: ${{ always() && !cancelled() }}
        run: python -I -X utf8 tests/installed_consumer_compat.py --check-public --work "${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}"

      - name: Retain installed-consumer evidence
        if: ${{ always() && steps.public-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-consumers-${{ matrix.os }}-py313-x64
          path: ${{ steps.windows-root.outputs.work || format('{0}/installed-consumers', runner.temp) }}/evidence/*.json
          if-no-files-found: error
