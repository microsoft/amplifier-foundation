name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A Windows failure must not cancel the POSIX legs -- those tell us whether
    # we regressed the population that actually works today, which is the more
    # expensive outcome by far.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies (with grpc-adapter)
        run: uv sync --extra grpc-adapter

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short
