name: Observe session locking (diagnostic only)
on:
  push:
    branches: [diag/windows-session-locking]
permissions:
  contents: read
jobs:
  observe:
    name: ${{ matrix.purpose }} (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
            purpose: Native Windows observation
            expect: observe
          - os: windows-latest
            python: '3.12'
            purpose: Native Windows observation
            expect: observe
          - os: windows-latest
            python: '3.13'
            purpose: Native Windows observation
            expect: observe
          - os: ubuntu-latest
            python: '3.13'
            purpose: Required POSIX positive control
            expect: lock-pass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
      - name: Install dependencies
        run: uv sync --extra grpc-adapter
      - name: Observe unchanged ownership API (unsupported is not locking success)
        run: uv run --no-sync python scripts/session_locking_probe.py --expect ${{ matrix.expect }} --output locking-observation.json
      - name: Retain structured diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locking-${{ matrix.os }}-python-${{ matrix.python }}
          path: locking-observation.json
          if-no-files-found: error
          retention-days: 7