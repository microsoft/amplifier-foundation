name: Optional application libraries

on:
  push:
    branches: [main]
    paths: ['libraries/**', '.github/workflows/libraries.yml']
  pull_request:
    branches: [main]
    paths: ['libraries/**', '.github/workflows/libraries.yml']

jobs:
  installed-consumer:
    name: ${{ matrix.library }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: [scheduling, operations, worktrees, recall]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Build and test the installed library without the native runtime
        run: python libraries/qualify.py ${{ matrix.library }}
