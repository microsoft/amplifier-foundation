name: Optional application libraries

on:
  push:
    branches: [main]
    paths: ['libraries/**', '.github/workflows/libraries.yml']
  pull_request:
    branches: [main]
    paths: ['libraries/**', '.github/workflows/libraries.yml']

jobs:
  installed-consumer:
    name: ${{ matrix.library }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: [scheduling, operations, worktrees, recall]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
      - name: Build and test the installed library without the native runtime
        run: python libraries/qualify.py ${{ matrix.library }}
