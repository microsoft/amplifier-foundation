name: Optional application libraries

on:
  push:
    branches: [main]
    paths: ['libraries/**', '.github/workflows/libraries.yml']
  pull_request:
    branches: [main]
    paths: ['libraries/**', '.github/workflows/libraries.yml']

jobs:
  installed-consumer:
    name: ${{ matrix.library }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: [scheduling, operations, worktrees, recall]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
      - name: Build and test the installed library without the native runtime
        run: python libraries/qualify.py ${{ matrix.library }}
