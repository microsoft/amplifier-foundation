[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "amplifier-scheduling"
version = "0.1.0"
description = "Native-independent durable scheduling primitives"
requires-python = ">=3.11"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_scheduling"]

[dependency-groups]
dev = ["pytest>=8"]
