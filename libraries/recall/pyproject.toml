[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-recall"
version = "0.1.0"
description = "Reusable Amplifier recall library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/microsoft/amplifier-foundation/tree/main/libraries/recall"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_recall"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
