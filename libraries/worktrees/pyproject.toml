[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-worktrees"
version = "0.1.0"
description = "Reusable Amplifier worktrees library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["filelock>=3.16"]

[project.urls]
Repository = "https://github.com/microsoft/amplifier-foundation"
Documentation = "https://github.com/microsoft/amplifier-foundation/tree/main/libraries/worktrees"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_worktrees"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
