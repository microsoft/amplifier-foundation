bundle:
  name: behavior-agents
  version: 2.0.0
  description: |
    Agent orchestration capability with enhanced delegate tool.
    
    Features:
    - Two-parameter context inheritance (depth + scope)
    - Session resume (use full session_id from delegate calls)
    - Fixed tool inheritance (agent declarations honored)
    - Multi-agent collaboration patterns
    
    Note: This behavior uses the NEW delegate tool. For legacy task tool,
    use the 'tasks' behavior instead.

tools:
  # New delegate tool with enhanced features
  - module: tool-delegate
    source: git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate
    config:
      features:
        self_delegation:
          enabled: true
        session_resume:
          enabled: true
        context_inheritance:
          enabled: true
          max_turns: 10
        provider_selection:
          enabled: true
      settings:
        exclude_tools: [tool-delegate]  # Spawned agents can't further delegate by default
        exclude_hooks: []

  # Register foundation's own skills directory for discovery
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=skills"

hooks:
  # Same-batch read/skill coalescer. Ships default-OFF (see config below):
  # mounting this hook has zero runtime effect until a caller explicitly
  # sets enabled: true. Wired via the `agents` behavior (like tool-delegate
  # above) so every sub-session in a delegation tree inherits it, since a
  # parallel tool batch -- the case this hook targets -- is always within
  # one session.
  - module: hooks-tool-dedupe
    source: git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/hooks-tool-dedupe
    config:
      enabled: false                       # Stage 1 ships default-OFF
      tools: ["read_file", "load_skill"]
      min_bytes: 1000
      max_batches: 8

context:
  include:
    - foundation:context/agents/delegation-instructions.md
    - foundation:context/agents/multi-agent-patterns.md
