bundle:
  name: behavior-agents
  version: 2.0.0
  description: |
    Agent orchestration capability with enhanced delegate tool.
    
    Features:
    - Two-parameter context inheritance (depth + scope)
    - Session resume (use full session_id from delegate calls)
    - Fixed tool inheritance (agent declarations honored)
    - Multi-agent collaboration patterns
    
    Note: This behavior uses the NEW delegate tool. For legacy task tool,
    use the 'tasks' behavior instead.

tools:
  # New delegate tool with enhanced features
  - module: tool-delegate
    source: git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate
    config:
      features:
        self_delegation:
          enabled: true
        session_resume:
          enabled: true
        context_inheritance:
          enabled: true
          max_turns: 10
        provider_selection:
          enabled: true
      settings:
        exclude_tools: [tool-delegate]  # Spawned agents can't further delegate by default
        exclude_hooks: []

  # Register foundation's own skills directory for discovery
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=skills"

context:
  include:
    # AWARENESS ONLY -- 487 tokens on disk (len//4), the estimator's own unit.
    # The DEPTH halves (delegation-depth.md, multi-agent-patterns.md, ~5,250 tokens
    # together) are NOT loaded here. They are @-mentioned from the bodies of the
    # agents that can act on them: foundation-expert (the only agent declaring
    # tool-delegate) and session-analyst (the only agent that resumes sessions).
    - foundation:context/agents/delegation-core.md
