# validate-agents.yaml
# Agent Definition Validator Recipe v1.8.0
# Validates agent definitions in a bundle repository for quality, tool access, and structural requirements
#
# CHANGELOG:
# v1.8.0 - THE LENGTH GATE COULD NOT FIRE ON AN ALIGNED REPO, AND BARELY FIRED
#          ON AN UNALIGNED ONE.
#          The gate was tokens: WARN >300, ERROR >600 -- 1,200 and 2,400 chars
#          at the chars/4 estimator this repo uses. Measured 2026-09-07 across
#          9 bundle repos: foundation's own agents (the one corpus with PR
#          #341's policy applied) run n=24, mean 410, MAX 761 chars, so the
#          ERROR line sat above every description in the repo it was supposed
#          to govern. Now WARN >600 chars, ERROR >1,200 (2x the cap), as a
#          structural ERROR in structural-validation and as the quality gate in
#          quality-classification. Tokens remain a reported metric.
#        - The two numbers are BYTE-IDENTICAL to validate-bundle-repo.yaml
#          v3.15.0 Phase 2.8's AGENT_DESCRIPTION_WARN_CHARS/_ERROR_CHARS, and
#          tests/test_description_alignment_checks.py fails the build if they
#          diverge. Two validators that disagree about the cap are worse than
#          one.
#        - SCOPE NOTE: skill descriptions, awareness redundancy and bundle head
#          cost are repo-wide concerns and live in validate-bundle-repo.yaml
#          v3.15.0 (Phases 2.82 / 2.84 / 2.86). This recipe stays agent-scoped.
#        - No threshold, severity, skip rule or exclusion set changed other
#          than the description length gate named above.
# v1.7.0 - Two defects in v1.6.0's widened discovery, both silent.
#        - (1) CLASSIFICATION BY DIRECTORY NAME. v1.6.0 treated every
#          `agents/*.md` as an agent, so `context/agents/*.md` -- four
#          CONTEXT DOCUMENTS loaded as `context:` by `behaviors/agents.yaml`
#          and `behaviors/tasks.yaml`, which nothing spawns and which carry
#          no frontmatter because they are not agents -- produced four
#          NO_FRONTMATTER ERRORs and flipped the verdict PASS -> FAIL on a
#          repo with ZERO real agent defects. `context/agents/` merely
#          collides on the word "agents".
#          Discovery now classifies on `meta:` presence in the frontmatter --
#          the LOADER's own contract ("Agents ARE bundles ... the only
#          difference is the frontmatter key (`meta:` vs `bundle:`)",
#          docs/AGENT_AUTHORING.md). This is a CLASSIFIER, not an exclusion:
#          `EXCLUDED_PARTS` is untouched, every candidate is still walked,
#          and every non-agent is reported BY NAME AND REASON in the new
#          `non_agents_found` -- because an unexplained drop is the same
#          silence that let 11 violators survive two sweeps.
#          Frontmatter that exists but will not parse still counts as an
#          agent, so Phase 2 gets to report the YAML error rather than the
#          file vanishing from the run.
#        - (2) THE GLOB FOUND NOTHING ON WINDOWS. Every Python heredoc
#          interpolated `Path("{{repo_path}}")`, putting a filesystem path
#          inside a Python string literal, where each backslash becomes an
#          escape sequence. On a GitHub Actions Windows runner
#          (`D:\a\<repo>\<repo>`), `\a` became `\x07`, the path did not
#          exist, discovery printed `agents_found: []` and exited 0, and the
#          run reached PASS having validated NOTHING -- strictly worse than
#          the 23-of-32 under-count v1.6.0 replaced. The repo path now
#          arrives through the environment (`VALIDATE_AGENTS_REPO_PATH`),
#          which has no escape semantics, in all three affected steps
#          (environment-check, agent-discovery, structural-validation).
#          Discovery additionally EXITS NON-ZERO on a missing repo path
#          instead of printing an empty payload and exiting 0, so no future
#          path defect can reach a vacuous PASS quietly.
#          Caught by `TestDiscoveryScopeParity` on Windows 3.11/3.12/3.13 --
#          the guard v1.6.0 added. It is the only thing that noticed.
#        - Output gained `candidates_scanned`, `non_agents_found`,
#          `non_agent_count`, `non_agent_reasons`, `classifier` and
#          `classifier_mode`. `agents_found`, `total_count`,
#          `location_counts`, `search_locations`, `scan_patterns`,
#          `excluded_parts` and `errors` keep their shape -- downstream
#          steps are unchanged.
#        - No threshold, severity, skip rule or exclusion set changed.
# v1.6.0 - Agent discovery is now REPO-WIDE, matching the other two scopes
#          in this repo instead of diverging from them. Phase 1 walked a
#          hand-maintained list of three places (`agents/`,
#          `behaviors/*/agents/`, `bundles/*/agents/`); it now globs
#          `rglob("*/agents/*.md") + glob("agents/*.md")` and drops any path
#          containing an excluded part -- the identical pair
#          `validate-bundle-repo.yaml`'s `agent-description-validation` step
#          uses, and the identical exclusion set
#          `tests/test_anchors_bundles_dry.py`'s AGENT_SCAN_EXCLUDED_PARTS
#          uses (its five plus `docs`).
#        - WHY: the narrow walk was the ROOT CAUSE of a recurrence chain. On
#          amplifier-foundation it discovered 23 agents while the other two
#          scopes saw 32, so 11 `<example>` violators under
#          `experiments/**/agents/` survived #341 (which swept root
#          `agents/`) and ux32 (which swept `bundles/**`) -- and this recipe
#          reported "23 found, 3 locations" the whole time, with no signal
#          that other agent directories existed at all. A clean verdict that
#          is silent about its own blind spot is worse than a noisy one.
#        - Discovery output gained `location_counts` (per-directory counts),
#          `scan_patterns` and `excluded_parts`; `location` is now DERIVED
#          from each file's own parent directory rather than hardcoded, so a
#          new `agents/` directory names itself in the report the first time
#          it appears. `search_locations`, `agents_found` (with `path`,
#          `relative_path`, `name`, `location`), `total_count` and `errors`
#          keep their shape -- downstream steps are unchanged.
#        - The report now MUST print the coverage line (total + every
#          location with its count + the exclusion set) in both the executive
#          summary and the metadata, so an under-count is visible in the
#          output rather than silent.
#        - Discovery only. No check, threshold, severity or verdict rule
#          changed. On a repo whose agents all live in the three old
#          locations, output is identical.
# v1.5.1 - Prompt text caught up with the v1.4.0 example policy. The
#          quick-approval and synthesize-report prompts still invited the
#          model to offer "add <example> blocks" as optional polish, so a
#          clean repo could be told to introduce the exact structural ERROR
#          this recipe fails agents for. Both now forbid recommending
#          <example>/<commentary> at any severity, and say why: an agent
#          with none is in the REQUIRED shape, not missing a feature.
#        - The report's quality table listed an "Examples" column rendered
#          as OK/warn, which reads as "examples missing = warning" -- the
#          pre-v1.4.0 polarity. Renamed to "No Examples" with OK/error and
#          an explicit note on which way round it goes.
#        - Prompt text only; no step, condition or logic change.
# v1.5.0 - Portability: declare a schema_version 2 dependency manifest
#          (contract recipe-dependency-manifest.v1). The four
#          `agent: "foundation:zen-architect"` steps below previously
#          resolved out of the CALLING session's agent map; a caller
#          without that agent failed at run time with
#          "Agent 'foundation:zen-architect' not found in configuration".
#          They now resolve from this recipe's own declared closure.
#        - Self-referential on purpose: foundation's own recipe declares
#          foundation as a dependency. Core 11 forbids inferring a source
#          from the `foundation:` namespace prefix -- an undeclared
#          dependency is never guessed, so it must be written down.
#        - No behavior change under the legacy engine, which ignores both
#          new top-level keys. Recipe logic, steps and prompts untouched.
# v1.4.0 - Example-policy tightening: <example> blocks REJECTED ENTIRELY
#        - Guidance changed from "at most 2 examples, no <commentary>" to
#          "no <example> blocks at all" (foundation:context/shared/
#          description-authoring-principles.md V3). The eval evidence
#          (P2 delegation wave: stripping ALL examples + commentary did
#          not reduce delegation quality) supports full removal, not just
#          a cap.
#        - Any <example> block in meta.description is now a structural
#          ERROR (was: only >2 blocks warned). New code EXAMPLE_BLOCK_PRESENT.
#        - <commentary> tag presence is now ERROR (was WARNING) --
#          consistency: it only ever occurs inside a now-banned example.
#        - Removed the EXAMPLES_MISSING_CONTEXT / TOO_MANY_EXAMPLES checks
#          (moot once examples are banned outright, not merely capped).
#        - Both new/changed ERRORs feed into the existing has_errors ->
#          "critical" classification path -- no classify_agent changes
#          needed, the severity mapping already treats any ERROR as
#          critical.
#        - Description Quality (Phase 4) prompt updated to stop treating
#          "1-2 examples, no commentary" as a target shape, and to note
#          example/commentary presence is now caught deterministically in
#          Phase 2 (structural-validation), not judged by the LLM.
#        - Report synthesis (Phase 6) severity guide and metadata updated
#          to match.
# v1.3.1 - BUG 2(i) fix: honor the injected AMPLIFIER_PYTHON interpreter
#          (NOTE: patch bump of the authoritative `version:` field, which was
#          already at 1.3.0 — ahead of this changelog's prior 1.2.x entries,
#          pre-existing header/field drift left otherwise untouched)
#        - All 5 python3 heredocs used a BARE `python3`, ignoring the
#          AMPLIFIER_PYTHON interpreter the executor injects into every bash step
#          (validate-recipes.yaml already uses "${AMPLIFIER_PYTHON:-python3}"
#          correctly). Converted ALL 5 heredocs to "${AMPLIFIER_PYTHON:-python3}"
#          so agent validation runs on the interpreter that actually has the
#          amplifier packages installed, matching the repo-wide validator.
# v1.2.3 - Fixed multiline string interpolation bug
#        - Remove frontmatter and meta fields from structural_results before JSON output
#        - These fields contain multiline descriptions that break JSON parsing in downstream steps
#        - All needed validation fields (has_strong_trigger, has_examples, etc.) are preserved
#
# v1.2.2 - Fixed JSON interpolation bug in Python steps
#        - Template variables now parsed via json.loads() instead of direct interpolation
#        - Fixes boolean true/false (JSON) vs True/False (Python) mismatch
#
# v1.2.1 - Fixed bundle-level tool detection (bundle-level tools pattern)
#        - Tools defined in bundles/*.yaml now count as explicit
#        - Fixed undefined variable handling when LLM phases are skipped
#        - Phase 6 now gracefully handles missing quality_results/tool_analysis
#
# v1.2.0 - Added deterministic quality classification with explicit PASS thresholds
#        - Made LLM phases conditional (skip when all agents pass)
#        - Added quick-approval path for clean bundles
#        - Added "What is NOT an issue" guidance to prevent nitpicking
#        - Reduced false positives from subjective LLM evaluation
#
# v1.1.0 - Added Context label checking for examples
#        - Added minimum description length validation
#        - Added concrete before/after examples in prompts
#
# v1.0.0 - Initial release based on manual audit findings
#
# Based on manual audit findings:
# - Missing tool declarations
# - Weak activation triggers ("Use when..." instead of "MUST/ALWAYS")
# - Missing <example> blocks in descriptions
# - Implicit tool dependencies
#
# PASS THRESHOLDS (explicit criteria for "good enough"):
# - No structural errors (valid YAML, has meta.name, meta.description)
# - No <example> or <commentary> blocks in the description (v1.4.0: ERROR --
#   description-authoring-principles.md V3 bans them entirely, not just >2)
# - Has explicit tools section (even if empty [])
# - Description >= 100 characters
# - Description length cap respected: WARN >600 chars, ERROR >1200
#   (v1.8.0 -- see foundation:context/shared/
#   description-authoring-principles.md V5)
#
# NOTE: presence of MUST/ALWAYS/REQUIRED/PROACTIVELY keywords is reported
# as a METRIC, not a pass/fail gate. A measured eval campaign found these
# keywords do not by themselves indicate quality, and requiring them
# measurably harmed compliant models (see description-authoring-
# principles.md V1, V6). <example>/<commentary> blocks, by contrast, ARE a
# gate as of v1.4.0 -- see PASS THRESHOLDS above and V3.
#
# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=foundation:recipes/validate-agents.yaml \
#     context='{"repo_path": "/path/to/bundle-repo"}'

# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller that lacks these agents can still run it.
# Pinned to the released tag `v2.1.2`. Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit SHA,
# so a tag is the most immutable pin a `source:` can currently express.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-foundation@v2.1.2"
    kind: bundle
    required_agents:
      - "foundation:zen-architect"
# ---------------------------------------------------------------------------

name: validate-agents
description: |
  Validates Amplifier agent definitions in a bundle repository against:
  
  - **Structural Requirements** (ERROR): Valid YAML frontmatter, required meta fields,
    no `<example>`/`<commentary>` blocks in the description (v1.4.0)
  - **Tool Access** (WARNING): Explicit tools section, appropriate tools for role
  - **Description Quality** (SUGGESTION): Activation triggers, WHY/WHEN/WHAT guidance
  
  Produces a validation report with findings categorized by severity and actionable remediation.
  
  **Discovery scope (v1.6.0):** every `agents/*.md` anywhere in the repo, excluding
  `test-fixtures/`, `tests/`, `node_modules/`, `.git/`, `.venv/` and `docs/` -- the
  same scope `validate-bundle-repo.yaml` and the repo-wide guard test use. The report
  names every location it walked and the total it found, so under-coverage shows up in
  the output instead of hiding behind a clean verdict.

  **Classification (v1.7.0):** a scanned file is an agent when its frontmatter declares
  a top-level `meta:` key -- the loader's own contract, not the directory name. A file
  under an `agents/` directory that declares no `meta:` (e.g. `context/agents/*.md`,
  which are context documents loaded via `context:`) is reported as a NON-AGENT with its
  reason, never silently dropped and never validated as an agent.

  **v1.2.0 Improvements:**
  - Deterministic quality classification before LLM analysis
  - Explicit PASS thresholds - no more "always finding something"
  - Quick-approval path for bundles that meet all standards
  - LLM phases only run when genuinely needed
  
  This recipe helps maintain agent quality across the Amplifier ecosystem by codifying
  the audit criteria discovered in manual reviews.
version: "1.8.0"
author: "Amplifier Foundation Team"
tags: ["agents", "validation", "quality", "audit", "tools", "descriptions"]

context:
  repo_path: ""  # Required: Path to bundle repository containing agents/

steps:
  # ============================================================================
  # PHASE 0: Environment Check
  # Verify we have the tools needed for validation
  # ============================================================================

  - id: "environment-check"
    type: "bash"
    command: |
      VALIDATE_AGENTS_REPO_PATH="{{repo_path}}" "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import os
      import sys
      from pathlib import Path

      # v1.7.0: the repo path arrives through the ENVIRONMENT, never
      # interpolated into Python source. `{{repo_path}}` inside a Python string
      # literal makes every backslash an escape sequence, which silently
      # destroys any Windows path. See the agent-discovery step for the
      # measurement and the cost.
      REPO_PATH = os.environ["VALIDATE_AGENTS_REPO_PATH"]

      results = {
          "phase": "environment",
          "python_version": sys.version,
          "yaml_available": False,
          "repo_path": REPO_PATH,
          "repo_exists": False,
          "errors": []
      }

      # Check YAML parsing capability
      try:
          import yaml
          results["yaml_available"] = True
      except ImportError:
          results["errors"].append({
              "type": "import_error",
              "message": "PyYAML not available - required for parsing agent frontmatter",
              "suggestion": "uv pip install pyyaml"
          })

      # Check repo path exists
      repo_path = Path(REPO_PATH).expanduser().resolve()
      if repo_path.exists() and repo_path.is_dir():
          results["repo_exists"] = True
          results["repo_path_resolved"] = str(repo_path)
      else:
          results["errors"].append({
              "type": "path_error",
              "message": f"Repository path does not exist or is not a directory: {REPO_PATH}"
          })

      print(json.dumps(results))
      EOF
    output: "env_check"
    parse_json: true
    timeout: 30
    on_error: "fail"

  # ============================================================================
  # PHASE 1: Agent Discovery
  # Find all agent definition files in the repository
  # ============================================================================

  - id: "agent-discovery"
    type: "bash"
    command: |
      VALIDATE_AGENTS_REPO_PATH="{{repo_path}}" "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import os
      import re
      import sys
      from pathlib import Path

      try:
          import yaml
      except ImportError:
          yaml = None

      # --- How the repo path reaches this step (v1.7.0) ----------------------
      # Through the ENVIRONMENT. It is never interpolated into Python source.
      #
      # `Path("{{repo_path}}")` -- what v1.6.0 and earlier wrote -- puts a
      # filesystem path inside a Python string literal, so every backslash in
      # it becomes an escape sequence. Measured on a GitHub Actions Windows
      # runner, whose checkout lives at `D:\a\<repo>\<repo>`:
      #
      #     Path("D:\a\amplifier-foundation\amplifier-foundation")
      #       -> 'D:\x07mplifier-foundation\x07mplifier-foundation'
      #       -> .exists() is False
      #
      # Discovery then took the "path does not exist" branch, printed a valid
      # JSON payload with `agents_found: []`, and exited 0. Structural
      # validation saw 0 agents, 0 errors; quality classification called that
      # "good"; the run reached the quick-approval path and reported PASS
      # having validated nothing. A vacuous PASS is strictly worse than the
      # 23-of-32 under-count v1.6.0 replaced -- the under-count at least
      # checked 23 files. `TestDiscoveryScopeParity` is what caught this, on
      # Windows 3.11/3.12/3.13, which is why that guard must not be relaxed.
      #
      # An environment variable has no escape semantics, so the path arrives
      # byte-for-byte on every platform.
      REPO_PATH = os.environ["VALIDATE_AGENTS_REPO_PATH"]

      # --- Agent-discovery scope (v1.6.0) ------------------------------------
      # This set is COPIED, not approximated, from the two places that already
      # agree on it. Do not fork a third list here.
      #
      #   1. `recipes/validate-bundle-repo.yaml`, step `agent-description-
      #      validation`: `EXCLUDED_DIRS = {"test-fixtures", "tests",
      #      "node_modules", ".git", ".venv"}` over
      #      `rglob("*/agents/*.md") + glob("agents/*.md")`.
      #   2. `tests/test_anchors_bundles_dry.py`, `AGENT_SCAN_EXCLUDED_PARTS`
      #      (added by lane 6phe): the same five plus `docs`, because `docs/`
      #      holds frozen lane records that quote violations verbatim as
      #      evidence and must never be rewritten.
      #
      # Before v1.6.0 this step walked only `agents/`, `behaviors/*/agents/`
      # and `bundles/*/agents/` -- 23 files here, while the other two scopes
      # saw 32. That asymmetry is the ROOT CAUSE of a recurrence chain: 11
      # `<example>` violators under `experiments/**/agents/` survived both
      # #341 (which swept root `agents/`) and ux32 (which swept `bundles/**`),
      # because the recipe most people run never looked there, and reported a
      # clean "23 found, 3 locations" while doing it.
      EXCLUDED_PARTS = {
          "test-fixtures",
          "tests",
          "node_modules",
          ".git",
          ".venv",
          "docs",
      }

      # The glob pair, reported in the output so a reader can reproduce the scan.
      SCAN_PATTERNS = ["<repo>/**/agents/*.md", "<repo>/agents/*.md"]

      # --- What makes a file an agent (v1.7.0) -------------------------------
      # `meta:` in the frontmatter -- the LOADER's own contract, quoted from
      # `docs/AGENT_AUTHORING.md`:
      #
      #   "Agents ARE bundles. They use the same file format and are loaded via
      #    load_bundle(). The only difference is the frontmatter key
      #    (`meta:` vs `bundle:`)."
      #
      # NOT the directory name. v1.6.0 classified by directory name, so
      # `context/agents/*.md` -- four CONTEXT DOCUMENTS loaded as `context:` by
      # `behaviors/agents.yaml:44-45` and `behaviors/tasks.yaml:18-19`, which
      # nothing spawns and which carry no frontmatter because they are not
      # agents -- were validated as agents and produced four NO_FRONTMATTER
      # ERRORs. That flipped the verdict PASS -> FAIL on a repo with zero real
      # agent defects. The directory merely collides on the word "agents".
      #
      # A validator that cries wolf gets muted, which costs more than the
      # coverage gap v1.6.0 closed -- so this is a classifier fix, NOT an
      # exclusion. No path is skipped: `EXCLUDED_PARTS` is untouched, every
      # candidate is still walked, and every non-agent is REPORTED by name and
      # reason in `non_agents_found`. Silence is what let 11 violators survive
      # two sweeps; this must not reintroduce it in a new place.
      FRONTMATTER_RE = re.compile(r"\A---\s*\r?\n(.*?)\r?\n---\s*\r?\n", re.DOTALL)
      # Fallback only, for an environment without PyYAML: a top-level `meta:`
      # key at column 0 of the frontmatter block.
      META_KEY_RE = re.compile(r"^meta\s*:", re.MULTILINE)

      CLASSIFIER_MODE = "yaml" if yaml is not None else "regex-fallback"
      CLASSIFIER = "frontmatter declares a top-level `meta:` key (docs/AGENT_AUTHORING.md)"

      def classify(agent_file: Path) -> tuple:
          """Return (is_agent, reason) for one candidate file.

          Frontmatter that exists but cannot be parsed counts as an AGENT on
          purpose: the file is plainly trying to be one, and structural
          validation must get the chance to report the YAML error. Only a file
          that cleanly declares no `meta:` is classified out.
          """
          try:
              content = agent_file.read_text(encoding="utf-8")
          except Exception as exc:
              # Unreadable is not "not an agent" -- keep it, let Phase 2 say so.
              return True, f"unreadable ({exc.__class__.__name__})"

          match = FRONTMATTER_RE.match(content)
          if not match:
              return False, "no_frontmatter"

          block = match.group(1)
          if yaml is None:
              return bool(META_KEY_RE.search(block)), (
                  "meta_present" if META_KEY_RE.search(block) else "frontmatter_without_meta"
              )

          try:
              frontmatter = yaml.safe_load(block)
          except Exception:
              return True, "unparseable_frontmatter"

          if isinstance(frontmatter, dict) and "meta" in frontmatter:
              return True, "meta_present"
          return False, "frontmatter_without_meta"

      def discover_agents(repo_path: str) -> dict:
          """Discover every agent definition file in a repository.

          Repo-wide by design: any `agents/` directory at any depth, minus
          EXCLUDED_PARTS. A location that is missing from this walk is a
          location the validator cannot report on, so the walk must not be a
          hand-maintained list of the places agents happened to live.

          Candidates are then CLASSIFIED by `meta:` presence, not by where they
          live. Both numbers are reported: what was scanned, and what was
          judged an agent.
          """
          results = {
              "phase": "discovery",
              "repo_path": repo_path,
              "agents_found": [],
              "total_count": 0,
              "search_locations": [],
              "location_counts": {},
              "scan_patterns": SCAN_PATTERNS,
              "excluded_parts": sorted(EXCLUDED_PARTS),
              "classifier": CLASSIFIER,
              "classifier_mode": CLASSIFIER_MODE,
              "candidates_scanned": 0,
              "non_agents_found": [],
              "non_agent_count": 0,
              "non_agent_reasons": {},
              "errors": []
          }

          path = Path(repo_path).expanduser().resolve()

          if not path.exists():
              results["errors"].append({
                  "type": "path_error",
                  "message": f"Repository path does not exist: {repo_path}"
              })
              print(json.dumps(results))
              # Exit LOUD. Printing an empty-but-valid payload and exiting 0 is
              # exactly how the Windows escape bug reached a PASS verdict having
              # validated nothing. A bad repo path is a run-ending condition,
              # not a finding about the repo.
              sys.exit(1)

          # rglob("*/agents/*.md") reaches every nested agents/ directory;
          # glob("agents/*.md") adds the repo-root one, which the rglob
          # pattern's leading `*/` cannot match.
          candidates = list(path.rglob("*/agents/*.md")) + list((path / "agents").glob("*.md"))

          seen = set()
          for agent_file in sorted(candidates):
              relative = agent_file.relative_to(path)
              if EXCLUDED_PARTS & set(relative.parts):
                  continue
              resolved = agent_file.resolve()
              if resolved in seen:
                  continue
              seen.add(resolved)
              results["candidates_scanned"] += 1

              # "location" is the containing directory, repo-relative, with a
              # trailing slash -- e.g. "agents/", "bundles/anchors/agents/".
              # Derived from the path rather than hardcoded, so a new agents/
              # directory names itself in the report the first time it appears.
              location = relative.parent.as_posix() + "/"

              is_agent, reason = classify(agent_file)
              if not is_agent:
                  results["non_agents_found"].append({
                      "relative_path": relative.as_posix(),
                      "location": location,
                      "reason": reason
                  })
                  results["non_agent_reasons"][reason] = results["non_agent_reasons"].get(reason, 0) + 1
                  continue

              results["agents_found"].append({
                  "path": str(agent_file),
                  "relative_path": relative.as_posix(),
                  "name": agent_file.stem,
                  "location": location
              })
              results["location_counts"][location] = results["location_counts"].get(location, 0) + 1

          results["search_locations"] = [str(path / loc) for loc in sorted(results["location_counts"])]
          results["location_counts"] = dict(sorted(results["location_counts"].items()))
          results["total_count"] = len(results["agents_found"])
          results["non_agent_count"] = len(results["non_agents_found"])
          results["non_agent_reasons"] = dict(sorted(results["non_agent_reasons"].items()))

          if results["total_count"] == 0:
              results["errors"].append({
                  "type": "no_agents",
                  "message": (
                      "No agent files found in repository "
                      f"({results['candidates_scanned']} candidate file(s) scanned, "
                      f"{results['non_agent_count']} classified as non-agents)"
                  ),
                  "searched": SCAN_PATTERNS,
                  "excluded_parts": sorted(EXCLUDED_PARTS),
                  "classifier": CLASSIFIER
              })

          print(json.dumps(results))
          return results

      discover_agents(REPO_PATH)
      EOF
    output: "discovery_results"
    parse_json: true
    timeout: 60
    on_error: "fail"
    depends_on: ["environment-check"]

  # ============================================================================
  # PHASE 2: Structural Validation (Deterministic)
  # Parse YAML frontmatter, check required fields
  # Severity: ERROR for issues that will break loading
  # ============================================================================

  - id: "structural-validation"
    type: "bash"
    command: |
      VALIDATE_AGENTS_REPO_PATH="{{repo_path}}" "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import os
      import re
      from pathlib import Path

      # v1.7.0: through the environment, never a Python string literal --
      # see the agent-discovery step for what interpolating it costs on Windows.
      REPO_PATH = os.environ["VALIDATE_AGENTS_REPO_PATH"]

      try:
          import yaml
      except ImportError:
          print(json.dumps({
              "phase": "structural",
              "skipped": True,
              "reason": "PyYAML not available"
          }))
          exit(0)

      # amplifier_foundation is not guaranteed to be importable in every
      # environment this recipe runs in (it is run against third-party bundle
      # repos). Degrade to a no-op rather than killing the whole run: an
      # unhandled ImportError here produces no JSON, and quality-classification
      # parses this step's output unguarded with on_error: "fail".
      try:
          from amplifier_foundation.validator import check_body_is_instruction
      except ImportError:
          def check_body_is_instruction(content):
              return {"verdict": "SKIPPED", "prose_chars": 0, "prose_preview": "", "reason": "amplifier_foundation not available"}

      # Valid model roles per role taxonomy v2 (2026-03-01)
      # Update when roles are added/removed from the routing matrix schema
      VALID_MODEL_ROLES = {
          "coding", "ui-coding", "vision", "security-audit", "reasoning",
          "critique", "creative", "writing", "research", "image-gen",
          "critical-ops", "fast", "general"
      }

      DEPRECATED_ROLES = {
          "agentic": "Remove or replace with 'general', 'fast', or 'critical-ops'",
          "coding-image": "Renamed to 'vision'",
          "planning": "Renamed to 'reasoning'",
      }

      # v1.8.0: description length caps, in CHARACTERS (description-authoring-
      # principles.md V5). Measured 2026-09-07 across 9 bundle repos: the one
      # corpus with the #341 policy applied (foundation, n=24, mean 410, max
      # 761) has ZERO descriptions over 1,200 chars; unswept repos put 17 of 54
      # there. Kept BYTE-IDENTICAL to validate-bundle-repo.yaml Phase 2.8's
      # AGENT_DESCRIPTION_WARN_CHARS / _ERROR_CHARS -- two validators that
      # disagree about the cap are worse than one.
      DESCRIPTION_WARN_CHARS = 600
      DESCRIPTION_ERROR_CHARS = 1200

      discovery = json.loads('''{{discovery_results}}''')
      
      def get_bundle_level_tools(repo_path: str) -> dict:
          """
          Parse bundles/*.yaml files to find tool definitions at bundle level.
          Returns a dict mapping agent names to their bundle-defined tools.
          
          This handles the bundle-level tools pattern where tools are defined
          in bundle.yaml rather than agent frontmatter.
          """
          bundle_tools = {}
          path = Path(repo_path).expanduser().resolve()
          bundles_dir = path / "bundles"
          
          if not bundles_dir.exists():
              return bundle_tools
          
          for bundle_file in bundles_dir.glob("*.yaml"):
              try:
                  content = bundle_file.read_text(encoding='utf-8')
                  bundle_data = yaml.safe_load(content)
                  
                  if not isinstance(bundle_data, dict):
                      continue
                  
                  # Check for agents defined in the bundle
                  agents = bundle_data.get("agents", [])
                  if isinstance(agents, list):
                      for agent in agents:
                          if isinstance(agent, dict):
                              agent_name = agent.get("name")
                              if agent_name and "tools" in agent:
                                  bundle_tools[agent_name] = {
                                      "source": str(bundle_file.relative_to(path)),
                                      "tools": agent.get("tools", [])
                                  }
              except Exception:
                  # Skip files that can't be parsed
                  continue
          
          return bundle_tools
      
      # Pre-load bundle-level tool definitions
      bundle_level_tools = get_bundle_level_tools(REPO_PATH)
      
      def parse_agent_frontmatter(file_path: str) -> dict:
          """Parse YAML frontmatter from an agent markdown file."""
          result = {
              "path": file_path,
              "has_frontmatter": False,
              "frontmatter": None,
              "meta": None,
              "errors": [],
              "warnings": []
          }

          try:
              content = Path(file_path).read_text(encoding='utf-8')
          except Exception as e:
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "READ_ERROR",
                  "message": f"Failed to read file: {e}"
              })
              return result

          # Extract YAML frontmatter (between --- markers)
          frontmatter_match = re.match(r'^---\s*\n(.*?)\n---\s*\n', content, re.DOTALL)
          
          if not frontmatter_match:
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "NO_FRONTMATTER",
                  "message": "Agent file missing YAML frontmatter (--- markers)",
                  "remediation": "Add YAML frontmatter at the start of the file between --- markers"
              })
              return result

          result["has_frontmatter"] = True
          frontmatter_text = frontmatter_match.group(1)

          # Parse YAML
          try:
              frontmatter = yaml.safe_load(frontmatter_text)
              result["frontmatter"] = frontmatter
          except yaml.YAMLError as e:
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "YAML_PARSE_ERROR",
                  "message": f"Invalid YAML in frontmatter: {e}",
                  "remediation": "Fix YAML syntax errors in frontmatter"
              })
              return result

          if not isinstance(frontmatter, dict):
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "INVALID_FRONTMATTER",
                  "message": "Frontmatter must be a YAML dictionary",
                  "remediation": "Ensure frontmatter contains key-value pairs"
              })
              return result

          # Check for meta section
          if "meta" not in frontmatter:
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "MISSING_META",
                  "message": "Agent file missing 'meta:' section in frontmatter",
                  "remediation": "Add meta: section with name and description"
              })
              return result

          meta = frontmatter.get("meta", {})
          result["meta"] = meta

          # Check required meta fields
          if not meta.get("name"):
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "MISSING_META_NAME",
                  "message": "Agent missing 'meta.name' - agent won't be identifiable",
                  "remediation": "Add meta.name with a descriptive agent name"
              })

          if not meta.get("description"):
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "MISSING_META_DESCRIPTION",
                  "message": "Agent missing 'meta.description' - agent won't appear in delegate tool",
                  "remediation": "Add meta.description explaining WHAT the agent does and WHEN to use it"
              })

          # Check for tools section (WARNING level)
          # First check frontmatter, then check bundle-level tools
          agent_name = Path(file_path).stem
          has_frontmatter_tools = "tools" in frontmatter
          has_bundle_tools = agent_name in bundle_level_tools
          
          if has_frontmatter_tools:
              result["has_explicit_tools"] = True
              result["tools_source"] = "frontmatter"
              if not frontmatter.get("tools"):
                  # Empty tools section is OK - it's explicit
                  pass
          elif has_bundle_tools:
              # Tools defined at bundle level (bundle-level tools pattern)
              result["has_explicit_tools"] = True
              result["tools_source"] = "bundle"
              result["bundle_tools_file"] = bundle_level_tools[agent_name]["source"]
          else:
              result["warnings"].append({
                  "severity": "WARNING",
                  "code": "NO_TOOLS_SECTION",
                  "message": "Agent has no explicit 'tools:' section - relying on inheritance",
                  "remediation": "Add explicit tools: section to declare tool dependencies (in frontmatter or bundle.yaml)"
              })
              result["has_explicit_tools"] = False
              result["tools_source"] = "implicit"

          # ── model_role validation ──────────────────────────────────
          # model_role can be top-level or inside meta
          raw_model_role = frontmatter.get("model_role") or meta.get("model_role")
          result["has_model_role"] = raw_model_role is not None
          result["model_role_value"] = raw_model_role
          result["model_role_issues"] = []

          if raw_model_role is None:
              result["model_role_issues"].append(
                  "WARNING: No model_role declared — model routing will use session default. "
                  "Consider adding model_role for explicit routing."
              )
          else:
              # Normalize to list
              if isinstance(raw_model_role, str):
                  model_role_list = [raw_model_role]
              elif isinstance(raw_model_role, list):
                  model_role_list = raw_model_role
              else:
                  result["model_role_issues"].append(
                      f"ERROR: model_role must be a string or list, got {type(raw_model_role).__name__}"
                  )
                  model_role_list = []

              for role in model_role_list:
                  if not isinstance(role, str):
                      result["model_role_issues"].append(
                          f"ERROR: model_role entries must be strings, got {type(role).__name__}: {role}"
                      )
                      continue
                  if role in DEPRECATED_ROLES:
                      suggestion = DEPRECATED_ROLES[role]
                      result["model_role_issues"].append(
                          f"ERROR: model_role '{role}' is deprecated — {suggestion}"
                      )
                  elif role not in VALID_MODEL_ROLES:
                      valid_list = ", ".join(sorted(VALID_MODEL_ROLES))
                      result["model_role_issues"].append(
                          f"ERROR: model_role '{role}' is not a valid role. "
                          f"Valid roles: {valid_list}"
                      )

              # Check fallback chain ends with general or fast
              str_roles = [r for r in model_role_list if isinstance(r, str)]
              if len(str_roles) > 1 and str_roles[-1] not in ("general", "fast"):
                  result["model_role_issues"].append(
                      "WARNING: model_role fallback chain does not end with 'general' or 'fast'. "
                      "Consider adding 'general' or 'fast' as the last entry for reliable fallback."
                  )

              # Add model_role warnings/errors to the agent's warnings/errors lists
              for issue in result["model_role_issues"]:
                  if issue.startswith("ERROR:"):
                      result["errors"].append({
                          "severity": "ERROR",
                          "code": "INVALID_MODEL_ROLE",
                          "message": issue[len("ERROR: "):],
                          "remediation": "Update model_role in frontmatter to use valid role names"
                      })
                  elif issue.startswith("WARNING:"):
                      result["warnings"].append({
                          "severity": "WARNING",
                          "code": "MODEL_ROLE_WARNING",
                          "message": issue[len("WARNING: "):],
                          "remediation": "Add model_role to frontmatter for explicit model routing"
                      })

          # Extract description for later analysis
          description = meta.get("description", "")
          result["description_length"] = len(description) if description else 0
          result["has_examples"] = "<example>" in description.lower() if description else False

          # Description token budget estimate (Foundation's standard formula:
          # len(content) // 4 -- see experiments/bundle-configurator/
          # amplifier_configurator/tokens.py). Reported as a metric; see
          # quality-classification for the WARN/ERROR gate.
          result["description_tokens"] = len(description) // 4 if description else 0

          # Track activation-keyword usage as a METRIC, not a pass/fail gate.
          # A measured eval campaign found requiring these keywords does not
          # by itself indicate quality and measurably harmed compliant models
          # (see foundation:context/shared/description-authoring-principles.md
          # V1, V3, V6). has_strong_trigger/triggers_found are reported for
          # visibility only.
          STRONG_TRIGGERS = ["MUST", "ALWAYS", "REQUIRED", "PROACTIVELY", "DO NOT"]
          result["has_strong_trigger"] = any(
              trigger in description.upper() 
              for trigger in STRONG_TRIGGERS
          ) if description else False
          result["absolute_keyword_count"] = sum(
              description.upper().count(trigger) for trigger in STRONG_TRIGGERS
          ) if description else 0
          
          # Track which triggers were found (for reporting)
          result["triggers_found"] = [
              trigger for trigger in STRONG_TRIGGERS 
              if trigger in description.upper()
          ] if description else []

          # Check minimum description length (100 chars)
          MIN_DESCRIPTION_LENGTH = 100
          if result["description_length"] < MIN_DESCRIPTION_LENGTH:
              result["warnings"].append({
                  "severity": "WARNING",
                  "code": "SHORT_DESCRIPTION",
                  "message": f"Description is too short ({result['description_length']} chars, minimum {MIN_DESCRIPTION_LENGTH})",
                  "remediation": "Expand description to explain WHAT the agent does and WHEN to delegate to it"
              })

          # v1.8.0: the length CAP, in characters. WARN at the cap, ERROR at 2x.
          # description-authoring-principles.md V5. Chars, not tokens: chars are
          # the unit every head measurement in this program was taken in, they
          # need no tokenizer, and a validator counts them identically on every
          # platform. The superseded token tier (ERROR >600 tokens == 2,400
          # chars) sat ABOVE the longest description in every already-aligned
          # repo measured (foundation max 761), so it could not fire on the
          # defect it existed to catch.
          if result["description_length"] > DESCRIPTION_ERROR_CHARS:
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "DESCRIPTION_EXCESSIVE",
                  "message": (
                      f"Description is {result['description_length']} chars "
                      f"(>{DESCRIPTION_ERROR_CHARS}, 2x the {DESCRIPTION_WARN_CHARS}-char cap)"
                  ),
                  "remediation": (
                      f"Shorten to <={DESCRIPTION_WARN_CHARS} chars. For a proposed rewrite WITH a "
                      "fidelity table (so a routing fact cannot be dropped silently), run "
                      "recipes/refresh-descriptions.yaml. See description-authoring-principles.md V5/V7."
                  )
              })
          elif result["description_length"] > DESCRIPTION_WARN_CHARS:
              result["warnings"].append({
                  "severity": "WARNING",
                  "code": "DESCRIPTION_HIGH",
                  "message": f"Description is {result['description_length']} chars (>{DESCRIPTION_WARN_CHARS} cap)",
                  "remediation": (
                      f"Trim toward <={DESCRIPTION_WARN_CHARS} chars. See "
                      "description-authoring-principles.md V5/V7."
                  )
              })

          # Check for <commentary> tags -- v1.4.0: ERROR, not WARNING.
          # <commentary> only ever occurs inside an <example> block, and
          # example blocks are now rejected entirely (see below), so this
          # is treated with the same severity for consistency.
          result["commentary_count"] = description.lower().count("<commentary>") if description else 0
          if result["commentary_count"] > 0:
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "COMMENTARY_TAG_PRESENT",
                  "message": f"Description contains {result['commentary_count']} <commentary> tag(s) -- <commentary> tags are rejected entirely",
                  "remediation": "Delete <commentary> tags (and the <example> block containing them -- see description-authoring-principles.md V3)"
              })

          # Check for <example> blocks -- v1.4.0: REJECTED ENTIRELY, not
          # merely capped at 2. description-authoring-principles.md V3: the
          # eval evidence (P2 delegation wave) showed removing ALL examples
          # does not reduce delegation quality, so any occurrence is now a
          # structural ERROR, not a metric.
          if result["has_examples"]:
              example_blocks = re.findall(r'<example>(.*?)</example>', description, re.DOTALL | re.IGNORECASE)
              result["example_count"] = len(example_blocks)
              result["errors"].append({
                  "severity": "ERROR",
                  "code": "EXAMPLE_BLOCK_PRESENT",
                  "message": f"Description has {len(example_blocks)} <example> block(s) -- example blocks are rejected entirely, not merely capped",
                  "remediation": "Delete all <example> blocks. State the trigger condition as a decision rule in the WHEN clause instead (description-authoring-principles.md V6). If a worked example is genuinely useful for human authors, put it in a body doc, not the description field (see V3)."
              })
          else:
              result["example_count"] = 0

          # Check whether the body (below frontmatter) reads as instruction, not
          # documentation -- everything below frontmatter is sent to the model
          # as system instruction (WARNING level, not ERROR)
          body_check = check_body_is_instruction(content)
          if body_check["verdict"] == "FLAG":
              result["warnings"].append({
                  "severity": "WARNING",
                  "code": "PROSE_BELOW_FRONTMATTER",
                  "message": f"{Path(file_path).name}: body has {body_check['prose_chars']} chars of documentation-style prose below the frontmatter: \"{body_check['prose_preview']}\"",
                  "remediation": "Everything below the frontmatter is sent to the model as system instruction. Move descriptive prose into the frontmatter description field (metadata, never sent) or delete it. Keep @mention pointers to instruction files."
              })

          return result

      def validate_all_agents():
          results = {
              "phase": "structural",
              "skipped": False,
              "agents": [],
              "summary": {
                  "total": 0,
                  "passed": 0,
                  "errors": 0,
                  "warnings": 0
              }
          }

          for agent in discovery.get("agents_found", []):
              agent_result = parse_agent_frontmatter(agent["path"])
              agent_result["name"] = agent["name"]
              agent_result["location"] = agent["location"]
              agent_result["relative_path"] = agent["relative_path"]
              
              # Remove fields that contain multiline content and break JSON interpolation
              # These fields are only needed for validation within this step, not downstream
              for field in ["frontmatter", "meta"]:
                  agent_result.pop(field, None)
              
              results["agents"].append(agent_result)
              results["summary"]["total"] += 1
              
              if agent_result["errors"]:
                  results["summary"]["errors"] += len(agent_result["errors"])
              else:
                  results["summary"]["passed"] += 1
              
              if agent_result.get("warnings"):
                  results["summary"]["warnings"] += len(agent_result["warnings"])

          print(json.dumps(results))

      validate_all_agents()
      EOF
    output: "structural_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["agent-discovery"]

  # ============================================================================
  # PHASE 2.5: Quality Classification (Deterministic)
  # Classify overall quality level to determine if LLM analysis is needed
  # This is the key v1.2.0 addition - explicit PASS thresholds
  # ============================================================================

  - id: "quality-classification"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json

      # Parse structural_results as JSON (uses true/false, not True/False)
      structural = json.loads('''{{structural_results}}''')

      # EXPLICIT PASS THRESHOLDS
      # An agent PASSES if it meets ALL of these criteria:
      # 1. No structural errors (valid YAML, has meta.name, meta.description)
      # 2. Has explicit tools section (even if empty)
      # 3. Description >= 100 characters
      # 4. Description length cap respected, in CHARS (v1.8.0: WARN >600,
      #    ERROR >1200 -- description-authoring-principles.md V5)
      #
      # has_strong_trigger / absolute_keyword_count are reported as METRICS
      # below, not gates. A measured eval campaign found these do not by
      # themselves indicate quality, and requiring them measurably harmed
      # compliant models (see foundation:context/shared/
      # description-authoring-principles.md V1, V6). Do not reintroduce
      # them as pass/fail criteria.
      #
      # has_examples / commentary_count, by contrast, ARE gates as of
      # v1.4.0: any <example>/<commentary> in the description is a
      # structural ERROR (see structural-validation above), which already
      # routes through has_errors -> "critical" below -- no separate
      # classify_agent branch needed for them.

      # v1.8.0: the gate is CHARACTERS (description-authoring-principles.md V5).
      # Same two numbers as structural-validation above and as
      # validate-bundle-repo.yaml Phase 2.8. Tokens remain a reported metric.
      DESCRIPTION_WARN_CHARS = 600
      DESCRIPTION_ERROR_CHARS = 1200

      def classify_agent(agent: dict) -> dict:
          """Classify a single agent's quality level."""
          
          # Start with structural pass/fail
          has_errors = len(agent.get("errors", [])) > 0
          has_warnings = len(agent.get("warnings", [])) > 0
          
          # Extract quality indicators
          has_explicit_tools = agent.get("has_explicit_tools", False)
          has_strong_trigger = agent.get("has_strong_trigger", False)
          has_examples = agent.get("has_examples", False)
          description_length = agent.get("description_length", 0)
          description_tokens = agent.get("description_tokens", 0)
          has_model_role = agent.get("has_model_role", False)
          model_role_issues = agent.get("model_role_issues", [])
          has_model_role_errors = any(i.startswith("ERROR:") for i in model_role_issues)
          
          # Classify
          if has_errors:
              quality = "critical"
              reason = "Structural errors - agent won't load"
          elif not has_explicit_tools:
              quality = "needs_work"
              reason = "Missing explicit tools section"
          elif description_length < 100:
              quality = "needs_work"
              reason = f"Description too short ({description_length} chars)"
          elif description_length > DESCRIPTION_ERROR_CHARS:
              quality = "needs_work"
              reason = f"Description is {description_length} chars (>{DESCRIPTION_ERROR_CHARS} threshold -- must shorten)"
          elif description_length > DESCRIPTION_WARN_CHARS:
              quality = "polish"
              reason = f"Description is {description_length} chars (>{DESCRIPTION_WARN_CHARS} cap -- consider trimming)"
          elif has_model_role_errors:
              quality = "needs_work"
              reason = "Invalid or deprecated model_role values"
          elif has_warnings:
              quality = "polish"
              reason = "Meets thresholds but has minor warnings"
          else:
              quality = "good"
              reason = "Meets all quality thresholds"
          
          return {
              "name": agent.get("name"),
              "quality": quality,
              "reason": reason,
              "has_explicit_tools": has_explicit_tools,
              "has_strong_trigger": has_strong_trigger,
              "triggers_found": agent.get("triggers_found", []),
              "has_examples": has_examples,
              "example_count": agent.get("example_count", 0),
              "description_length": description_length,
              "has_model_role": has_model_role,
              "model_role_value": agent.get("model_role_value"),
              "model_role_issues": model_role_issues,
              "error_count": len(agent.get("errors", [])),
              "warning_count": len(agent.get("warnings", []))
          }

      def classify_all():
          results = {
              "phase": "classification",
              "agents": [],
              "summary": {
                  "total": 0,
                  "good": 0,
                  "polish": 0,
                  "needs_work": 0,
                  "critical": 0
              },
              "quality_level": "good",
              "requires_llm_analysis": False
          }
          
          for agent in structural.get("agents", []):
              classification = classify_agent(agent)
              results["agents"].append(classification)
              results["summary"]["total"] += 1
              results["summary"][classification["quality"]] += 1
          
          # Determine overall quality level
          # Priority: critical > needs_work > polish > good
          if results["summary"]["critical"] > 0:
              results["quality_level"] = "critical"
              results["requires_llm_analysis"] = True
          elif results["summary"]["needs_work"] > 0:
              results["quality_level"] = "needs_work"
              results["requires_llm_analysis"] = True
          elif results["summary"]["polish"] > 0:
              results["quality_level"] = "polish"
              # Polish-level issues may benefit from LLM review
              results["requires_llm_analysis"] = True
          else:
              results["quality_level"] = "good"
              # All agents pass! No LLM analysis needed.
              results["requires_llm_analysis"] = False
          
          # model_role distribution summary
          model_role_stats = {
              "with_model_role": 0,
              "without_model_role": 0,
              "role_distribution": {},
              "agents_without_model_role": []
          }
          for agent_cls in results["agents"]:
              if agent_cls.get("has_model_role"):
                  model_role_stats["with_model_role"] += 1
                  raw = agent_cls.get("model_role_value")
                  roles = raw if isinstance(raw, list) else [raw] if raw else []
                  for r in roles:
                      if isinstance(r, str):
                          model_role_stats["role_distribution"][r] = model_role_stats["role_distribution"].get(r, 0) + 1
              else:
                  model_role_stats["without_model_role"] += 1
                  model_role_stats["agents_without_model_role"].append(agent_cls.get("name"))
          results["model_role_stats"] = model_role_stats

          # Provide summary message
          total = results["summary"]["total"]
          good = results["summary"]["good"]
          
          if results["quality_level"] == "good":
              results["message"] = f"✅ All {total} agents meet quality thresholds. No further analysis needed."
          else:
              not_good = total - good
              results["message"] = f"⚠️ {not_good}/{total} agents need attention. Running detailed analysis."
          
          print(json.dumps(results))

      classify_all()
      EOF
    output: "quality_classification"
    parse_json: true
    timeout: 60
    on_error: "fail"
    depends_on: ["structural-validation"]

  # ============================================================================
  # PHASE 2.75: Initialize Optional Outputs
  # Set default values for variables that may be skipped by conditional phases
  # This prevents undefined variable errors in Phase 6
  # ============================================================================

  - id: "initialize-optional-outputs"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      
      # Initialize default values for conditional phase outputs
      # These will be overwritten if the corresponding phase runs
      defaults = {
          "approval_summary": "_Quick approval not performed - detailed LLM analysis was run instead._",
          "quality_results": "_Description quality analysis not performed - all agents met quality thresholds via deterministic checks._",
          "tool_analysis": "_Tool access analysis not performed - all agents have explicit tool declarations._"
      }
      
      print(json.dumps(defaults))
      EOF
    output: "optional_defaults"
    parse_json: true
    timeout: 30
    on_error: "fail"
    depends_on: ["quality-classification"]

  # Set individual default values (will be overwritten by conditional steps if they run)
  - id: "set-default-approval-summary"
    type: "bash"
    command: |
      echo "_Quick approval not performed - detailed LLM analysis was run instead._"
    output: "approval_summary"
    timeout: 10
    on_error: "fail"
    depends_on: ["initialize-optional-outputs"]

  - id: "set-default-quality-results"
    type: "bash"
    command: |
      echo "_Description quality analysis not performed - all agents met quality thresholds via deterministic checks._"
    output: "quality_results"
    timeout: 10
    on_error: "fail"
    depends_on: ["initialize-optional-outputs"]

  - id: "set-default-tool-analysis"
    type: "bash"
    command: |
      echo "_Tool access analysis not performed - all agents have explicit tool declarations._"
    output: "tool_analysis"
    timeout: 10
    on_error: "fail"
    depends_on: ["initialize-optional-outputs"]

  # ============================================================================
  # PHASE 3: Quick Approval (When All Agents Pass)
  # Fast-track path for bundles that meet all quality thresholds
  # Model: haiku - simple summary, no complex reasoning needed
  # ============================================================================

  - id: "quick-approval"
    agent: "foundation:zen-architect"
    mode: "REVIEW"
    condition: "{{quality_classification.requires_llm_analysis}} == false"
    depends_on: ["set-default-approval-summary", "agent-discovery"]
    prompt: |
      All agents in this repository meet quality thresholds. Provide a brief approval summary.

      **Repository Path:** {{repo_path}}

      **Discovery Coverage (v1.6.0 -- restate this, do not omit it):**
      - Candidate files scanned: {{discovery_results.candidates_scanned}}
      - Agents discovered: {{discovery_results.total_count}}
      - Per-location counts: {{discovery_results.location_counts}}
      - Scan patterns: {{discovery_results.scan_patterns}}
      - Excluded parts: {{discovery_results.excluded_parts}}

      **Classification (v1.7.0 -- restate this too):**
      - Classifier: {{discovery_results.classifier}}
      - Non-agent files: {{discovery_results.non_agent_count}}
        ({{discovery_results.non_agent_reasons}})
      - Which ones: {{discovery_results.non_agents_found}}

      A PASS is only meaningful alongside the scope it was reached over. An
      approval that says "all agents pass" without saying WHICH agents were
      looked at is exactly the shape that let 11 violators survive two
      repo-wide sweeps. The same applies to the files the classifier set
      aside: name them, so a file wrongly judged not-an-agent is visible
      rather than silently unvalidated.

      **Quality Classification Results:**
      ```json
      {{quality_classification}}
      ```

      **Structural Validation Summary:**
      - Total agents: {{structural_results.summary.total}}
      - Passed structural: {{structural_results.summary.passed}}
      - Errors: {{structural_results.summary.errors}}
      - Warnings: {{structural_results.summary.warnings}}

      Provide a concise approval noting:
      1. ✅ Confirm all agents meet quality standards
      2. What's done well (patterns worth preserving)
      3. Any optional polish suggestions (NOT requirements - agents are already good)

      **NEVER suggest adding `<example>` or `<commentary>` blocks.** Since
      v1.4.0 they are rejected ENTIRELY, not merely capped
      (description-authoring-principles.md V3/V6, enforced as a structural
      ERROR by this same recipe). An agent whose description carries none is
      in the REQUIRED shape -- it is not missing anything, and recommending
      them here would tell an author to introduce the very error this recipe
      would then fail them for. Absence of examples is never a polish item.
      Where a trigger genuinely needs sharpening, state it as a decision rule
      in the WHEN clause instead.

      Keep the response brief - this is the fast-track approval path.
      
      Format:
      ## ✅ PASS - All Agents Meet Quality Standards
      
      **Summary:** [1-2 sentences]

      **Coverage:** [total] agents across [N] locations ([list them with
      counts]); excluded [excluded_parts]
      
      **What's Done Well:**
      - [list 2-3 positive patterns]
      
      **Optional Polish (not required):**
      - [0-2 minor suggestions, or "None - agents are exemplary"]
      - NEVER "add `<example>` blocks" or "add `<commentary>`" -- see above
    output: "approval_summary"
    timeout: 120
    on_error: "continue"

  # ============================================================================
  # PHASE 4: Description Quality Analysis (Agent-Based, Conditional)
  # Check description quality: triggers, examples, WHY/WHEN/WHAT
  # Only runs when quality_classification.requires_llm_analysis == true
  # Severity: SUGGESTION for quality improvements
  # ============================================================================

  - id: "description-quality-check"
    agent: "foundation:zen-architect"
    mode: "REVIEW"
    condition: "{{quality_classification.requires_llm_analysis}} == true"
    prompt: |
      Analyze agent description quality for agents that need work in this repository.

      **Repository Path:** {{repo_path}}

      **Quality Classification (focus on these agents):**
      ```json
      {{quality_classification}}
      ```

      **Structural Validation Results:**
      ```json
      {{structural_results}}
      ```

      **IMPORTANT: Focus ONLY on agents with quality != "good"**
      
      Agents classified as "good" have ALREADY PASSED. Do NOT suggest improvements for them.

      **How to judge description quality is governed by the canonical**
      **`foundation:context/shared/description-authoring-principles.md`** --
      this prompt does not restate it. In summary: trigger phrasing should
      state the deciding factor (a decision rule), not lean on bare
      imperatives; `<example>`/`<commentary>` blocks are rejected entirely
      (not merely capped -- see V3).

      **Note on examples/commentary:** `<example>` and `<commentary>`
      presence is already caught as a structural ERROR by Phase 2
      (structural-validation), deterministically, before this LLM phase
      ever runs. Do not re-judge it here -- this phase is about the WHEN
      clause and WHAT/WHEN guidance only.

      **What is NOT an Issue (do not flag these):**
      - Whether the description happens to use MUST/ALWAYS/REQUIRED/
        PROACTIVELY -- their presence or absence is not itself a quality
        signal (a measured eval campaign found requiring them harmed
        compliant models; see description-authoring-principles.md V1, V6)
      - Reasonable alternative approaches to documentation
      - "Could be slightly better" items for agents that meet thresholds
      - Personal preferences about wording or structure
      - Absence of examples -- this is the required shape, not a gap

      **Only flag genuine issues:**
      - A WHEN clause that gives no deciding factor at all (not "weak
        phrasing" -- literally no signal for when to delegate)
      - Critical missing guidance that would confuse users

      **Quality Criteria to Check (for agents needing work only):**

      ### 1. WHEN Clause Quality (SUGGESTION if missing a deciding factor)

      Check: Does the description state a concrete condition or context
      shape that should cause delegation (a decision rule), rather than
      either (a) nothing at all, or (b) a bare imperative with no
      supporting context? See description-authoring-principles.md V6 for
      the before/after example.

      ### 2. WHAT/WHEN Guidance (SUGGESTION if incomplete)

      Good descriptions answer:
      - **WHAT**: What does this agent do? What are its capabilities?
      - **WHEN**: What's the deciding factor for delegating to it?

      Check: Are both aspects covered in the description?

      **Read the actual agent files** at {{repo_path}} to analyze the full descriptions.

      **Output Format:**
      
      ## Agents Needing Work
      
      For each agent with quality != "good", provide:
      
      | Agent | Current Quality | Triggers | Examples | WHY/WHEN/WHAT |
      |-------|-----------------|----------|----------|---------------|
      | name  | polish/needs_work/critical | ✅/⚠️ | ✅/⚠️ | ✅/⚠️ |
      
      Then for each agent:
      - **Agent**: name
      - **Classification**: quality level and reason
      - **Issues**: List of specific problems (NOT nitpicks)
      - **Remediation**: Concrete fixes with examples
      
      ## Agents That Pass (no action needed)
      
      List agents with quality == "good" - acknowledge they meet standards, do NOT suggest changes.
    output: "quality_results"
    timeout: 600
    on_error: "continue"
    depends_on: ["set-default-quality-results", "quality-classification"]

  # ============================================================================
  # PHASE 5: Tool Access Analysis (Agent-Based, Conditional)
  # Check for appropriate tool declarations
  # Only runs when quality_classification.requires_llm_analysis == true
  # Severity: WARNING for missing explicit tools
  # ============================================================================

  - id: "tool-access-analysis"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    condition: "{{quality_classification.requires_llm_analysis}} == true"
    prompt: |
      Analyze tool access patterns for agents that need work in this repository.

      **Repository Path:** {{repo_path}}

      **Quality Classification (focus on agents without explicit tools):**
      ```json
      {{quality_classification}}
      ```

      **Structural Validation Results:**
      ```json
      {{structural_results}}
      ```

      **IMPORTANT: Focus ONLY on agents with has_explicit_tools == false**
      
      Agents with explicit tools sections have ALREADY PASSED that check. Do NOT suggest changes to their tool lists unless there's a clear mismatch with their role.

      **What is NOT an Issue (do not flag these):**
      - Agents with `tools: []` (empty is explicit - they intentionally have no tools)
      - Agents with tools that are "close enough" to their role
      - Minor tool additions that would be "nice to have"
      - Theoretical tool needs that aren't blocking functionality
      
      **Only flag genuine issues:**
      - Missing `tools:` section entirely (relying on inheritance)
      - Obvious tool-role mismatches (e.g., file explorer with no filesystem access)

      **Tool Access Analysis Tasks:**

      ### 1. Explicit vs Implicit Tools
      
      For each agent WITHOUT explicit tools, categorize:
      - **Implicit**: No `tools:` section (relies on inheritance from parent bundle)
      
      Implicit tool dependencies are a WARNING because:
      - Agent may not work when used outside its intended bundle context
      - Tool availability becomes unpredictable
      - Makes agent harder to reason about

      ### 2. Role-Appropriate Tools (only for implicit agents)
      
      Based on the agent's stated purpose, check if it needs tools. Common patterns:
      
      | Agent Type | Expected Tools |
      |------------|---------------|
      | Security auditor | tool-web (CVE lookups), tool-filesystem |
      | Code explorer | tool-filesystem, grep, glob |
      | Git operations | bash (git commands), tool-filesystem |
      | Test coverage | tool-lsp (semantic analysis), tool-filesystem |
      | Web research | tool-web |
      | Builder/implementer | tool-filesystem, bash |

      **Read the actual agent files** to analyze tool declarations.

      **Output Format:**
      
      ## Agents with Tool Issues
      
      | Agent | Tool Access | Status | Recommended Fix |
      |-------|-------------|--------|-----------------|
      | name  | implicit    | ⚠️     | Add tools: section |
      
      For each agent with issues:
      - **Agent**: name
      - **Current Tools**: "implicit" or list
      - **Issue**: What's wrong
      - **Remediation**: Exact YAML to add
      
      ## Agents with Proper Tool Access (no action needed)
      
      List agents with has_explicit_tools == true - acknowledge they're correct.
    output: "tool_analysis"
    timeout: 600
    on_error: "continue"
    depends_on: ["set-default-tool-analysis", "description-quality-check"]

  # ============================================================================
  # PHASE 6: Final Report Synthesis
  # Generates different reports based on quality_level
  # ============================================================================

  - id: "synthesize-report"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Synthesize all validation results into a comprehensive agent validation report.

      **Repository:** {{repo_path}}

      **Quality Classification:**
      ```json
      {{quality_classification}}
      ```

      **Environment Check:**
      ```json
      {{env_check}}
      ```

      **Agent Discovery:**
      ```json
      {{discovery_results}}
      ```

      **Structural Validation:**
      ```json
      {{structural_results}}
      ```

      **Description Quality Analysis:**
      {{quality_results}}

      **Tool Access Analysis:**
      {{tool_analysis}}

      **Quick Approval Summary:**
      {{approval_summary}}

      **REPORT GENERATION RULES:**

      1. If quality_level == "good": Generate a PASS report celebrating the clean bill of health
      2. If quality_level == "polish": Generate a PASS WITH SUGGESTIONS report (optional improvements)
      3. If quality_level == "needs_work": Generate a PASS WITH WARNINGS report (should fix)
      4. If quality_level == "critical": Generate a FAIL report (must fix)

      **Verdict Selection:**
      - **✅ PASS**: All agents meet quality thresholds (quality_level == "good")
      - **✅ PASS WITH SUGGESTIONS**: Minor polish opportunities (quality_level == "polish")
      - **⚠️ PASS WITH WARNINGS**: Some agents need work (quality_level == "needs_work")
      - **❌ FAIL**: Critical issues found (quality_level == "critical")

      **Generate this report structure:**

      # Agent Validation Report

      ## Executive Summary
      
      - **Overall Verdict**: [Select from above based on quality_level]
      - **Repository**: [path]
      - **Agents Found**: X total across N locations
      - **Quality Breakdown**: X good, Y polish, Z needs_work, W critical
      - **Issues**: X errors, Y warnings, Z suggestions

      ### Coverage (REQUIRED -- never omit, never summarise away)

      Immediately after the bullets above, print the coverage block, taken
      verbatim from `discovery_results`:

      ```
      Scanned: <scan_patterns>, excluding <excluded_parts>
      Candidates: <candidates_scanned> files matched the scan
      Classified as agents: <total_count> across <len(location_counts)> locations
      Classified as NON-agents: <non_agent_count> (<non_agent_reasons>)
      Classifier: <classifier>
      ```

      then a row per entry of `location_counts`, in the order given:

      | Location | Agents |
      |----------|--------|
      | agents/  | 16     |

      **Then, if `non_agent_count` > 0, a NON-AGENTS table (REQUIRED --**
      **never omit it, never fold it into a single number):**

      | File | Reason not an agent |
      |------|---------------------|
      | context/agents/multi-agent-patterns.md | no_frontmatter |

      Take every row verbatim from `non_agents_found`. These files matched the
      scan and were then judged NOT to be agents because their frontmatter
      declares no `meta:` key (v1.7.0 -- the loader's own contract, see
      `docs/AGENT_AUTHORING.md`). Naming them is what makes the classifier
      auditable: a real agent that lost its `meta:` block would appear in this
      table instead of vanishing from the run, which is the failure mode a
      classifier can otherwise introduce. Do NOT present them as errors --
      they are correctly-excluded non-agents.

      **Why this is mandatory:** a validator that under-counts silently is
      worse than one that fails loudly. Before v1.6.0 this recipe walked
      three hardcoded directories, reported "23 found, 3 locations" on a repo
      that had 32 agent files in 6 locations, and gave a reader no way to
      notice -- which is how 11 violators under `experiments/**/agents/`
      survived two repo-wide sweeps. Printing the patterns, the exclusions,
      the per-location counts and the total makes the scope auditable from
      the report alone. Do NOT collapse this to a single number, and do NOT
      drop locations that contributed zero findings.

      ## Quality Classification Summary

      | Agent | Quality | Triggers | No Examples | Tools | Model Role | Description |
      |-------|---------|----------|-------------|-------|------------|-------------|
      | name  | good/polish/needs_work/critical | ✅/⚠️ | ✅/❌ | ✅/⚠️ | ✅/⚠️/❌ | length |

      In the "No Examples" column, ✅ means the description carries NO
      `<example>`/`<commentary>` block (the required shape, from
      has_examples == false) and ❌ means it carries one (a structural
      ERROR). Do not invert this: a column that shows ⚠️ for an agent
      WITHOUT examples reads as "examples missing", which is the pre-v1.4.0
      policy.

      ## Model Role Coverage

      Use the model_role_stats from quality_classification to produce:

      - **Model Role Coverage**: X/Y agents have model_role declared
      
      **Model Role Distribution:**
      
      | Role | Count |
      |------|-------|
      | role_name | N |
      
      **Agents Without model_role:**
      List agents that do not declare model_role. These will use session defaults for model routing.
      
      **Invalid/Deprecated Role Warnings:**
      List any agents with invalid or deprecated model_role values and the recommended fix.

      ## Detailed Findings

      **For PASS verdict:** Highlight what's done well. Any suggestions are OPTIONAL.

      **For other verdicts:**

      ### Errors (Must Fix) - HIGH Priority
      Issues that break agent loading or basic functionality.
      
      For each error:
      ```
      [HIGH] Agent: <name> - <issue>
      Problem: <what's wrong>
      Fix: <exact code/YAML to add or change>
      ```

      ### Warnings (Should Fix) - MEDIUM Priority
      Issues that may cause problems in certain contexts.
      
      For each warning:
      ```
      [MEDIUM] Agent: <name> - <issue>
      Problem: <what's wrong>
      Before: <current state>
      After: <recommended fix>
      ```

      ### Suggestions (Consider) - LOW Priority
      Quality improvements for better LLM matching and discoverability.

      **NEVER suggest adding `<example>` or `<commentary>` blocks**, at any
      severity. Since v1.4.0 they are rejected entirely
      (description-authoring-principles.md V3/V6) and are reported above as
      structural ERRORS -- so recommending them here would contradict this
      report's own Errors section. An agent with no examples is in the
      required shape, not missing a feature.
      
      For each suggestion:
      ```
      [LOW] Agent: <name> - <issue>
      Current: "<weak trigger text>"
      Improved: "<strong trigger text with MUST/ALWAYS>"
      ```

      ## Remediation Priority

      List items in order of importance with clear HIGH/MEDIUM/LOW labels.

      ## Metadata
      - **Validated**: [timestamp]
      - **Recipe**: validate-agents v1.8.0
      - **Discovery scope**: repo-wide `agents/*.md`. State the
        `scan_patterns` and the `excluded_parts` from `discovery_results`
        verbatim.
      - **Agents discovered**: `total_count` total across the locations in
        `location_counts` -- list every location with its count again here,
        so the metadata alone answers "what did this run actually look at?"
        without the reader scrolling back.
      - **Classification**: state `candidates_scanned`, `classifier` and
        `non_agent_count` verbatim, and repeat every entry of
        `non_agents_found` with its reason. "N files matched the scan, M were
        agents, K were not, and here is which" is the whole point -- a bare
        agent count cannot be audited.
      - **Quality Thresholds**: see
        `foundation:context/shared/description-authoring-principles.md`
        (canonical -- not restated here). Gates: no structural errors
        (including any `<example>`/`<commentary>` block in the
        description -- rejected entirely per V3, not merely capped),
        explicit tools section, description >= 100 chars, description
        length cap in CHARS (v1.8.0: WARN >600, ERROR >1200 -- the
        superseded token tier put its ERROR above the longest
        description in every aligned repo measured, so it could not
        fire). Point an author over the cap at
        `foundation:recipes/refresh-descriptions.yaml`, which proposes a
        rewrite WITH a fidelity table rather than shortening by eye.
        MUST/ALWAYS/REQUIRED/PROACTIVELY keyword presence is reported as
        a metric, not a gate.
      - **Severity Guide**:
        - ERROR (critical): Invalid YAML, missing required fields, or any `<example>`/`<commentary>` block in the description (will break, or is rejected per V3)
        - WARNING (needs_work): No explicit tools, relying on inheritance, or description over budget (may break or bloat every session)
        - SUGGESTION (polish): Missing WHEN deciding factor (quality improvement)

      Make the report actionable with clear next steps and concrete examples.
      
      **IMPORTANT:** If verdict is PASS, emphasize that the agents are GOOD and any suggestions are truly optional polish, not required changes.
    output: "final_report"
    timeout: 300
    on_error: "fail"
    depends_on: ["quality-classification", "quick-approval", "description-quality-check", "tool-access-analysis", "set-default-approval-summary", "set-default-quality-results", "set-default-tool-analysis"]
