# validate-bundle.yaml
# Multi-Bundle Validator Recipe with Accurate Dependency Tracing
# Validates all supported repo entry points (root, /bundles/*, and behaviors/*)
# with proper dependency tracing.
#
# =============================================================================
# CHANGELOG
# =============================================================================
#
# v2.2.0 (2026-09-18):
#   - NEW FEATURE: discover behavior partials as first-class validation targets:
#     direct `behaviors/*.{yaml,yml,md}` entries and conventional one-level
#     `behaviors/*/bundle.{md,yaml,yml}` entries are tagged `behavior`, while
#     arbitrary Markdown documentation is not treated as a bundle entry point.
#   - FAIL-LOUD: a real directory with no root, standalone, or behavior entry
#     now reports `no_bundles_discovered` and exits non-zero before the empty
#     foreach could otherwise produce a successful-looking report over nothing.
#   - The discovery target now travels through `VALIDATE_BUNDLE_PATH`, never a
#     Python string literal. This retains a literal Windows path rather than
#     escape-processing it before the `Path` check runs.
#
# v2.1.2:
#   - The synthesize-report prompt opened with a bare "Synthesize all bundle
#     validation results", never naming its own recipe, and the report header
#     it asked for ("Bundle Validation Report") named no recipe either -- so
#     the model filled the gap and produced headers calling this recipe
#     `validate-recipes`. The prompt now states which recipe it belongs to and
#     forbids naming another as the producer, and the header is
#     `validate-bundle Report`.
#   - The Metadata block hardcoded "Recipe: validate-bundle v2.1.0" and was
#     never bumped with the file; corrected and now matches `version:`.
#   - Prompt text only; no step, condition or logic change.
#
# v2.1.1:
#   - Honor the injected AMPLIFIER_PYTHON interpreter in both python heredocs
#     (was bare `python3`). Companion to validate-single-bundle v2.3.1.
#
# v2.1.0:
#   - Portability: declare a schema_version 2 dependency manifest (contract
#     recipe-dependency-manifest.v1). The `agent: "foundation:zen-architect"`
#     step below previously resolved out of the CALLING session's agent map;
#     a caller without that agent failed at run time with
#     "Agent 'foundation:zen-architect' not found in configuration". It now
#     resolves from this recipe's own declared closure.
#   - Self-referential on purpose: foundation's own recipe declares foundation
#     as a dependency. Core 11 forbids inferring a source from the
#     `foundation:` namespace prefix -- an undeclared dependency is never
#     guessed, so it must be written down.
#   - The `validate-single-bundle.yaml` sub-recipe invoked below carries its
#     own manifest (v2.3.0); a sub-recipe declares its own closure rather than
#     inheriting the parent's.
#   - No behavior change under the legacy engine, which ignores both new
#     top-level keys. Recipe logic, steps and prompts untouched.
#
# v2.0.0 MAJOR UPDATE: Now traces ACTUAL bundle dependencies via `includes:`
# instead of scanning all behaviors in the repo. This ensures that:
# - Token costs are correctly attributed to the bundles that actually use them
# - Behaviors not included by a bundle don't affect its validation
# - Multi-bundle repos (root + /bundles/*) are validated separately
#
# Usage:
#   # Validate a specific bundle file:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=foundation:recipes/validate-bundle.yaml \
#     context='{"bundle_path": "/path/to/bundle.md"}'
#
#   # Validate all bundles in a repo directory:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=foundation:recipes/validate-bundle.yaml \
#     context='{"bundle_path": "/path/to/repo"}'

# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller that lacks these agents can still run it.
# Pinned to the released tag `v2.1.2`. Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit SHA,
# so a tag is the most immutable pin a `source:` can currently express.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-foundation@v2.1.2"
    kind: bundle
    required_agents:
      - "foundation:zen-architect"
# ---------------------------------------------------------------------------

name: validate-bundle
description: |
  Validates Amplifier bundles with accurate dependency tracing.
  
  v2.2.0:
  - Discovers all supported entry points (root, /bundles/*, and behavior partials)
  - Traces ACTUAL `includes:` to build real dependency tree per bundle
  - Only counts context from actually-included behaviors
  - Reports results per-bundle with clear separation
  
  For example, if a behavior is only included by `bundles/amplifier-dev.yaml`
  and NOT by the root `bundle.md`, its context files will only be counted
  when validating `amplifier-dev`.
version: "2.2.0"
author: "Amplifier Foundation Team"
tags: ["bundle", "validation", "quality", "conventions", "context-health", "dependency-tracing"]

context:
  bundle_path: ""  # Required: Path to bundle file OR repo directory to validate

steps:
  # ============================================================================
  # PHASE 1: Environment Check
  # ============================================================================

  - id: "environment-check"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import sys

      results = {
          "phase": "environment",
          "foundation_available": False,
          "foundation_version": None,
          "python_version": sys.version,
          "errors": []
      }

      try:
          import amplifier_foundation
          results["foundation_available"] = True
          results["foundation_version"] = getattr(amplifier_foundation, "__version__", "unknown")
      except ImportError as e:
          results["errors"].append({
              "type": "import_error",
              "message": f"amplifier_foundation not importable: {e}"
          })

      # Try to auto-install if not available
      if not results["foundation_available"]:
          import subprocess
          try:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "-q", 
                   "git+https://github.com/microsoft/amplifier-foundation@main"],
                  check=True,
                  capture_output=True
              )
              import amplifier_foundation
              results["foundation_available"] = True
              results["foundation_version"] = getattr(amplifier_foundation, "__version__", "unknown")
              results["errors"] = []
              results["auto_installed"] = True
          except Exception as e:
              results["errors"].append({"type": "install_error", "message": str(e)})

      print(json.dumps(results))
      EOF
    output: "env_check"
    parse_json: true
    timeout: 180
    on_error: "fail"

  # ============================================================================
  # PHASE 2: Bundle Discovery
  # Find all supported entry points to validate (root, /bundles/*, behaviors/*)
  # ============================================================================

  - id: "discover-bundles"
    type: "bash"
    command: |
      VALIDATE_BUNDLE_PATH="{{bundle_path}}" "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import os
      from pathlib import Path

      def discover_bundles(bundle_path: str) -> dict:
          """Discover supported root, standalone, and behavior entry points.

          Direct behavior YAML/YML files, frontmatter-bearing behavior Markdown,
          and one-level conventional behavior directories are loader-supported
          entry points. Documentation files are not.
          """
          results = {
              "phase": "discovery",
              "input_path": bundle_path,
              "bundles": [],
              "is_single_file": False,
              "is_repo": False,
              "repo_root": None,
              "errors": [],
              "passed": True,
          }

          seen_paths = set()

          def add_bundle(entry_path: Path, bundle_type: str, bundle_name: str, repo_root: Path) -> None:
              """Record each resolved entry once, even if discovery paths overlap."""
              resolved = entry_path.resolve()
              if resolved in seen_paths:
                  return
              seen_paths.add(resolved)
              results["bundles"].append({
                  "bundle_path": str(resolved),
                  "bundle_type": bundle_type,
                  "bundle_name": bundle_name,
                  "repo_root": str(repo_root),
              })

          def has_frontmatter(markdown_path: Path) -> bool:
              """Markdown behavior files need a YAML header; prose does not qualify."""
              try:
                  content = markdown_path.read_text(encoding="utf-8", errors="replace").lstrip("\ufeff")
              except OSError:
                  return False
              return content.startswith("---") and "\n---" in content[3:]

          def is_known_behavior_path(candidate: Path) -> bool:
              """Classify direct and conventional behavior files in single-file mode."""
              if candidate.parent.name == "behaviors":
                  return candidate.suffix in {".yaml", ".yml", ".md"}
              return (
                  candidate.parent.parent.name == "behaviors"
                  and candidate.name in {"bundle.md", "bundle.yaml", "bundle.yml"}
              )

          def single_file_repo_root(candidate: Path) -> Path:
              """Preserve the enclosing repo root for known behavior partials."""
              if candidate.parent.name == "behaviors":
                  return candidate.parent.parent
              if candidate.parent.parent.name == "behaviors":
                  return candidate.parent.parent.parent
              return candidate.parent

          path = Path(bundle_path).resolve()
          
          if path.is_file():
              # Single file mode
              results["is_single_file"] = True
              repo_root = single_file_repo_root(path)
              results["repo_root"] = str(repo_root)
              bundle_type = "behavior" if is_known_behavior_path(path) else "single_file"
              bundle_name = path.parent.name if path.name.startswith("bundle.") else path.stem
              add_bundle(path, bundle_type, bundle_name, repo_root)
          
          elif path.is_dir():
              # Directory mode - find all supported entry points.
              results["is_repo"] = True
              results["repo_root"] = str(path)
              
              # Check for root bundle
              for bundle_name in ["bundle.md", "bundle.yaml"]:
                  root_bundle = path / bundle_name
                  if root_bundle.exists():
                      add_bundle(root_bundle, "root", "root", path)
                      break
              
              # Check for standalone bundles in /bundles/
              bundles_dir = path / "bundles"
              if bundles_dir.exists() and bundles_dir.is_dir():
                  for ext in ["*.yaml", "*.yml", "*.md"]:
                      for bundle_file in sorted(bundles_dir.glob(ext)):
                          # Skip if it's just a README or similar
                          if bundle_file.stem.lower() in ["readme", "changelog"]:
                              continue
                          add_bundle(bundle_file, "standalone", bundle_file.stem, path)

              # Behaviors are independently composable entry points, not
              # standalones: a provider and session orchestrator belong to
              # the host that installs them.
              behaviors_dir = path / "behaviors"
              if behaviors_dir.exists() and behaviors_dir.is_dir():
                  for ext in ["*.yaml", "*.yml", "*.md"]:
                      for behavior_file in sorted(behaviors_dir.glob(ext)):
                          if (
                              behavior_file.suffix == ".md"
                              and not has_frontmatter(behavior_file)
                          ):
                              continue
                          add_bundle(behavior_file, "behavior", behavior_file.stem, path)

                  # A behavior may package its entry point conventionally in
                  # behaviors/<name>/bundle.{md,yaml,yml}. Select one file per
                  # directory by normal loader precedence and then de-duplicate
                  # the resolved artifact.
                  for behavior_dir in sorted(behaviors_dir.iterdir()):
                      if not behavior_dir.is_dir():
                          continue
                      for filename in ["bundle.md", "bundle.yaml", "bundle.yml"]:
                          behavior_bundle = behavior_dir / filename
                          if behavior_bundle.exists():
                              add_bundle(
                                  behavior_bundle,
                                  "behavior",
                                  behavior_dir.name,
                                  path,
                              )
                              break
          
          else:
              results["errors"].append({
                  "type": "path_not_found",
                  "message": f"Path does not exist: {bundle_path}",
              })
          
          results["total_bundles"] = len(results["bundles"])
          if results["total_bundles"] == 0 and not results["errors"]:
              results["errors"].append({
                  "type": "no_bundles_discovered",
                  "message": (
                      "No supported bundle entry points found. Expected a root "
                      "bundle, /bundles/* standalone, or a direct/conventional "
                      "behavior entry under behaviors/."
                  ),
              })
          results["passed"] = not results["errors"]
          print(json.dumps(results))
          if not results["passed"]:
              raise SystemExit(1)
      
      discover_bundles(os.environ["VALIDATE_BUNDLE_PATH"])
      EOF
    output: "discovery"
    parse_json: true
    timeout: 30
    on_error: "fail"
    depends_on: ["environment-check"]

  # ============================================================================
  # PHASE 3: Validate Each Bundle
  # Use foreach to call validate-single-bundle.yaml for each discovered bundle
  # ============================================================================

  - id: "validate-bundles"
    foreach: "{{discovery.bundles}}"
    as: "bundle"
    collect: "bundle_results"
    parallel: false
    type: "recipe"
    recipe: "validate-single-bundle.yaml"
    context:
      bundle_path: "{{bundle.bundle_path}}"
      bundle_name: "{{bundle.bundle_name}}"
      bundle_type: "{{bundle.bundle_type}}"
      repo_root: "{{bundle.repo_root}}"
    timeout: 600
    on_error: "continue"
    depends_on: ["discover-bundles"]

  # ============================================================================
  # PHASE 4: Synthesize Final Report
  # ============================================================================

  - id: "synthesize-report"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    prompt: |
      Synthesize all bundle validation results into a comprehensive report.

      You are the final step of the **validate-bundle** recipe. Every place
      the report names the recipe that produced it -- the header, the
      Metadata block, any self-reference in prose -- it MUST say
      `validate-bundle`. Do not name any other recipe (`validate-recipes`,
      `validate-agents`, `validate-single-bundle`) as the producer: those are
      different recipes with different scopes, and mislabelling sends a
      reader to the wrong one. `validate-single-bundle` is the sub-recipe
      this one invokes per bundle, never the author of this report.

      **Repository:** {{bundle_path}}
      
      **Discovery Results:**
      ```json
      {{discovery}}
      ```

      **Environment Check:**
      ```json
      {{env_check}}
      ```

      **Per-Bundle Validation Results:**
      
      Each bundle was validated with dependency tracing. Here are the collected results:
      
      {{bundle_results}}

      **Generate a comprehensive report:**

      ## validate-bundle Report

      ### Executive Summary
      - **Repository:** (path)
      - **Bundles Validated:** X (list them)
      - **Overall Status:** All PASS | Some WARNINGS | Some FAILURES
      - **Key Finding:** Highlight the most important finding

      ### Per-Bundle Results Table

      | Bundle | Type | Verdict | Context Tokens | Issues |
      |--------|------|---------|----------------|--------|
      | (for each bundle...) |

      ### Detailed Per-Bundle Findings

      For each bundle that had issues:
      - What errors/warnings were found
      - Token breakdown (bundle markdown, context.include, cascading)
      - Largest context files
      - Recommended fixes

      ### Dependency Tracing Insights

      This validation used dependency tracing - only counting context from 
      behaviors actually included via `includes:`. Highlight:
      
      - Which behaviors are unique to specific bundles
      - Shared behaviors across bundles
      - Any behaviors in the repo that aren't included by any bundle (potential dead code)

      ### Recommendations

      Prioritized list of actions:
      1. **Must Fix** (errors across any bundle)
      2. **Should Fix** (warnings, context optimization)
      3. **Consider** (suggestions for improvement)

      ### Metadata
      - Validated: (current date/time)
      - Recipe: validate-bundle v2.2.0
      - Foundation available: (from env_check)
      - Dependency tracing: enabled
    output: "final_report"
    timeout: 300
    on_error: "fail"
    depends_on: ["validate-bundles"]
