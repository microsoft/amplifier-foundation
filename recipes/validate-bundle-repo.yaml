# validate-bundle-repo.yaml
# Repository-Wide Bundle Validator Recipe v3.10.0
# Validates an entire bundle repository against structural requirements, conventions,
# and Amplifier bundle philosophy (context sink pattern, thin behaviors, tool placement)
#
# CHANGELOG:
# v3.10.0 - Example-policy tightening + NEW README install-convention checks
#        - Phase 2.8 (agent description budget): <example> and <commentary>
#          presence are now ERROR (was WARNING at >2 examples / any
#          commentary). description-authoring-principles.md V3: examples
#          are rejected entirely, not merely capped -- the eval evidence
#          (P2 delegation wave) showed removing ALL examples does not
#          reduce delegation quality. New/renamed codes:
#          example_block_present (was too_many_examples), commentary_present
#          (severity changed WARNING -> ERROR).
#        - NEW PHASE 2.85: readme-install-convention-check. Two deterministic
#          checks against the root README.md:
#          Check A (readme_install_recommendation): the PRIMARY
#          `amplifier bundle add` command should target a behavior
#          (#subdirectory=behaviors/<name>.yaml), not the bare root bundle,
#          unless context var root_bundle_repo: "true" (repo's own purpose
#          is to ship root bundles for users). Findings:
#          readme_recommends_root_bundle, readme_missing_app_flag (both
#          severity needs_work).
#          Check B (tool_install_convention): bare `pip install` in
#          README.md instructional text is readme_pip_install (needs_work);
#          docs/*.md are scanned at INFO level only (docs_pip_install). A
#          repo shipping a CLI ([project.scripts] in pyproject.toml) with
#          an install command but no git+https:// form anywhere is
#          readme_missing_git_install (needs_work).
#          No README, or a README with no bundle-add commands, is INFO
#          only (no_readme, no_bundle_add_commands) -- not a defect.
#        - quality-classification incorporates readme_convention_issues
#          (severity "needs_work", counted like structural_issues, not
#          ERROR/WARNING like the other v3.x checks)
#        - synthesize-report includes README Install-Instructions
#          Convention Check section
# v3.9.0 - BUG 2 fix (interpreter injection) + NEW composable-surface check
#        - BUG 2(i) (CRITICAL FIX): all 24 python3 heredocs used a BARE `python3`,
#          ignoring the AMPLIFIER_PYTHON interpreter the executor injects into
#          every bash step (validate-recipes.yaml, generate-bundle-docs.yaml, and
#          bundle-behavioral-model.yaml already use "${AMPLIFIER_PYTHON:-python3}"
#          correctly). A bare python3 without amplifier_foundation installed made
#          Phase 0 mark foundation unavailable, silently SKIPPING the foundation-
#          gated phases. Converted ALL 24 heredocs to "${AMPLIFIER_PYTHON:-python3}".
#          BLAST RADIUS (intended): the interpreter switch now runs foundation on
#          the correct interpreter, so the foundation-gated phases
#          (individual_validation, standalone_completeness, and the report's
#          foundation_available line) UNSKIP. Findings they now surface were
#          always applicable — previously masked by the wrong interpreter, NOT a
#          regression introduced here.
#        - BUG 2(ii) (message + probe): the body-instruction check caught
#          `ImportError` and hard-coded "amplifier_foundation not importable" — but
#          the real failure in a STALE package copy is a missing SYMBOL
#          (check_body_is_instruction), which also raises ImportError. Now binds
#          the exception and reports it verbatim
#          (f"check_body_is_instruction unavailable: {exc}"). Phase 0 hardened to
#          probe the SYMBOL it gates (from amplifier_foundation.validator import
#          check_body_is_instruction) via a NEW, separate capability flag
#          (check_body_is_instruction_available) — kept distinct from
#          foundation_available so a stale symbol does not over-skip the
#          BundleRegistry-gated phases that do not need it.
#        - NEW CHECK (no_composable_surface): a repo shipping agents/ and/or
#          skills/ but NO behaviors/ directory has no composable per-behavior
#          --app install surface. The existing orphan_agents check only fires when
#          there is ALSO no root bundle, so the has-root case (and the skills-only
#          case) passed silent. quality-classification now emits a sibling
#          structural finding "no_composable_surface" (severity needs_work) naming
#          the fix ("ship a behaviors/<name>.yaml so consumers can
#          `amplifier bundle add ...#subdirectory=behaviors/<name>.yaml --app`"),
#          scoped to NOT double-fire with orphan_agents. repo-discovery now records
#          has_skills via a direct (path/"skills").is_dir() probe (skills use a
#          skills/<name>/SKILL.md layout, not the bundle.md layout scan_dirs reads).
# v3.8.0 - NEW PHASE 2.8: Agent Description Budget Validation
#        - Walks agents/*.md files and applies the same description-budget +
#          example/commentary checks validate-agents.yaml enforces, so a
#          repo-wide scan catches agent description bloat on its own.
#        - Check A: description token budget (PROVISIONAL -- see foundation:
#          context/shared/description-authoring-principles.md V5):
#          WARNING >300 tokens (agent_description_high)
#          ERROR   >600 tokens (agent_description_excessive)
#          Tighter than the mode-tier thresholds (500/800) because agent
#          descriptions are paid by every session with the agent in its
#          catalog, not only sessions that use it.
#        - Check B: <example>/<commentary> detection (description-authoring-
#          principles.md V3): WARNING on any <commentary> tag, WARNING on
#          >2 <example> blocks.
#        - quality-classification incorporates agent_description_issues
#        - synthesize-report includes Agent Description Budget Validation section
#        - Remediation pointers throughout the recipe now point to the
#          canonical context/shared/description-authoring-principles.md
#          instead of AGENT_AUTHORING.md's old "Description Requirements
#          (Critical)" section header (renamed, and no longer states the
#          thresholds inline -- see foundation PR de-inverting validate-agents.yaml)
# v3.7.0 - NEW PHASE 2.55: Body Instruction Check
#        - Everything below a bundle.md / agents/*.md YAML frontmatter is loaded
#          verbatim as the session's system instruction and emitted FIRST, ahead
#          of every context file. Documentation prose there is a defect.
#        - Emits PROSE_BELOW_FRONTMATTER at WARNING level; never fails the build.
#        - Scope is bundle.md + agents/*.md. modes/*.md are NOT covered.
#        - Skips test fixtures; degrades to a clean skip when amplifier_foundation
#          is not importable.
# v3.6.1 - Fix two false-positive defects
#        - Standalone completeness (Phase 3): Bundle.session is dict[str, Any],
#          but the check used getattr(session, 'orchestrator'/'context'), which
#          never resolves dict keys -> has_orchestrator/has_context were False
#          unconditionally, flagging EVERY standalone bundle in EVERY repo as
#          ERROR missing_session_config (drove false "critical" classification
#          on clean repos). New _sess() helper handles dict and object forms;
#          via_includes derivation now computes correctly downstream.
#        - Individual validation (Phase 2): the bundle: schema checks
#          (bundle.name / bundle.description) were applied to files discovery
#          classified as category "agents", but agent files use meta:
#          frontmatter (meta.name / meta.description) -> well-formed agents got
#          2 spurious warnings and name "". Agents are now checked against
#          meta.name / meta.description.
# v3.6.0 - Mode Authoring Discipline Validation (Phase 2.7)
#        - New Phase 2.7: mode-validation checks all modes/*.md files
#        - Check A: Mode description token budget
#          WARNING >500 tokens (mode_description_high)
#          ERROR   >800 tokens (mode_description_excessive)
#          Analogous to behavior context.include thresholds in Phase 2.1.
#          Thresholds mirror foundation/docs/AGENT_AUTHORING.md
#          §"Description Requirements (Critical)" and
#          modes/.../mode-design-discipline skill.
#        - Check B: Advertising rule (mode-design-discipline §4)
#          Unadvertised modes (advertised: false) must not be referenced by
#          name in any agent-readable .md file (context/, agents/, behaviors/,
#          skills/, modes/ — excluding the mode's own file).
#          Patterns detected: /<mode-name> and name="<mode-name>"/name='<mode-name>'
#          ERROR: unadvertised_but_referenced
#        - quality-classification incorporates mode_validation_issues
#        - synthesize-report includes Mode Validation section
#
# v3.5.0 - Behavior Reference Hygiene Checks
#        - New Phase 2.1.5: behavior-reference-hygiene checks behavior includes
#        - Check A: Cross-repo root-bundle refs in behavior includes (WARNING)
#          Detects git+https:// refs without #subdirectory= fragment — bare root refs
#          that pull entire foreign repos instead of the intended behavior file
#          Motivated by amplifier-bundle-reality-check/behaviors/reality-check.yaml
#          referencing amplifier-bundle-terminal-tester@main (root) instead of
#          amplifier-bundle-terminal-tester@main#subdirectory=behaviors/terminal-tester.yaml
#        - Check B: Behavior name collisions with root bundle name (WARNING)
#          Detects behavior.bundle.name == root bundle.bundle.name — causes
#          self-referential BundleState registry entries and confusing chain rendering
#          Motivated by amplifier-bundle-terminal-tester having both bundle.md
#          (name: terminal-tester) and behaviors/terminal-tester.yaml (name: terminal-tester)
#        - quality-classification incorporates behavior_reference_hygiene_issues
#        - synthesize-report includes Behavior Reference Hygiene section
#
# v3.4.0 - YAML Structure Lint for silent-failure detection
#        - New Phase 1.5: yaml-structure-lint checks ALL discovered bundles
#        - Detects includes: nested under bundle: (silently dropped by parser)
#        - Detects unrecognized dict keys in includes (only 'bundle:' valid)
#        - Motivated by bkrabach/amplifier-bundle-parallax-discovery (5 agents silent-fail)
#        - quality-classification incorporates structure_lint_issues
#        - synthesize-report includes YAML Structure Lint section
#
# v3.3.0 - Opt-in recipe validation integration
#        - New context vars: validate_recipes, validate_all, recipes_dir, known_agents
#        - Phase 0.1: validate-all-flags step expands validate_all convenience flag
#        - Phase 2.6.0: validate-recipes sub-recipe step (opt-in, on_error: continue)
#        - set-default-recipe-validation provides no-op default when skipped
#        - quality-classification incorporates recipe quality_level into scoring
#        - synthesize-report includes Recipe Validation section
#
# v3.2.0 - Graceful environment handling
#        - Phase 0 now checks prerequisites without auto-install attempts
#        - Detects hatchling, amplifier_foundation, pip wheel capability
#        - Sets validation_mode: full | hygiene_only | structural_only
#        - Build check gracefully SKIPS when hatchling unavailable (not ERROR)
#        - Foundation unavailability no longer classified as "critical"
#        - New "Environment Status" section in reports
#        - Clear separation of "environment limitations" vs "bundle problems"
#        - Instructions provided for achieving full validation
#
# v3.1.0 - Inheritance-aware tool placement analysis
#        - Phase 2.5 now parses delegate tool's exclude_tools config
#        - Agents only flagged for redundant tools if they INHERIT them (not excluded)
#        - Tools in exclude_tools list require explicit agent declaration (CORRECT pattern)
#        - Default exclude_tools: ["delegate"] - agents correctly redeclare delegate if needed
#        - Removed naive "redundant declaration" flagging that didn't understand inheritance
#
# v3.0.0 - Major upgrade with comprehensive bundle hygiene validation
#        - Enhanced Phase 1: Separate tracking for behaviors/standalone/experiments/root
#        - Phase 2.1: Behavior Hygiene Validation (no root includes, no session config, context limits)
#        - Phase 2.2: Standalone Completeness Validation (orchestrator + context required)
#        - Phase 2.3: Experiments Validation (naming, completeness, EXPERIMENTAL warning)
#        - Phase 2.4: Context Sink Compliance (root bundle context bloat detection)
#        - Phase 2.5: Tool Placement Analysis (universal vs capability vs specialized)
#        - Enhanced quality classification incorporating all new phases
#        - Enhanced final report with new validation sections
#        - CRITICAL: All size measurements use TOKENS (len/4), never lines
#
# v2.1.0 - Added Python packaging validation phases
#        - Phase 0.5: packaging-check (pyproject.toml force-includes)
#        - Phase 0.7: build-check (dry-run pip wheel)
#
# v2.0.0 - Added explicit PASS thresholds and deterministic quality classification
#
# v1.0.0 - Initial release
#
# PASS THRESHOLDS (explicit criteria for "passing"):
# 1. All bundles load without errors (BundleRegistry succeeds)
# 2. Root bundle exists (if any bundles in repo) OR has behaviors/bundles dirs
# 3. No orphan agents (all agents referenced by some bundle)
# 4. No broken cross-bundle references (includes resolve)
# 5. Consistent namespace across bundles (if multiple bundles)
# 6. Python packaging builds successfully (if pyproject.toml present)
# 7. Behaviors don't include root bundles (context sink anti-pattern)
# 8. Behaviors have reasonable context.include token counts.
#    Updated 2026-05-17 to match the policy in foundation/docs/BUNDLE_GUIDE.md
#    §"Behavior context.include Policy" and foundation/docs/AGENT_AUTHORING.md
#    §"Anti-Pattern: Heavy Context in Behaviors".
#    Per-file thresholds:
#      <500 tokens   OK     (lightweight awareness, may stay)
#      500-1000      WARNING (must justify universal relevance)
#      >1000         ERROR  (move to agent body / mode contribution / skill)
#    Prior thresholds (<2000 ERROR, <1000 WARNING) were too lenient and allowed
#    methodology, philosophy, and reference docs to ship in always-on context.
# 9. Standalone bundles in /bundles/ have complete session configuration
# 10. Experimental bundles follow naming conventions
# 11. Behaviors don't include cross-repo root bundles without #subdirectory= fragment
# 12. Behavior bundle names don't collide with root bundle name
# 13. Mode descriptions stay within token budget
#     <500 tokens    OK     (concise, on-point)
#     500-800        WARNING (mode_description_high — consider trimming)
#     >800           ERROR  (mode_description_excessive — must shorten)
#     See foundation:context/shared/description-authoring-principles.md (V5)
# 14. Unadvertised modes (advertised: false) are not referenced by name in agent-readable files
#     (.md files in context/, agents/, behaviors/, skills/, modes/ — excluding the mode's own file)
#     Patterns checked: /<mode-name> and name="<mode-name>"/name='<mode-name>'
#     ERROR: unadvertised_but_referenced — per mode-design-discipline §4 advertising rule
#
# QUALITY LEVELS:
# - good: All bundles load, no errors, no orphans, proper structure, philosophy aligned
# - polish: All load but has warnings (missing descriptions, conventions, minor hygiene)
# - needs_work: Orphan agents, missing root, convention issues, hygiene violations
# - critical: Any bundle fails to load OR Python package fails to build
#
# TOKEN ESTIMATION:
# All size measurements use tokens estimated as: len(content) // 4
# This provides consistent sizing regardless of line length variations.

name: validate-bundle-repo
description: |
  Validates an entire Amplifier bundle repository including:
  - Discovery of all bundle files (root, behaviors, standalone, experiments, providers)
  - Python packaging validation (pyproject.toml force-includes, build check)
  - Individual validation of each bundle via BundleRegistry
  - **NEW in v3.0.0:** Behavior hygiene validation (no root includes, context limits)
  - **NEW in v3.0.0:** Standalone bundle completeness validation
  - **NEW in v3.0.0:** Experiments validation (naming, completeness)
  - **NEW in v3.0.0:** Context sink compliance (root bundle context bloat)
  - **NEW in v3.0.0:** Tool placement analysis (universal vs specialized)
  - **NEW in v3.5.0:** Cross-repo root-bundle reference detection in behavior includes
  - **NEW in v3.5.0:** Behavior name collision detection (behavior vs root bundle name)
  - **NEW in v3.6.0:** Mode description token budget validation (WARNING >500, ERROR >800 tokens)
  - **NEW in v3.6.0:** Mode advertising-rule enforcement (unadvertised modes must not be named in agent-readable files)
  - **NEW in v3.10.0:** README install-instructions convention (behavior-over-root recommendation, `--app` flag, `uv tool install`/`uv pip install` over bare `pip install`, git+https availability for shipped CLIs)
  - Deterministic quality classification with explicit PASS thresholds
  - Quick-approval path for clean repos (no unnecessary LLM analysis)
  - Repository composition analysis (do pieces fit together correctly?)
  - Convention compliance across the whole repo
  
  **v3.2.0 Enhancements: Graceful Environment Handling**
  - Prerequisite check without auto-install attempts (predictable, fast)
  - Validation modes: full | hygiene_only | structural_only
  - Build check gracefully SKIPs when hatchling unavailable (INFO, not ERROR)
  - Foundation unavailability → limited validation mode (not "critical")
  - Clear "Environment Status" section in all reports
  - Separation of "environment limitations" vs "bundle problems"
  
  **Enabling Full Validation (if deps missing)**
  
  If running on a system with externally-managed Python (PEP 668), use uvx:
  ```bash
  # Install deps ephemerally via uvx
  uvx --with hatchling --with "git+https://github.com/microsoft/amplifier-foundation@main" \
      amplifier tool invoke recipes operation=execute \
      recipe_path=foundation:recipes/validate-bundle-repo.yaml \
      context='{"repo_path": "/path/to/repo"}'
  ```
  
  Or install directly with uv:
  ```bash
  uv pip install hatchling
  uv pip install git+https://github.com/microsoft/amplifier-foundation@main
  ```
  
  **v3.1.0 Enhancements:**
  - Inheritance-aware tool placement analysis
  - Understands delegate tool's exclude_tools config (default: ["delegate"])
  - Only flags agent tool declarations as redundant if they're actually inherited
  - Tools in exclude_tools correctly require explicit agent declaration
  
  **v3.0.0 Philosophy Alignment:**
  - Enforces context sink pattern (heavy context → agents, not root/behaviors)
  - Enforces thin behavior pattern (behaviors should be small, focused)
  - Enforces tool placement philosophy (universal → root, specialized → agents)
  - All measurements use TOKENS (len/4), never line counts
  
  For single bundle validation, use validate-bundle.yaml instead.
version: "3.10.0"
author: "Amplifier Foundation Team"
tags: ["bundle", "validation", "quality", "conventions", "repository", "packaging", "hygiene", "context-sink"]

context:
  repo_path: ""  # Required: Path to bundle repository root
  validate_agents: "false"  # Optional: Also run agent validation (true/false)
  validate_recipes: "false"  # Optional: Also run recipe validation (true/false)
  validate_all: "false"  # Optional: Convenience flag — enables both agent and recipe validation
  recipes_dir: "recipes"  # Optional: Subdirectory containing recipes (default: 'recipes')
  known_agents: ""  # Optional: JSON list of known external namespace:agent patterns for recipe validation
  enhance_diagrams: "true"  # Optional: LLM-enhanced DOT labels (true/false, default: true)
  root_bundle_repo: "false"  # Optional (v3.10.0): set "true" if this repo's own purpose is to
    # produce root bundles for users (uncommon) -- suppresses the
    # readme_recommends_root_bundle finding

steps:
  # ============================================================================
  # PHASE 0: Environment Prerequisite Check (v3.2.0)
  # Check available tools WITHOUT auto-install attempts
  # Sets validation_mode: full | hygiene_only | structural_only
  # ============================================================================

  - id: "environment-check"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import sys
      import subprocess

      results = {
          "phase": "environment_prerequisites",
          "python_version": sys.version.split()[0],
          "capabilities": {
              "foundation_available": False,
              "foundation_version": None,
              "check_body_is_instruction_available": False,
              "hatchling_available": False,
              "pip_wheel_available": False
          },
          "validation_mode": "structural_only",  # Default to most limited
          "limitations": [],
          "install_instructions": []
      }

      # Check 1: amplifier_foundation (enables BundleRegistry validation)
      try:
          import amplifier_foundation
          results["capabilities"]["foundation_available"] = True
          results["capabilities"]["foundation_version"] = getattr(amplifier_foundation, "__version__", "unknown")
      except ImportError:
          results["limitations"].append({
              "component": "amplifier_foundation",
              "impact": "Cannot validate individual bundles via BundleRegistry",
              "skipped_checks": ["individual_validation", "standalone_completeness (full)"]
          })
          # Note: amplifier-core must be installed first (foundation depends on it)

      # Check 1b (BUG 2ii): probe the SYMBOL the body-instruction check gates,
      # not just the package. A stale package copy can import fine yet be missing
      # check_body_is_instruction; probing the symbol here surfaces that at
      # Phase 0 with the real cause instead of a misleading "not importable"
      # much later. Kept as a SEPARATE capability so a stale symbol does not
      # over-skip the BundleRegistry-gated phases (which don't need this symbol).
      try:
          from amplifier_foundation.validator import check_body_is_instruction  # noqa: F401
          results["capabilities"]["check_body_is_instruction_available"] = True
      except Exception as exc:
          results["limitations"].append({
              "component": "amplifier_foundation.validator.check_body_is_instruction",
              "impact": "Cannot check that agent/bundle bodies are instructional prose",
              "skipped_checks": ["body_instruction_check"],
              "detail": f"check_body_is_instruction unavailable: {exc}"
          })

      # Check 2: hatchling (enables Python package build validation)
      try:
          import hatchling
          results["capabilities"]["hatchling_available"] = True
      except ImportError:
          results["limitations"].append({
              "component": "hatchling",
              "impact": "Cannot validate Python package builds",
              "skipped_checks": ["build_check"]
          })

      # Build comprehensive install instructions if anything is missing
      foundation_available = results["capabilities"]["foundation_available"]
      hatchling_available = results["capabilities"]["hatchling_available"]
      
      if not foundation_available or not hatchling_available:
          results["install_instructions"] = {
              "summary": "Install missing dependencies, then re-run this recipe for full validation.",
              "standard": [],
              "pep668": []
          }
          
          # Standard uv pip commands (in correct order)
          if not hatchling_available:
              results["install_instructions"]["standard"].append("uv pip install hatchling")
          if not foundation_available:
              results["install_instructions"]["standard"].append(
                  "uv pip install git+https://github.com/microsoft/amplifier-core@main"
              )
              results["install_instructions"]["standard"].append(
                  "uv pip install git+https://github.com/microsoft/amplifier-foundation@main"
              )
          
          # PEP 668 commands (uv's --system flag targets the externally-managed
          # interpreter directly; unlike bare pip, uv does not need
          # --break-system-packages for this)
          if not hatchling_available:
              results["install_instructions"]["pep668"].append(
                  "uv pip install --system hatchling"
              )
          if not foundation_available:
              results["install_instructions"]["pep668"].append(
                  "uv pip install --system git+https://github.com/microsoft/amplifier-core@main"
              )
              results["install_instructions"]["pep668"].append(
                  "uv pip install --system git+https://github.com/microsoft/amplifier-foundation@main"
              )

      # Check 3: pip wheel capability
      try:
          proc = subprocess.run(
              [sys.executable, "-m", "pip", "wheel", "--help"],
              capture_output=True,
              timeout=10
          )
          results["capabilities"]["pip_wheel_available"] = proc.returncode == 0
      except Exception:
          results["capabilities"]["pip_wheel_available"] = False

      if not results["capabilities"]["pip_wheel_available"]:
          results["limitations"].append({
              "component": "pip wheel",
              "impact": "Cannot run build dry-run",
              "skipped_checks": ["build_check"]
          })

      # Determine validation mode based on capabilities
      foundation = results["capabilities"]["foundation_available"]
      hatchling = results["capabilities"]["hatchling_available"]

      if foundation and hatchling:
          results["validation_mode"] = "full"
          results["mode_description"] = "Full validation: all checks enabled"
      elif foundation:
          results["validation_mode"] = "full_no_build"
          results["mode_description"] = "Full validation without build check (hatchling unavailable)"
      elif hatchling:
          results["validation_mode"] = "hygiene_only"
          results["mode_description"] = "Hygiene-only: structural checks without BundleRegistry validation"
      else:
          results["validation_mode"] = "structural_only"
          results["mode_description"] = "Structural-only: basic file checks without dependency validation"

      # Summary
      results["summary"] = {
          "can_validate_bundles": foundation,
          "can_validate_builds": hatchling and results["capabilities"]["pip_wheel_available"],
          "limitations_count": len(results["limitations"]),
          "full_validation_available": foundation and hatchling
      }

      # Note: We do NOT auto-install anything. This is intentional for:
      # - Predictability (no surprise environment changes)
      # - Speed (no waiting for installs)
      # - Permissions (may not have install rights)
      # - Isolation (don't pollute environments)

      print(json.dumps(results))
      EOF
    output: "env_check"
    parse_json: true
    timeout: 30
    on_error: "fail"

  # ============================================================================
  # PHASE 0.1: Validate-All Flags Expansion
  # Expands validate_all='true' to enable both agent and recipe validation
  # ============================================================================

  - id: "validate-all-flags"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json

      validate_all = "{{validate_all}}"
      validate_agents = "{{validate_agents}}"
      validate_recipes = "{{validate_recipes}}"

      # If validate_all is 'true', enable both agent and recipe validation
      if validate_all == "true":
          validate_agents = "true"
          validate_recipes = "true"

      result = {
          "validate_agents": validate_agents,
          "validate_recipes": validate_recipes,
          "validate_all": validate_all
      }

      print(json.dumps(result))
      EOF
    output: "validation_flags"
    parse_json: true
    timeout: 10
    depends_on: ["environment-check"]

  # ============================================================================
  # PHASE 0.5: Packaging Consistency Check
  # Verify pyproject.toml force-includes reference existing directories
  # ============================================================================

  - id: "packaging-check"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import sys
      from pathlib import Path

      repo_path = "{{repo_path}}"

      result = {
          "phase": "packaging_check",
          "has_pyproject": False,
          "force_includes_checked": 0,
          "errors": [],
          "warnings": []
      }

      pyproject_path = Path(repo_path) / "pyproject.toml"

      if not pyproject_path.exists():
          result["skipped"] = True
          result["passed"] = True
          result["reason"] = "No pyproject.toml (not a Python package bundle)"
          print(json.dumps(result))
          sys.exit(0)

      result["has_pyproject"] = True

      try:
          import tomllib
      except ImportError:
          try:
              import tomli as tomllib
          except ImportError:
              result["warnings"].append({
                  "type": "missing_toml_parser",
                  "message": "Cannot parse pyproject.toml - tomllib/tomli not available"
              })
              result["passed"] = True
              print(json.dumps(result))
              sys.exit(0)

      try:
          with open(pyproject_path, "rb") as f:
              config = tomllib.load(f)
      except Exception as e:
          result["errors"].append({
              "type": "toml_parse_error",
              "message": f"Failed to parse pyproject.toml: {e}",
              "severity": "ERROR"
          })
          result["passed"] = False
          print(json.dumps(result))
          sys.exit(0)

      force_includes = (config.get("tool", {})
                             .get("hatch", {})
                             .get("build", {})
                             .get("targets", {})
                             .get("wheel", {})
                             .get("force-include", {}))

      for source_path, dest_path in force_includes.items():
          result["force_includes_checked"] += 1
          full_path = Path(repo_path) / source_path

          if not full_path.exists():
              result["errors"].append({
                  "type": "missing_force_include",
                  "source": source_path,
                  "destination": dest_path,
                  "message": f"pyproject.toml force-include references non-existent path: {source_path}",
                  "severity": "CRITICAL",
                  "fix": f"Either create '{source_path}' or remove/update the force-include entry"
              })

      package_data = config.get("tool", {}).get("setuptools", {}).get("package-data", {})
      for package, patterns in package_data.items():
          for pattern in patterns:
              if "*" not in pattern and "?" not in pattern:
                  full_path = Path(repo_path) / pattern
                  if not full_path.exists():
                      result["warnings"].append({
                          "type": "missing_package_data",
                          "package": package,
                          "pattern": pattern,
                          "message": f"package-data references potentially missing path: {pattern}"
                      })

      result["passed"] = len(result["errors"]) == 0
      print(json.dumps(result))
      EOF
    output: "packaging_check"
    parse_json: true
    timeout: 30
    on_error: "continue"
    depends_on: ["environment-check"]

  # ============================================================================
  # PHASE 0.7: Build Dry-Run Check (v3.2.0 - Graceful Degradation)
  # Now gracefully SKIPs when hatchling unavailable (INFO, not ERROR)
  # ============================================================================

  - id: "build-check"
    type: "bash"
    condition: "{{packaging_check.has_pyproject}} == true"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import subprocess
      import sys
      import tempfile
      from pathlib import Path

      repo_path = "{{repo_path}}"
      env_check = json.loads('''{{env_check}}''')

      result = {
          "phase": "build_check",
          "build_tested": False,
          "errors": [],
          "warnings": [],
          "info": []
      }

      pyproject_path = Path(repo_path) / "pyproject.toml"
      if not pyproject_path.exists():
          result["skipped"] = True
          result["passed"] = True
          result["reason"] = "No pyproject.toml"
          print(json.dumps(result))
          sys.exit(0)

      # v3.2.0: Check if build tools are available BEFORE attempting build
      hatchling_available = env_check.get("capabilities", {}).get("hatchling_available", False)
      pip_wheel_available = env_check.get("capabilities", {}).get("pip_wheel_available", False)

      if not hatchling_available:
          result["skipped"] = True
          result["passed"] = True  # Not a failure - just can't test
          result["reason"] = "hatchling build backend not available"
          result["info"].append({
              "type": "build_tools_unavailable",
              "message": "Build check skipped: hatchling not installed",
              "severity": "INFO",
              "suggestion": "Install hatchling for full build validation: uv pip install hatchling"
          })
          result["environment_limitation"] = True
          print(json.dumps(result))
          sys.exit(0)

      if not pip_wheel_available:
          result["skipped"] = True
          result["passed"] = True
          result["reason"] = "pip wheel not available"
          result["info"].append({
              "type": "pip_wheel_unavailable",
              "message": "Build check skipped: pip wheel command not available",
              "severity": "INFO"
          })
          result["environment_limitation"] = True
          print(json.dumps(result))
          sys.exit(0)

      # Build tools available - proceed with actual build test
      try:
          with tempfile.TemporaryDirectory() as tmpdir:
              proc = subprocess.run(
                  [sys.executable, "-m", "pip", "wheel", "--no-deps", "--no-build-isolation",
                   "-w", tmpdir, repo_path],
                  capture_output=True,
                  text=True,
                  timeout=120,
                  cwd=repo_path
              )

              if proc.returncode != 0:
                  error_output = proc.stderr or proc.stdout

                  # v3.2.0: Check if this is ACTUALLY a missing hatchling error
                  # (can happen even if import worked, due to version mismatch)
                  if "hatchling" in error_output.lower() and ("not found" in error_output.lower() or "no module" in error_output.lower()):
                      result["skipped"] = True
                      result["passed"] = True
                      result["reason"] = "hatchling not properly configured for this project"
                      result["info"].append({
                          "type": "hatchling_mismatch",
                          "message": "Build backend available but not compatible with this project",
                          "severity": "INFO",
                          "details": error_output[-500:]
                      })
                      result["environment_limitation"] = True
                  elif "FileNotFoundError" in error_output or "No such file or directory" in error_output:
                      # This IS a bundle problem - missing file referenced in config
                      result["errors"].append({
                          "type": "build_missing_file",
                          "message": "Build failed due to missing file (bundle configuration issue)",
                          "details": error_output[-2000:],
                          "severity": "ERROR"
                      })
                  elif "force-include" in error_output.lower():
                      result["errors"].append({
                          "type": "build_force_include_error",
                          "message": "Build failed due to force-include configuration",
                          "details": error_output[-2000:],
                          "severity": "ERROR"
                      })
                  else:
                      result["errors"].append({
                          "type": "build_error",
                          "message": "Package build failed",
                          "details": error_output[-2000:],
                          "severity": "ERROR"
                      })
              else:
                  result["build_tested"] = True
                  result["build_success"] = True

      except subprocess.TimeoutExpired:
          result["warnings"].append({
              "type": "build_timeout",
              "message": "Build check timed out (120s) - may indicate complex build"
          })
      except FileNotFoundError:
          result["skipped"] = True
          result["passed"] = True
          result["reason"] = "pip not available"
          result["info"].append({
              "type": "pip_unavailable",
              "message": "Build check skipped: pip not found",
              "severity": "INFO"
          })
          result["environment_limitation"] = True
      except Exception as e:
          result["warnings"].append({
              "type": "build_check_error",
              "message": f"Build check encountered error: {e}"
          })

      result["passed"] = len(result["errors"]) == 0
      print(json.dumps(result))
      EOF
    output: "build_check"
    parse_json: true
    timeout: 180
    depends_on: ["packaging-check"]

  - id: "set-default-build-check"
    type: "bash"
    condition: "{{packaging_check.has_pyproject}} != true"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      result = {
          "phase": "build_check",
          "skipped": True,
          "passed": True,
          "reason": "No pyproject.toml - not a Python package"
      }
      print(json.dumps(result))
      EOF
    output: "build_check"
    parse_json: true
    timeout: 10
    on_error: "fail"
    depends_on: ["packaging-check"]

  # ============================================================================
  # PHASE 1: Enhanced Repository Discovery
  # Find all bundle files with separate tracking for each category
  # NEW in v3.0.0: Separate experiments tracking, token-based size analysis
  # ============================================================================

  - id: "repo-discovery"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      from pathlib import Path

      def estimate_tokens(content: str) -> int:
          """Estimate token count as len(content) // 4."""
          return len(content) // 4

      def discover_bundles(repo_path: str) -> dict:
          """Discover all bundle files in a repository with enhanced categorization."""
          results = {
              "phase": "discovery",
              "repo_path": repo_path,
              "bundles_found": {
                  "root": [],
                  "behaviors": [],
                  "standalone": [],  # /bundles/ directory
                  "experiments": [],  # /experiments/ directory - NEW in v3.0.0
                  "providers": [],
                  "agents": [],
                  "other": []
              },
              "bundle_details": {},  # path -> {size_bytes, size_tokens, ...}
              "total_count": 0,
              "repo_structure": {},
              "errors": []
          }

          path = Path(repo_path).resolve()

          if not path.exists():
              results["errors"].append({
                  "type": "path_error",
                  "message": f"Repository path does not exist: {repo_path}"
              })
              print(json.dumps(results))
              return results

          if not path.is_dir():
              results["errors"].append({
                  "type": "path_error",
                  "message": f"Path is not a directory: {repo_path}"
              })
              print(json.dumps(results))
              return results

          def get_bundle_details(bundle_path: Path) -> dict:
              """Get details about a bundle file including token count."""
              try:
                  content = bundle_path.read_text()
                  return {
                      "path": str(bundle_path),
                      "size_bytes": len(content),
                      "size_tokens": estimate_tokens(content),
                      "filename": bundle_path.name,
                      "parent_dir": bundle_path.parent.name
                  }
              except Exception as e:
                  return {
                      "path": str(bundle_path),
                      "size_bytes": 0,
                      "size_tokens": 0,
                      "error": str(e)
                  }

          # Check for root bundle
          for name in ["bundle.md", "bundle.yaml"]:
              root_bundle = path / name
              if root_bundle.exists():
                  results["bundles_found"]["root"].append(str(root_bundle))
                  results["bundle_details"][str(root_bundle)] = get_bundle_details(root_bundle)

          # Scan conventional directories with separate categories
          scan_dirs = {
              "behaviors": "behaviors",
              "standalone": "bundles",
              "experiments": "experiments",  # NEW in v3.0.0
              "providers": "providers",
              "agents": "agents"
          }

          for category, dir_name in scan_dirs.items():
              dir_path = path / dir_name
              if dir_path.exists() and dir_path.is_dir():
                  for item in dir_path.iterdir():
                      if item.is_file() and item.suffix in [".md", ".yaml", ".yml"]:
                          results["bundles_found"][category].append(str(item))
                          results["bundle_details"][str(item)] = get_bundle_details(item)
                      elif item.is_dir():
                          # Check for bundle inside subdirectory
                          for sub_name in ["bundle.md", "bundle.yaml"]:
                              sub_bundle = item / sub_name
                              if sub_bundle.exists():
                                  results["bundles_found"][category].append(str(sub_bundle))
                                  results["bundle_details"][str(sub_bundle)] = get_bundle_details(sub_bundle)

          # Map repo structure
          results["repo_structure"] = {
              "has_root_bundle": len(results["bundles_found"]["root"]) > 0,
              "has_behaviors": len(results["bundles_found"]["behaviors"]) > 0,
              "has_standalone": len(results["bundles_found"]["standalone"]) > 0,
              "has_experiments": len(results["bundles_found"]["experiments"]) > 0,
              "has_providers": len(results["bundles_found"]["providers"]) > 0,
              "has_agents": len(results["bundles_found"]["agents"]) > 0,
              # NEW (v3.9.0): skills use a skills/<name>/SKILL.md layout, not the
              # bundle.md layout scan_dirs detects, so probe the directory
              # directly for the composable-surface check.
              "has_skills": (path / "skills").is_dir(),
              "directories": [d.name for d in path.iterdir() if d.is_dir() and not d.name.startswith(".")]
          }

          # Count totals
          for category, bundles in results["bundles_found"].items():
              results["total_count"] += len(bundles)

          # Summary statistics
          results["summary"] = {
              "root_count": len(results["bundles_found"]["root"]),
              "behaviors_count": len(results["bundles_found"]["behaviors"]),
              "standalone_count": len(results["bundles_found"]["standalone"]),
              "experiments_count": len(results["bundles_found"]["experiments"]),
              "providers_count": len(results["bundles_found"]["providers"]),
              "agents_count": len(results["bundles_found"]["agents"]),
              "total_tokens": sum(d.get("size_tokens", 0) for d in results["bundle_details"].values())
          }

          print(json.dumps(results))
          return results

      discover_bundles("{{repo_path}}")
      EOF
    output: "discovery_results"
    parse_json: true
    timeout: 60
    on_error: "fail"
    depends_on: ["packaging-check", "build-check", "set-default-build-check"]

  # ============================================================================
  # PHASE 1.5: YAML Structure Lint (v3.4.0)
  # Checks ALL discovered bundles for silent-failure structural bugs:
  #
  # Bug 1: includes: nested under bundle: instead of top-level
  #   Bundle.from_dict() reads data.get('includes', []) — top-level only.
  #   Nested bundle.includes is silently invisible. All includes are lost.
  #
  # Bug 2: Unrecognized dict keys in includes entries
  #   _parse_include() only checks for 'bundle:' key in dict entries.
  #   Any other key (e.g., 'behavior:', 'include:') returns None silently.
  #
  # Runs EARLY (before BundleRegistry validation) because these bugs cause
  # bundles to appear to load "successfully" but with missing includes —
  # the most insidious kind of failure.
  # ============================================================================

  - id: "yaml-structure-lint"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import sys
      from pathlib import Path

      try:
          import yaml
      except ImportError:
          print(json.dumps({
              "phase": "yaml_structure_lint",
              "skipped": True,
              "passed": True,
              "reason": "PyYAML not available",
              "bundles_checked": 0,
              "errors": [],
              "bundle_results": []
          }))
          sys.exit(0)

      discovery = json.loads('''{{discovery_results}}''')

      # Collect all bundle files from all categories
      all_bundle_files = []
      for category, paths in discovery.get("bundles_found", {}).items():
          for bundle_path in paths:
              all_bundle_files.append({"path": bundle_path, "category": category})

      results = {
          "phase": "yaml_structure_lint",
          "bundles_checked": 0,
          "errors": [],
          "warnings": [],
          "bundle_results": [],
          "passed": True
      }

      for bundle_info in all_bundle_files:
          bundle_path = bundle_info["path"]
          category = bundle_info["category"]
          results["bundles_checked"] += 1

          bundle_result = {
              "path": bundle_path,
              "category": category,
              "name": Path(bundle_path).stem,
              "errors": [],
              "passed": True
          }

          path = Path(bundle_path).resolve()
          if not path.exists():
              results["bundle_results"].append(bundle_result)
              continue

          try:
              content = path.read_text()
          except Exception:
              results["bundle_results"].append(bundle_result)
              continue

          # Parse YAML (handle .md frontmatter)
          yaml_data = None
          if path.suffix == '.md':
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 2:
                      try:
                          yaml_data = yaml.safe_load(parts[1])
                      except yaml.YAMLError:
                          results["bundle_results"].append(bundle_result)
                          continue
              else:
                  results["bundle_results"].append(bundle_result)
                  continue
          else:
              try:
                  yaml_data = yaml.safe_load(content)
              except yaml.YAMLError:
                  results["bundle_results"].append(bundle_result)
                  continue

          if not isinstance(yaml_data, dict):
              results["bundle_results"].append(bundle_result)
              continue

          # Extract bundle name for better error messages
          bundle_section = yaml_data.get("bundle")
          if isinstance(bundle_section, dict):
              bundle_result["name"] = bundle_section.get("name", bundle_result["name"])

          # ── Bug 1: includes: nested under bundle: instead of top-level ──
          if isinstance(bundle_section, dict) and "includes" in bundle_section:
              nested_includes = bundle_section["includes"]
              count = len(nested_includes) if isinstance(nested_includes, list) else 1
              error = {
                  "type": "nested_includes",
                  "severity": "ERROR",
                  "bundle_path": bundle_path,
                  "bundle_name": bundle_result["name"],
                  "category": category,
                  "count": count,
                  "message": (
                      f"'includes:' is nested under 'bundle:' in {Path(bundle_path).name} — "
                      f"{count} include(s) SILENTLY DROPPED. "
                      f"Bundle.from_dict() reads data.get('includes', []) from top-level only."
                  ),
                  "fix": (
                      "Move 'includes:' to the top level (same indent as 'bundle:').\n"
                      "  BROKEN:\n"
                      "    bundle:\n"
                      "      name: my-bundle\n"
                      "      includes:        # WRONG: nested\n"
                      "        - bundle: foo\n"
                      "  CORRECT:\n"
                      "    bundle:\n"
                      "      name: my-bundle\n"
                      "    includes:            # RIGHT: top level\n"
                      "      - bundle: foo"
                  )
              }
              bundle_result["errors"].append(error)
              results["errors"].append(error)
              bundle_result["passed"] = False
              results["passed"] = False

          # ── Bug 2: Unrecognized dict keys in includes entries ──
          top_includes = yaml_data.get("includes", [])
          if isinstance(top_includes, list):
              for idx, inc in enumerate(top_includes):
                  if isinstance(inc, dict):
                      keys = list(inc.keys())
                      if "bundle" not in keys:
                          bad_keys = [k for k in keys]
                          error = {
                              "type": "unrecognized_include_key",
                              "severity": "ERROR",
                              "bundle_path": bundle_path,
                              "bundle_name": bundle_result["name"],
                              "category": category,
                              "index": idx,
                              "unrecognized_keys": bad_keys,
                              "message": (
                                  f"includes[{idx}] in {Path(bundle_path).name} has key "
                                  f"'{bad_keys[0]}' — NOT RECOGNIZED. Only 'bundle:' is valid. "
                                  f"This entry is SILENTLY DROPPED by _parse_include()."
                              ),
                              "fix": (
                                  f"Change '- {bad_keys[0]}: ...' to '- bundle: ...'.\n"
                                  "  Valid formats: '- bundle: name', '- bundle: ns:path', "
                                  "'- bundle: git+https://...', or bare string '- name'"
                              )
                          }
                          bundle_result["errors"].append(error)
                          results["errors"].append(error)
                          bundle_result["passed"] = False
                          results["passed"] = False

          results["bundle_results"].append(bundle_result)

      results["summary"] = {
          "bundles_checked": results["bundles_checked"],
          "errors_total": len(results["errors"]),
          "nested_includes_count": len([e for e in results["errors"] if e["type"] == "nested_includes"]),
          "unrecognized_keys_count": len([e for e in results["errors"] if e["type"] == "unrecognized_include_key"]),
          "bundles_with_errors": len([b for b in results["bundle_results"] if not b["passed"]]),
          "passed": results["passed"]
      }

      print(json.dumps(results))
      EOF
    output: "structure_lint"
    parse_json: true
    timeout: 60
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2: Individual Bundle Validation
  # Validate each discovered bundle structurally
  # ============================================================================

  - id: "validate-all-bundles"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import asyncio
      import json
      import re
      import sys
      from pathlib import Path

      env_check = json.loads('''{{env_check}}''')
      
      # v3.2.0: Check foundation availability from capabilities dict
      foundation_available = env_check.get("capabilities", {}).get("foundation_available", False)
      
      if not foundation_available:
          # v3.2.0: This is an environment limitation, NOT a bundle problem
          print(json.dumps({
              "phase": "individual_validation",
              "skipped": True,
              "environment_limitation": True,  # v3.2.0: Flag this as env issue
              "reason": "amplifier_foundation not available - BundleRegistry validation skipped",
              "validation_mode": env_check.get("validation_mode", "structural_only"),
              "note": "Structural checks still performed; install amplifier_foundation for full validation"
          }))
          sys.exit(0)

      from amplifier_foundation import BundleRegistry
      from amplifier_foundation.exceptions import (
          BundleLoadError,
          BundleNotFoundError,
          BundleDependencyError,
          BundleValidationError
      )

      discovery = json.loads('''{{discovery_results}}''')
      
      async def validate_bundle(bundle_path: str, category: str) -> dict:
          """Validate a single bundle and return results."""
          result = {
              "path": bundle_path,
              "category": category,
              "passed": True,
              "name": None,
              "errors": [],
              "warnings": []
          }

          try:
              registry = BundleRegistry()
              path = Path(bundle_path).resolve()
              uri = f"file://{path}"

              bundle = await registry._load_single(
                  uri,
                  auto_register=True,
                  auto_include=False
              )

              result["name"] = bundle.name
              result["version"] = bundle.version
              result["has_instruction"] = bool(bundle.instruction)
              result["includes_count"] = len(bundle.includes)
              result["agents_count"] = len(bundle.agents)
              result["has_description"] = bool(getattr(bundle, 'description', None))

              if category == "agents":
                  # Agent files use meta: frontmatter (meta.name/meta.description),
                  # not the bundle: schema — check the schema agents actually use.
                  import yaml
                  meta = {}
                  fm_match = re.match(r'^---\n(.*?)\n---', path.read_text(), re.DOTALL)
                  if fm_match:
                      try:
                          fm = yaml.safe_load(fm_match.group(1)) or {}
                          if isinstance(fm.get("meta"), dict):
                              meta = fm["meta"]
                      except Exception:
                          pass
                  result["name"] = meta.get("name") or bundle.name
                  result["has_description"] = bool(meta.get("description") or getattr(bundle, 'description', None))

                  if not result["name"]:
                      result["warnings"].append("Missing meta.name")

                  if not result["has_description"]:
                      result["warnings"].append("Missing meta.description")
              else:
                  if not bundle.name:
                      result["warnings"].append("Missing bundle.name")
                  
                  if not getattr(bundle, 'description', None):
                      result["warnings"].append("Missing bundle description")

          except BundleDependencyError as e:
              result["passed"] = False
              result["errors"].append(f"Dependency error: {e}")
          except BundleLoadError as e:
              result["passed"] = False
              result["errors"].append(f"Load error: {e}")
          except Exception as e:
              result["passed"] = False
              result["errors"].append(f"{type(e).__name__}: {e}")

          return result

      async def validate_all():
          results = {
              "phase": "individual_validation",
              "skipped": False,
              "bundles": [],
              "summary": {
                  "total": 0,
                  "passed": 0,
                  "failed": 0,
                  "warnings": 0,
                  "by_category": {}
              }
          }

          all_bundles = []
          for category, paths in discovery.get("bundles_found", {}).items():
              for path in paths:
                  all_bundles.append((path, category))

          for bundle_path, category in all_bundles:
              result = await validate_bundle(bundle_path, category)
              results["bundles"].append(result)
              results["summary"]["total"] += 1
              
              if result["passed"]:
                  results["summary"]["passed"] += 1
              else:
                  results["summary"]["failed"] += 1
              
              if result.get("warnings"):
                  results["summary"]["warnings"] += len(result["warnings"])

              if category not in results["summary"]["by_category"]:
                  results["summary"]["by_category"][category] = {"passed": 0, "failed": 0, "warnings": 0}
              
              if result["passed"]:
                  results["summary"]["by_category"][category]["passed"] += 1
              else:
                  results["summary"]["by_category"][category]["failed"] += 1
              
              if result.get("warnings"):
                  results["summary"]["by_category"][category]["warnings"] += len(result["warnings"])

          print(json.dumps(results))

      asyncio.run(validate_all())
      EOF
    output: "individual_validation"
    parse_json: true
    timeout: 300
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2.1: Behavior Hygiene Validation (NEW in v3.0.0)
  # Validates bundles in /behaviors/ against hygiene rules:
  # - No includes to root bundles (anti-pattern)
  # - No session.orchestrator (behavior shouldn't be standalone)
  # - No providers (behavior shouldn't define providers)
  # - context.include total tokens < 2000 (ERROR) / < 1000 (WARNING)
  # - context.include file count <= 3 (WARNING if >3)
  # - Tool count <= 2 (WARNING if >2)
  # ============================================================================

  - id: "behavior-hygiene-validation"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      import sys
      from pathlib import Path

      def estimate_tokens(content: str) -> int:
          """Estimate token count as len(content) // 4."""
          return len(content) // 4

      def parse_yaml_bundle(path: Path) -> dict:
          """Parse a bundle file (YAML or MD with YAML frontmatter)."""
          try:
              content = path.read_text()
              
              # Handle markdown with YAML frontmatter
              if path.suffix == '.md':
                  # Extract YAML from frontmatter (between --- markers)
                  match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
                  if match:
                      yaml_content = match.group(1)
                  else:
                      return {"error": "No YAML frontmatter found"}
              else:
                  yaml_content = content
              
              # Try to parse YAML
              try:
                  import yaml
                  return yaml.safe_load(yaml_content) or {}
              except ImportError:
                  # Fallback: basic regex parsing for key fields
                  result = {}
                  
                  # Check for session.orchestrator
                  if re.search(r'^\s*orchestrator:', yaml_content, re.MULTILINE):
                      result["session"] = {"orchestrator": True}
                  
                  # Check for providers
                  if re.search(r'^providers:', yaml_content, re.MULTILINE):
                      result["providers"] = [{}]
                  
                  # Check for includes
                  includes_match = re.search(r'^includes:\s*\n((?:\s+-.*\n)*)', yaml_content, re.MULTILINE)
                  if includes_match:
                      includes_section = includes_match.group(1)
                      result["includes"] = re.findall(r'-\s*bundle:\s*(.+)', includes_section)
                  
                  # Check context.include
                  context_match = re.search(r'^context:\s*\n((?:\s+.*\n)*)', yaml_content, re.MULTILINE)
                  if context_match:
                      context_section = context_match.group(1)
                      include_match = re.search(r'include:\s*\n((?:\s+-.*\n)*)', context_section)
                      if include_match:
                          includes = re.findall(r'-\s*(.+)', include_match.group(1))
                          result["context"] = {"include": includes}
                  
                  # Check tools
                  tools_match = re.search(r'^tools:\s*\n((?:\s+-.*\n)*)', yaml_content, re.MULTILINE)
                  if tools_match:
                      tools_section = tools_match.group(1)
                      result["tools"] = [{}] * len(re.findall(r'-\s*module:', tools_section))
                  
                  return result
              
          except Exception as e:
              return {"error": str(e)}

      def is_root_bundle_reference(include_ref: str, repo_path: Path) -> bool:
          """Check if an include reference points to a root bundle."""
          # Known root bundles patterns
          root_patterns = [
              r'^foundation$',  # Just "foundation"
              r'amplifier-foundation(@|$)',  # GitHub reference to foundation
              r'bundle\.md$',  # Direct reference to bundle.md
              r'bundle\.yaml$',  # Direct reference to bundle.yaml
              r'^file://.*bundle\.(md|yaml)$',  # File URI to root bundle
          ]
          
          for pattern in root_patterns:
              if re.search(pattern, include_ref):
                  return True
          
          # Check if it's a reference to repo's own root bundle
          if 'bundle:' in include_ref:
              # Extract bundle name
              bundle_name = include_ref.replace('bundle:', '').strip()
              # Check if this resolves to repo root
              for ext in ['.md', '.yaml']:
                  if (repo_path / f"bundle{ext}").exists():
                      return bundle_name == '' or bundle_name == repo_path.name
          
          return False

      def validate_behaviors(repo_path: str) -> dict:
          """Validate all behaviors against hygiene rules."""
          results = {
              "phase": "behavior_hygiene",
              "behaviors_checked": 0,
              "errors": [],
              "warnings": [],
              "info": [],
              "behavior_details": []
          }

          path = Path(repo_path).resolve()
          behaviors_dir = path / "behaviors"

          if not behaviors_dir.exists():
              results["skipped"] = True
              results["passed"] = True
              results["reason"] = "No behaviors/ directory"
              print(json.dumps(results))
              return results

          # Collect all behavior files
          behavior_files = []
          for item in behaviors_dir.iterdir():
              if item.is_file() and item.suffix in [".md", ".yaml", ".yml"]:
                  behavior_files.append(item)
              elif item.is_dir():
                  for sub_name in ["bundle.md", "bundle.yaml"]:
                      sub_bundle = item / sub_name
                      if sub_bundle.exists():
                          behavior_files.append(sub_bundle)

          for behavior_path in behavior_files:
              results["behaviors_checked"] += 1
              behavior_name = behavior_path.stem if behavior_path.name not in ["bundle.md", "bundle.yaml"] else behavior_path.parent.name
              
              detail = {
                  "path": str(behavior_path),
                  "name": behavior_name,
                  "issues": []
              }

              # Parse the bundle
              bundle_data = parse_yaml_bundle(behavior_path)
              
              if "error" in bundle_data:
                  results["warnings"].append({
                      "behavior": behavior_name,
                      "type": "parse_error",
                      "message": f"Could not parse behavior: {bundle_data['error']}"
                  })
                  detail["parse_error"] = bundle_data["error"]
                  results["behavior_details"].append(detail)
                  continue

              # Rule 1: Check for root bundle includes (ERROR)
              includes = bundle_data.get("includes", [])
              if isinstance(includes, list):
                  for inc in includes:
                      if isinstance(inc, dict):
                          bundle_ref = inc.get("bundle", "")
                      else:
                          bundle_ref = str(inc)
                      
                      if is_root_bundle_reference(bundle_ref, path):
                          results["errors"].append({
                              "behavior": behavior_name,
                              "type": "includes_root_bundle",
                              "message": f"Behavior includes root bundle '{bundle_ref}' - anti-pattern",
                              "severity": "ERROR",
                              "fix": "Behaviors should not include root bundles. Extract shared functionality to a separate behavior."
                          })
                          detail["issues"].append("includes_root_bundle")

              # Rule 2: Check for session.orchestrator (ERROR)
              session = bundle_data.get("session", {})
              if isinstance(session, dict) and session.get("orchestrator"):
                  results["errors"].append({
                      "behavior": behavior_name,
                      "type": "has_session_orchestrator",
                      "message": "Behavior defines session.orchestrator - behaviors should not be standalone",
                      "severity": "ERROR",
                      "fix": "Remove session.orchestrator. If this needs to be standalone, move to /bundles/"
                  })
                  detail["issues"].append("has_session_orchestrator")

              # Rule 3: Check for providers (ERROR)
              providers = bundle_data.get("providers", [])
              if providers:
                  results["errors"].append({
                      "behavior": behavior_name,
                      "type": "has_providers",
                      "message": f"Behavior defines {len(providers)} provider(s) - behaviors should not define providers",
                      "severity": "ERROR",
                      "fix": "Remove providers. Providers should be in /providers/ or the root bundle."
                  })
                  detail["issues"].append("has_providers")

              # Rule 4: Check context.include token count
              context = bundle_data.get("context", {})
              context_includes = []
              if isinstance(context, dict):
                  context_includes = context.get("include", [])
              
              total_context_tokens = 0
              if context_includes:
                  detail["context_include_count"] = len(context_includes)
                  
                  # Estimate tokens for each included file
                  for include_ref in context_includes:
                      if isinstance(include_ref, str):
                          # Try to resolve and read the file
                          include_path = None
                          if include_ref.startswith("@"):
                              # Bundle reference - can't easily resolve without registry
                              # Estimate ~500 tokens per awareness file
                              total_context_tokens += 500
                          else:
                              # Relative path
                              include_path = behavior_path.parent / include_ref
                              if not include_path.exists():
                                  include_path = path / include_ref
                              
                              if include_path and include_path.exists():
                                  try:
                                      content = include_path.read_text()
                                      total_context_tokens += estimate_tokens(content)
                                  except:
                                      total_context_tokens += 500  # Default estimate
                              else:
                                  total_context_tokens += 500
                  
                  detail["context_total_tokens"] = total_context_tokens
                  
                  # ERROR: >1000 tokens (tightened 2026-05-17 per
                  # foundation/docs/BUNDLE_GUIDE.md §"Behavior context.include Policy"
                  # and AGENT_AUTHORING.md §"Hard policy: behavior context.include
                  # token budget").
                  if total_context_tokens > 1000:
                      results["errors"].append({
                          "behavior": behavior_name,
                          "type": "context_tokens_excessive",
                          "message": f"context.include totals ~{total_context_tokens} tokens (>1000 ERROR threshold)",
                          "severity": "ERROR",
                          "fix": "Move heavy context to one of: expert agent body (@-mention in agent .md), mode contribution (contributes.context in mode YAML or @-mention in mode body), or skill (load_skill on demand). Behaviors should only carry lightweight awareness <500 tokens."
                      })
                      detail["issues"].append("context_tokens_excessive")
                  # WARNING: >500 tokens (tightened 2026-05-17 — only genuine awareness
                  # files (introducing a capability, telling LLM when to delegate) qualify
                  # for behavior context.include).
                  elif total_context_tokens > 500:
                      results["warnings"].append({
                          "behavior": behavior_name,
                          "type": "context_tokens_high",
                          "message": f"context.include totals ~{total_context_tokens} tokens (>500 WARNING threshold)",
                          "severity": "WARNING",
                          "fix": "Justify universal relevance, or move to a context-sink mechanism (agent body, mode contribution, skill). The 500-token bar is for awareness pointers only."
                      })
                      detail["issues"].append("context_tokens_high")

                  # WARNING: >3 include files
                  if len(context_includes) > 3:
                      results["warnings"].append({
                          "behavior": behavior_name,
                          "type": "context_include_count_high",
                          "message": f"context.include has {len(context_includes)} files (>3 threshold)",
                          "severity": "WARNING",
                          "fix": "Consolidate context includes or move to agents."
                      })
                      detail["issues"].append("context_include_count_high")

              # Rule 5: Check tool count (WARNING if >2)
              tools = bundle_data.get("tools", [])
              if tools and len(tools) > 2:
                  results["warnings"].append({
                      "behavior": behavior_name,
                      "type": "tool_count_high",
                      "message": f"Behavior defines {len(tools)} tools (>2 threshold)",
                      "severity": "WARNING",
                      "fix": "Consider moving specialized tools behind agents."
                  })
                  detail["issues"].append("tool_count_high")
              
              detail["tool_count"] = len(tools) if tools else 0
              results["behavior_details"].append(detail)

          results["passed"] = len(results["errors"]) == 0
          results["summary"] = {
              "behaviors_checked": results["behaviors_checked"],
              "errors": len(results["errors"]),
              "warnings": len(results["warnings"]),
              "clean_behaviors": results["behaviors_checked"] - len(set(e["behavior"] for e in results["errors"]))
          }

          print(json.dumps(results))
          return results

      validate_behaviors("{{repo_path}}")
      EOF
    output: "behavior_hygiene_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["validate-all-bundles"]

  # ============================================================================
  # PHASE 2.1.5: Behavior Reference Hygiene (NEW in v3.5.0)
  # Two cross-cutting checks on behavior includes:
  #
  # Check A — Cross-repo root-bundle references
  #   For each behavior YAML in behaviors/, examine includes: entries.
  #   If any entry is git+https://...@<ref> WITHOUT a #subdirectory= fragment,
  #   warn — the behavior is pulling an entire foreign root bundle instead of
  #   the specific behavior file it needs.
  #   Severity: WARNING (allow override for intentional monorepo cases)
  #
  # Check B — Name collision between root bundle and behaviors
  #   If behavior.bundle.name == root_bundle.bundle.name, warn.
  #   Collision causes self-referential BundleState registry entries
  #   (BundleState["X"].included_by = ['X', ...]) and confusing chain rendering.
  #   Severity: WARNING
  # ============================================================================

  - id: "behavior-reference-hygiene"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      import sys
      from pathlib import Path

      repo_path = "{{repo_path}}"
      path = Path(repo_path).resolve()
      behaviors_dir = path / "behaviors"

      results = {
          "phase": "behavior_reference_hygiene",
          "behaviors_checked": 0,
          "root_bundle_name": None,
          "errors": [],
          "warnings": [],
          "behavior_details": []
      }

      if not behaviors_dir.exists():
          results["skipped"] = True
          results["passed"] = True
          results["reason"] = "No behaviors/ directory"
          print(json.dumps(results))
          sys.exit(0)

      # ── YAML parser (with graceful fallback) ──────────────────────────────
      try:
          import yaml as _yaml
          def parse_yaml(text: str) -> dict:
              return _yaml.safe_load(text) or {}
      except ImportError:
          def parse_yaml(text: str) -> dict:
              # Minimal regex fallback — good enough for name extraction
              result = {}
              m = re.search(r'^  name:\s*(.+)', text, re.MULTILINE)
              if m:
                  result["_name_fallback"] = m.group(1).strip().strip('"').strip("'")
              return result

      def extract_frontmatter_yaml(path: Path) -> dict:
          """Read a bundle file and return its parsed YAML dict."""
          try:
              content = path.read_text()
              if path.suffix == ".md":
                  match = re.match(r"^---\s*\n(.*?)\n---", content, re.DOTALL)
                  yaml_text = match.group(1) if match else ""
              else:
                  yaml_text = content
              return parse_yaml(yaml_text)
          except Exception:
              return {}

      def get_bundle_name(data: dict) -> str | None:
          """Extract bundle name from parsed YAML data."""
          bundle_section = data.get("bundle", {})
          if isinstance(bundle_section, dict):
              name = bundle_section.get("name")
              if name:
                  return str(name).strip()
          # Fallback for regex parse path
          return data.get("_name_fallback")

      def is_bare_git_ref(bundle_ref: str) -> bool:
          """True if ref is a git+https URL WITHOUT a #subdirectory= fragment."""
          if not isinstance(bundle_ref, str):
              return False
          if not bundle_ref.startswith(("git+https://", "git+http://")):
              return False
          if "#subdirectory=" in bundle_ref:
              return False
          # Must have a ref pin (@branch / @tag / @sha)
          if "@" not in bundle_ref.split("://", 1)[-1]:
              return False
          return True

      # ── Read root bundle name (prerequisite for Check B) ─────────────────
      root_bundle_name: str | None = None
      for root_filename in ("bundle.md", "bundle.yaml"):
          root_file = path / root_filename
          if root_file.exists():
              root_data = extract_frontmatter_yaml(root_file)
              root_bundle_name = get_bundle_name(root_data)
              if root_bundle_name:
                  break
      results["root_bundle_name"] = root_bundle_name

      # ── Collect behavior files ─────────────────────────────────────────────
      behavior_files: list[Path] = []
      for item in behaviors_dir.iterdir():
          if item.is_file() and item.suffix in (".md", ".yaml", ".yml"):
              behavior_files.append(item)
          elif item.is_dir():
              for sub_name in ("bundle.md", "bundle.yaml"):
                  sub_file = item / sub_name
                  if sub_file.exists():
                      behavior_files.append(sub_file)

      for behavior_path in sorted(behavior_files):
          results["behaviors_checked"] += 1
          behavior_name = (
              behavior_path.stem
              if behavior_path.name not in ("bundle.md", "bundle.yaml")
              else behavior_path.parent.name
          )

          detail: dict = {
              "path": str(behavior_path),
              "name": behavior_name,
              "bundle_name": None,
              "issues": []
          }

          data = extract_frontmatter_yaml(behavior_path)
          behavior_bundle_name = get_bundle_name(data)
          detail["bundle_name"] = behavior_bundle_name

          # ── Check A: Cross-repo root-bundle reference ─────────────────────
          includes = data.get("includes", [])
          if isinstance(includes, list):
              for inc in includes:
                  if isinstance(inc, dict):
                      bundle_ref = inc.get("bundle", "")
                  else:
                      bundle_ref = str(inc) if inc is not None else ""

                  if is_bare_git_ref(bundle_ref):
                      # Extract the repo name for a helpful message
                      repo_part = bundle_ref.split("@")[0].rstrip("/")
                      repo_name = repo_part.split("/")[-1]
                      results["warnings"].append({
                          "behavior": behavior_name,
                          "type": "cross_repo_root_bundle_ref",
                          "reference": bundle_ref,
                          "message": (
                              f"Behavior '{behavior_name}' includes bare root-bundle ref "
                              f"'{bundle_ref}' without #subdirectory= fragment — "
                              f"should reference '{repo_name}' behavior file instead "
                              f"(e.g. '{bundle_ref}#subdirectory=behaviors/<name>.yaml')"
                          ),
                          "severity": "WARNING",
                          "fix": (
                              f"Append #subdirectory=behaviors/<behavior-name>.yaml "
                              f"to: {bundle_ref}"
                          )
                      })
                      detail["issues"].append("cross_repo_root_bundle_ref")

          # ── Check B: Name collision with root bundle ───────────────────────
          if (
              behavior_bundle_name
              and root_bundle_name
              and behavior_bundle_name == root_bundle_name
          ):
              results["warnings"].append({
                  "behavior": behavior_name,
                  "type": "name_collision_with_root",
                  "name": behavior_bundle_name,
                  "message": (
                      f"Behavior bundle name '{behavior_bundle_name}' collides with "
                      f"root bundle name '{root_bundle_name}' — rename behavior to "
                      f"'{behavior_bundle_name}-behavior' for clarity"
                  ),
                  "severity": "WARNING",
                  "fix": (
                      f"Change the behavior's bundle.name from '{behavior_bundle_name}' "
                      f"to '{behavior_bundle_name}-behavior'"
                  )
              })
              detail["issues"].append("name_collision_with_root")

          results["behavior_details"].append(detail)

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "behaviors_checked": results["behaviors_checked"],
          "root_bundle_name": root_bundle_name,
          "warnings": len(results["warnings"]),
          "cross_repo_root_refs": sum(
              1 for w in results["warnings"] if w["type"] == "cross_repo_root_bundle_ref"
          ),
          "name_collisions": sum(
              1 for w in results["warnings"] if w["type"] == "name_collision_with_root"
          )
      }

      print(json.dumps(results))
      EOF
    output: "behavior_reference_hygiene_results"
    parse_json: true
    timeout: 60
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2.2: Standalone Completeness Validation (NEW in v3.0.0)
  # Validates bundles in /bundles/ have complete session configuration
  # (orchestrator + context module) either directly or via includes chain
  # ============================================================================

  - id: "standalone-completeness-validation"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import asyncio
      import json
      import re
      import sys
      from pathlib import Path

      env_check = json.loads('''{{env_check}}''')
      discovery = json.loads('''{{discovery_results}}''')

      results = {
          "phase": "standalone_completeness",
          "bundles_checked": 0,
          "errors": [],
          "warnings": [],
          "bundle_details": []
      }

      standalone_bundles = discovery.get("bundles_found", {}).get("standalone", [])

      if not standalone_bundles:
          results["skipped"] = True
          results["passed"] = True
          results["reason"] = "No bundles in /bundles/ directory"
          print(json.dumps(results))
          sys.exit(0)

      # v3.2.0: Check foundation from capabilities dict
      foundation_available = env_check.get("capabilities", {}).get("foundation_available", False)
      
      if not foundation_available:
          # v3.2.0: Fallback mode - basic YAML parsing without includes resolution
          results["environment_limitation"] = True
          results["info"] = results.get("info", [])
          results["info"].append({
              "type": "limited_validation",
              "message": "Foundation not available - includes chain not fully traced",
              "severity": "INFO"
          })
          
          for bundle_path in standalone_bundles:
              results["bundles_checked"] += 1
              path = Path(bundle_path)
              bundle_name = path.stem if path.name not in ["bundle.md", "bundle.yaml"] else path.parent.name
              
              detail = {
                  "path": bundle_path,
                  "name": bundle_name,
                  "has_orchestrator": False,
                  "has_context": False,
                  "has_includes": False,
                  "completeness": "unknown"
              }
              
              try:
                  content = path.read_text()
                  
                  # Check for session config
                  detail["has_orchestrator"] = bool(re.search(r'orchestrator:', content))
                  detail["has_context"] = bool(re.search(r'context:', content))
                  detail["has_includes"] = bool(re.search(r'^includes:', content, re.MULTILINE))
                  
                  if detail["has_orchestrator"] and detail["has_context"]:
                      detail["completeness"] = "direct"
                  elif detail["has_includes"]:
                      detail["completeness"] = "via_includes_unverified"
                      results["warnings"].append({
                          "bundle": bundle_name,
                          "type": "includes_not_traced",
                          "message": "Bundle has includes but cannot verify completeness without foundation"
                      })
                  else:
                      detail["completeness"] = "incomplete"
                      results["errors"].append({
                          "bundle": bundle_name,
                          "type": "missing_session_config",
                          "message": "Standalone bundle missing orchestrator/context and has no includes",
                          "severity": "ERROR",
                          "fix": "Add session.orchestrator and session.context, or include a bundle that provides them"
                      })
              except Exception as e:
                  detail["error"] = str(e)
                  results["warnings"].append({
                      "bundle": bundle_name,
                      "type": "read_error",
                      "message": f"Could not read bundle: {e}"
                  })
              
              results["bundle_details"].append(detail)
          
          results["passed"] = len(results["errors"]) == 0
          print(json.dumps(results))
          sys.exit(0)

      # Full validation with foundation available
      from amplifier_foundation import BundleRegistry

      def _sess(s, k):
          # Bundle.session is dict[str, Any]; handle dict and object forms.
          # (getattr on a dict never resolves keys, which flagged every
          # standalone bundle as missing orchestrator/context.)
          return (s.get(k) if isinstance(s, dict) else getattr(s, k, None)) if s else None

      async def check_completeness():
          for bundle_path in standalone_bundles:
              results["bundles_checked"] += 1
              path = Path(bundle_path).resolve()
              bundle_name = path.stem if path.name not in ["bundle.md", "bundle.yaml"] else path.parent.name
              
              detail = {
                  "path": bundle_path,
                  "name": bundle_name,
                  "has_orchestrator": False,
                  "has_context": False,
                  "via_includes": False,
                  "completeness": "unknown"
              }

              try:
                  registry = BundleRegistry()
                  uri = f"file://{path}"
                  
                  # Load with includes followed
                  bundle = await registry._load_single(
                      uri,
                      auto_register=True,
                      auto_include=True  # Follow includes
                  )
                  
                  # Check composed session config
                  session = getattr(bundle, 'session', None)
                  if session:
                      detail["has_orchestrator"] = bool(_sess(session, 'orchestrator'))
                      detail["has_context"] = bool(_sess(session, 'context'))
                  
                  # Check if bundle itself has orchestrator or got it via includes
                  content = path.read_text()
                  direct_orchestrator = bool(re.search(r'orchestrator:', content))
                  detail["via_includes"] = detail["has_orchestrator"] and not direct_orchestrator
                  
                  if detail["has_orchestrator"] and detail["has_context"]:
                      detail["completeness"] = "complete"
                  elif detail["has_orchestrator"]:
                      detail["completeness"] = "partial_missing_context"
                      results["errors"].append({
                          "bundle": bundle_name,
                          "type": "missing_context_module",
                          "message": "Standalone bundle has orchestrator but missing context module",
                          "severity": "ERROR",
                          "fix": "Add session.context or include a bundle that provides it"
                      })
                  elif detail["has_context"]:
                      detail["completeness"] = "partial_missing_orchestrator"
                      results["errors"].append({
                          "bundle": bundle_name,
                          "type": "missing_orchestrator",
                          "message": "Standalone bundle has context but missing orchestrator",
                          "severity": "ERROR",
                          "fix": "Add session.orchestrator or include a bundle that provides it"
                      })
                  else:
                      detail["completeness"] = "incomplete"
                      results["errors"].append({
                          "bundle": bundle_name,
                          "type": "missing_session_config",
                          "message": "Standalone bundle missing both orchestrator and context",
                          "severity": "ERROR",
                          "fix": "Add session configuration or include foundation/another complete bundle"
                      })
                  
                  # Note about provider (WARNING, not ERROR - intentional flexibility)
                  providers = getattr(bundle, 'providers', [])
                  if not providers:
                      results["warnings"].append({
                          "bundle": bundle_name,
                          "type": "no_provider",
                          "message": "Standalone bundle has no provider (may be intentional for flexibility)",
                          "severity": "INFO"
                      })
                      detail["has_provider"] = False
                  else:
                      detail["has_provider"] = True

              except Exception as e:
                  detail["error"] = str(e)
                  detail["completeness"] = "error"
                  results["errors"].append({
                      "bundle": bundle_name,
                      "type": "load_error",
                      "message": f"Could not load bundle: {e}",
                      "severity": "ERROR"
                  })
              
              results["bundle_details"].append(detail)

          results["passed"] = len(results["errors"]) == 0
          results["summary"] = {
              "bundles_checked": results["bundles_checked"],
              "complete": len([d for d in results["bundle_details"] if d.get("completeness") == "complete"]),
              "incomplete": len([d for d in results["bundle_details"] if d.get("completeness") in ["incomplete", "partial_missing_context", "partial_missing_orchestrator"]]),
              "errors": len(results["errors"]),
              "warnings": len(results["warnings"])
          }
          print(json.dumps(results))

      asyncio.run(check_completeness())
      EOF
    output: "standalone_completeness_results"
    parse_json: true
    timeout: 180
    on_error: "continue"
    depends_on: ["validate-all-bundles"]

  # ============================================================================
  # PHASE 2.3: Experiments Validation (NEW in v3.0.0)
  # Validates bundles in /experiments/:
  # - Name should be exp-* prefixed (WARNING)
  # - Description should include "EXPERIMENTAL" (WARNING)
  # - Must be complete (same as standalone) (ERROR)
  # ============================================================================

  - id: "experiments-validation"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import asyncio
      import json
      import re
      import sys
      from pathlib import Path

      env_check = json.loads('''{{env_check}}''')
      discovery = json.loads('''{{discovery_results}}''')

      results = {
          "phase": "experiments_validation",
          "experiments_checked": 0,
          "errors": [],
          "warnings": [],
          "experiment_details": []
      }

      experiment_bundles = discovery.get("bundles_found", {}).get("experiments", [])

      if not experiment_bundles:
          results["skipped"] = True
          results["passed"] = True
          results["reason"] = "No bundles in /experiments/ directory"
          print(json.dumps(results))
          sys.exit(0)

      for bundle_path in experiment_bundles:
          results["experiments_checked"] += 1
          path = Path(bundle_path)
          bundle_name = path.stem if path.name not in ["bundle.md", "bundle.yaml"] else path.parent.name
          
          detail = {
              "path": bundle_path,
              "name": bundle_name,
              "issues": []
          }
          
          try:
              content = path.read_text()
              
              # Rule 1: Name should be exp-* prefixed (WARNING)
              if not bundle_name.startswith("exp-"):
                  results["warnings"].append({
                      "experiment": bundle_name,
                      "type": "naming_convention",
                      "message": f"Experiment bundle '{bundle_name}' should be prefixed with 'exp-'",
                      "severity": "WARNING",
                      "fix": f"Rename to 'exp-{bundle_name}'"
                  })
                  detail["issues"].append("naming_convention")
              
              # Rule 2: Description should mention EXPERIMENTAL (WARNING)
              # Check for description field
              desc_match = re.search(r'description:\s*[|>]?\s*\n?\s*(.+?)(?=\n[a-z]|\n---|\Z)', content, re.IGNORECASE | re.DOTALL)
              if desc_match:
                  description = desc_match.group(1)
                  if "EXPERIMENTAL" not in description.upper():
                      results["warnings"].append({
                          "experiment": bundle_name,
                          "type": "missing_experimental_warning",
                          "message": "Experiment bundle description should include 'EXPERIMENTAL' warning",
                          "severity": "WARNING",
                          "fix": "Add 'EXPERIMENTAL' to the description to warn users"
                      })
                      detail["issues"].append("missing_experimental_warning")
                  detail["has_experimental_warning"] = "EXPERIMENTAL" in description.upper()
              else:
                  results["warnings"].append({
                      "experiment": bundle_name,
                      "type": "missing_description",
                      "message": "Experiment bundle has no description",
                      "severity": "WARNING"
                  })
                  detail["issues"].append("missing_description")
              
              # Rule 3: Must be complete (has orchestrator + context or includes)
              has_orchestrator = bool(re.search(r'orchestrator:', content))
              has_context = bool(re.search(r'^\s+context:', content, re.MULTILINE))
              has_includes = bool(re.search(r'^includes:', content, re.MULTILINE))
              
              detail["has_orchestrator"] = has_orchestrator
              detail["has_context"] = has_context
              detail["has_includes"] = has_includes
              
              if has_orchestrator and has_context:
                  detail["completeness"] = "direct"
              elif has_includes:
                  detail["completeness"] = "via_includes"
              else:
                  detail["completeness"] = "incomplete"
                  results["errors"].append({
                      "experiment": bundle_name,
                      "type": "incomplete_experiment",
                      "message": "Experiment bundle is not complete (missing session config and no includes)",
                      "severity": "ERROR",
                      "fix": "Add session.orchestrator and session.context, or include a complete bundle"
                  })
                  detail["issues"].append("incomplete_experiment")
              
          except Exception as e:
              detail["error"] = str(e)
              results["warnings"].append({
                  "experiment": bundle_name,
                  "type": "read_error",
                  "message": f"Could not read experiment bundle: {e}"
              })
          
          results["experiment_details"].append(detail)

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "experiments_checked": results["experiments_checked"],
          "complete": len([d for d in results["experiment_details"] if d.get("completeness") in ["direct", "via_includes"]]),
          "incomplete": len([d for d in results["experiment_details"] if d.get("completeness") == "incomplete"]),
          "naming_issues": len([d for d in results["experiment_details"] if "naming_convention" in d.get("issues", [])]),
          "errors": len(results["errors"]),
          "warnings": len(results["warnings"])
      }

      print(json.dumps(results))
      EOF
    output: "experiments_validation_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["validate-all-bundles"]

  # ============================================================================
  # PHASE 2.4: Context Sink Compliance (NEW in v3.0.0)
  # Validates root bundles follow context sink pattern:
  # - >5 context.include files in root → WARNING
  # - Any file >2000 tokens in root context → INFO (candidate for agent)
  # - Root owns >50% of total context tokens → INFO
  # ============================================================================

  - id: "context-sink-compliance"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      import sys
      from pathlib import Path

      def estimate_tokens(content: str) -> int:
          """Estimate token count as len(content) // 4."""
          return len(content) // 4

      discovery = json.loads('''{{discovery_results}}''')

      results = {
          "phase": "context_sink_compliance",
          "root_bundles_checked": 0,
          "errors": [],
          "warnings": [],
          "info": [],
          "root_details": []
      }

      root_bundles = discovery.get("bundles_found", {}).get("root", [])

      if not root_bundles:
          results["skipped"] = True
          results["passed"] = True
          results["reason"] = "No root bundle found"
          print(json.dumps(results))
          sys.exit(0)

      repo_path = Path(discovery.get("repo_path", ".")).resolve()

      for bundle_path in root_bundles:
          results["root_bundles_checked"] += 1
          path = Path(bundle_path)
          
          detail = {
              "path": bundle_path,
              "context_files": [],
              "total_context_tokens": 0,
              "issues": []
          }

          try:
              content = path.read_text()
              
              # Parse context.include section
              # Handle both YAML and MD formats
              if path.suffix == '.md':
                  # Extract YAML frontmatter
                  match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
                  if match:
                      yaml_content = match.group(1)
                  else:
                      yaml_content = ""
              else:
                  yaml_content = content
              
              # Find context.include entries
              context_match = re.search(r'context:\s*\n((?:\s+.*\n)*)', yaml_content)
              if context_match:
                  context_section = context_match.group(1)
                  include_match = re.search(r'include:\s*\n((?:\s+-.*\n)*)', context_section)
                  if include_match:
                      include_lines = include_match.group(1)
                      includes = re.findall(r'-\s*(.+)', include_lines)
                      
                      for include_ref in includes:
                          include_ref = include_ref.strip().strip('"').strip("'")
                          file_info = {
                              "reference": include_ref,
                              "resolved": False,
                              "tokens": 0
                          }
                          
                          # Try to resolve and read the file
                          if include_ref.startswith("@"):
                              # Bundle reference - estimate
                              file_info["tokens"] = 500
                              file_info["note"] = "Bundle reference - estimated"
                          else:
                              # Try relative paths
                              include_path = path.parent / include_ref
                              if not include_path.exists():
                                  include_path = repo_path / include_ref
                              
                              if include_path.exists():
                                  try:
                                      file_content = include_path.read_text()
                                      file_info["tokens"] = estimate_tokens(file_content)
                                      file_info["resolved"] = True
                                      file_info["resolved_path"] = str(include_path)
                                  except Exception as e:
                                      file_info["error"] = str(e)
                                      file_info["tokens"] = 500
                              else:
                                  file_info["note"] = "Could not resolve path"
                                  file_info["tokens"] = 500
                          
                          detail["context_files"].append(file_info)
                          detail["total_context_tokens"] += file_info["tokens"]
                          
                          # Check for large individual files (>2000 tokens)
                          if file_info["tokens"] > 2000:
                              results["info"].append({
                                  "root_bundle": path.name,
                                  "type": "large_context_file",
                                  "file": include_ref,
                                  "tokens": file_info["tokens"],
                                  "message": f"Context file '{include_ref}' has ~{file_info['tokens']} tokens - consider moving to agent",
                                  "severity": "INFO"
                              })
                              detail["issues"].append(f"large_file:{include_ref}")
                      
                      # Check total include count (>5 → WARNING)
                      if len(includes) > 5:
                          results["warnings"].append({
                              "root_bundle": path.name,
                              "type": "too_many_context_includes",
                              "count": len(includes),
                              "message": f"Root bundle has {len(includes)} context.include files (>5 threshold)",
                              "severity": "WARNING",
                              "fix": "Move specialized context to agents (context sink pattern)"
                          })
                          detail["issues"].append("too_many_context_includes")

              # Calculate total repo context tokens for ratio check
              total_repo_tokens = discovery.get("summary", {}).get("total_tokens", 0)
              if total_repo_tokens > 0 and detail["total_context_tokens"] > 0:
                  root_ratio = detail["total_context_tokens"] / total_repo_tokens
                  detail["root_context_ratio"] = round(root_ratio, 2)
                  
                  if root_ratio > 0.5:
                      results["info"].append({
                          "root_bundle": path.name,
                          "type": "high_root_context_ratio",
                          "ratio": round(root_ratio * 100),
                          "message": f"Root bundle owns {round(root_ratio * 100)}% of total context tokens",
                          "severity": "INFO",
                          "suggestion": "Consider distributing context to behaviors and agents"
                      })
                      detail["issues"].append("high_root_context_ratio")

          except Exception as e:
              detail["error"] = str(e)
              results["warnings"].append({
                  "root_bundle": path.name,
                  "type": "read_error",
                  "message": f"Could not analyze root bundle: {e}"
              })
          
          results["root_details"].append(detail)

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "root_bundles_checked": results["root_bundles_checked"],
          "warnings": len(results["warnings"]),
          "info": len(results["info"]),
          "total_root_context_tokens": sum(d.get("total_context_tokens", 0) for d in results["root_details"])
      }

      print(json.dumps(results))
      EOF
    output: "context_sink_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["validate-all-bundles"]

  # ============================================================================
  # PHASE 2.5: Tool Placement Analysis (Enhanced in v3.1.0)
  # Inheritance-aware tool placement analysis:
  # - Agents inherit ALL parent tools EXCEPT those in delegate's exclude_tools
  # - Default exclude_tools: ["delegate"] - only delegate is excluded by default
  # - If tool is in parent AND NOT excluded → agent declaration is REDUNDANT
  # - If tool is in parent AND excluded → agent declaration is CORRECT
  # - Universal tools (filesystem, bash, web, search, todo) → OK in root
  # - Specialized tools used by only one behavior → SUGGESTION to move to behavior
  # ============================================================================

  - id: "tool-placement-analysis"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      import sys
      from pathlib import Path

      discovery = json.loads('''{{discovery_results}}''')
      individual = json.loads('''{{individual_validation}}''')

      results = {
          "phase": "tool_placement_analysis",
          "tools_analyzed": 0,
          "errors": [],
          "warnings": [],
          "suggestions": [],
          "tool_inventory": [],
          "inheritance_analysis": {
              "exclude_tools": ["delegate"],  # Default
              "exclude_tools_source": "default",
              "agent_tool_analysis": []
          }
      }

      # Universal tools that are always OK in root
      UNIVERSAL_TOOLS = {
          "tool-filesystem", "filesystem",
          "tool-bash", "bash",
          "tool-web", "web",
          "tool-search", "search", "tool-grep", "grep", "tool-glob", "glob",
          "tool-todo", "todo",
          "tool-delegate", "delegate",
          "tool-recipes", "recipes",
          "tool-lsp", "lsp"
      }

      repo_path = Path(discovery.get("repo_path", ".")).resolve()

      # Collect all tools from all bundles and track agents
      tool_locations = {}  # tool_name -> [{"bundle": ..., "category": ..., "in_agent": ...}, ...]
      bundle_tools = {}    # bundle_path -> [tool_names]
      agent_tools = {}     # "bundle_path:agent_name" -> [tool_names]
      exclude_tools = ["delegate"]  # Default per foundation-expert
      
      all_bundles = []
      for category, paths in discovery.get("bundles_found", {}).items():
          for path in paths:
              all_bundles.append((path, category))

      def parse_yaml_section(content: str, section: str) -> str:
          """Extract a YAML section from content."""
          # Handle markdown with frontmatter
          if content.strip().startswith('---'):
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if match:
                  content = match.group(1)
          
          pattern = rf'^{section}:\s*\n((?:\s+.*\n)*)'
          match = re.search(pattern, content, re.MULTILINE)
          return match.group(1) if match else ""

      def extract_tool_modules(tools_section: str) -> list:
          """Extract tool module names from a tools section."""
          return re.findall(r'module:\s*([^\s\n]+)', tools_section)

      def extract_delegate_config(tools_section: str) -> dict:
          """Extract delegate tool config including exclude_tools."""
          config = {}
          # Look for tool-delegate section
          delegate_match = re.search(
              r'-\s*module:\s*tool-delegate.*?(?=\n\s*-\s*module:|\Z)',
              tools_section,
              re.DOTALL
          )
          if delegate_match:
              delegate_section = delegate_match.group(0)
              # Look for exclude_tools in config
              exclude_match = re.search(
                  r'exclude_tools:\s*\n((?:\s+-\s*.*\n)*)',
                  delegate_section
              )
              if exclude_match:
                  excludes = re.findall(r'-\s*([^\s\n]+)', exclude_match.group(1))
                  config["exclude_tools"] = excludes
          return config

      # First pass: collect bundle-level tools and find delegate config
      for bundle_path, category in all_bundles:
          path = Path(bundle_path)
          try:
              content = path.read_text()
              
              # Find tools section at bundle level
              tools_section = parse_yaml_section(content, "tools")
              if tools_section:
                  tool_modules = extract_tool_modules(tools_section)
                  bundle_tools[str(path)] = tool_modules
                  
                  for tool_name in tool_modules:
                      results["tools_analyzed"] += 1
                      
                      if tool_name not in tool_locations:
                          tool_locations[tool_name] = []
                      
                      tool_locations[tool_name].append({
                          "bundle": str(path),
                          "bundle_name": path.stem if path.name not in ["bundle.md", "bundle.yaml"] else path.parent.name,
                          "category": category,
                          "in_agent": None
                      })
                  
                  # Check for delegate tool config
                  if category in ["root", "behaviors"]:
                      delegate_config = extract_delegate_config(tools_section)
                      if "exclude_tools" in delegate_config:
                          exclude_tools = delegate_config["exclude_tools"]
                          results["inheritance_analysis"]["exclude_tools"] = exclude_tools
                          results["inheritance_analysis"]["exclude_tools_source"] = str(path)
              
              # Find agents section and their tools
              agents_section = parse_yaml_section(content, "agents")
              if agents_section:
                  # Split by agent entries
                  agent_entries = re.split(r'\n\s*-\s*(?=name:|id:)', agents_section)
                  for agent_entry in agent_entries:
                      if not agent_entry.strip():
                          continue
                      
                      # Get agent name
                      name_match = re.search(r'(?:name|id):\s*([^\s\n]+)', agent_entry)
                      if not name_match:
                          continue
                      agent_name = name_match.group(1).strip('"\'')
                      
                      # Get agent tools
                      agent_tools_match = re.search(r'tools:\s*\n((?:\s+.*\n)*)', agent_entry)
                      if agent_tools_match:
                          agent_tool_modules = extract_tool_modules(agent_tools_match.group(1))
                          agent_key = f"{path}:{agent_name}"
                          agent_tools[agent_key] = {
                              "tools": agent_tool_modules,
                              "bundle_path": str(path),
                              "bundle_category": category
                          }
                          
                          for tool_name in agent_tool_modules:
                              results["tools_analyzed"] += 1
                              
                              if tool_name not in tool_locations:
                                  tool_locations[tool_name] = []
                              
                              tool_locations[tool_name].append({
                                  "bundle": str(path),
                                  "bundle_name": path.stem if path.name not in ["bundle.md", "bundle.yaml"] else path.parent.name,
                                  "category": category,
                                  "in_agent": agent_name
                              })
                      
          except Exception as e:
              results["warnings"].append({
                  "bundle": str(path),
                  "type": "parse_error",
                  "message": f"Could not parse bundle for tools: {e}"
              })

      # Second pass: Analyze agent tool inheritance
      for agent_key, agent_info in agent_tools.items():
          bundle_path = agent_info["bundle_path"]
          agent_name = agent_key.split(":")[-1]
          agent_tool_list = agent_info["tools"]
          
          # Get parent bundle tools
          parent_tools = bundle_tools.get(bundle_path, [])
          
          # Also check root bundle tools if this is a behavior
          root_tools = []
          for root_path in discovery.get("bundles_found", {}).get("root", []):
              root_tools.extend(bundle_tools.get(root_path, []))
          
          # Combined parent tools (what agent inherits from)
          all_parent_tools = set(parent_tools) | set(root_tools)
          
          agent_analysis = {
              "agent": agent_name,
              "bundle": bundle_path,
              "declared_tools": agent_tool_list,
              "inherited_tools": list(all_parent_tools - set(exclude_tools)),
              "excluded_tools": exclude_tools,
              "redundant_declarations": [],
              "correct_explicit_declarations": []
          }
          
          for tool in agent_tool_list:
              if tool in all_parent_tools:
                  if tool in exclude_tools:
                      # Tool is excluded from inheritance - agent MUST declare it explicitly
                      agent_analysis["correct_explicit_declarations"].append(tool)
                  else:
                      # Tool is inherited - agent declaration is REDUNDANT
                      agent_analysis["redundant_declarations"].append(tool)
                      results["suggestions"].append({
                          "tool": tool,
                          "agent": agent_name,
                          "bundle": bundle_path,
                          "type": "redundant_agent_tool",
                          "message": f"Tool '{tool}' in agent '{agent_name}' is redundant - inherited from parent bundle",
                          "severity": "SUGGESTION",
                          "suggestion": f"Remove '{tool}' from agent tools list. It's inherited automatically (not in exclude_tools: {exclude_tools})"
                      })
          
          results["inheritance_analysis"]["agent_tool_analysis"].append(agent_analysis)

      # Analyze tool placement at bundle level
      for tool_name, locations in tool_locations.items():
          # Filter to bundle-level only (not in agents)
          bundle_locations = [loc for loc in locations if loc["in_agent"] is None]
          
          tool_info = {
              "name": tool_name,
              "is_universal": any(u in tool_name.lower() for u in UNIVERSAL_TOOLS),
              "locations": locations,
              "bundle_locations": bundle_locations,
              "location_count": len(locations),
              "bundle_location_count": len(bundle_locations),
              "in_root": any(loc["category"] == "root" and loc["in_agent"] is None for loc in locations),
              "in_behaviors": any(loc["category"] == "behaviors" and loc["in_agent"] is None for loc in locations),
              "in_agents": any(loc["in_agent"] is not None for loc in locations),
              "issues": []
          }
          
          # Check for non-universal tools in root that are only used by specific behaviors
          if tool_info["in_root"] and not tool_info["is_universal"]:
              behavior_users = [loc for loc in bundle_locations if loc["category"] == "behaviors"]
              if len(behavior_users) == 1:
                  results["suggestions"].append({
                      "tool": tool_name,
                      "type": "specialized_tool_in_root",
                      "message": f"Tool '{tool_name}' is in root but only used by behavior '{behavior_users[0]['bundle_name']}'",
                      "severity": "INFO",
                      "suggestion": "Consider moving to the specific behavior that uses it"
                  })
                  tool_info["issues"].append("specialized_in_root")
          
          # Note: We no longer flag root+behavior declarations as redundant without
          # understanding the full include chain. Behaviors may be used standalone.
          
          results["tool_inventory"].append(tool_info)

      # Summary statistics
      universal_count = len([t for t in results["tool_inventory"] if t["is_universal"]])
      specialized_count = len(results["tool_inventory"]) - universal_count
      redundant_agent_tools = sum(
          len(a.get("redundant_declarations", [])) 
          for a in results["inheritance_analysis"]["agent_tool_analysis"]
      )

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "tools_analyzed": results["tools_analyzed"],
          "unique_tools": len(results["tool_inventory"]),
          "universal_tools": universal_count,
          "specialized_tools": specialized_count,
          "suggestions": len(results["suggestions"]),
          "warnings": len(results["warnings"]),
          "redundant_agent_tools": redundant_agent_tools,
          "exclude_tools_config": results["inheritance_analysis"]["exclude_tools"]
      }

      print(json.dumps(results))
      EOF
    output: "tool_placement_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["validate-all-bundles"]

  # ============================================================================
  # PHASE 2.6.0: Recipe Validation (Opt-In via validate_recipes or validate_all)
  # Runs validate-recipes.yaml as a sub-recipe when requested
  # ============================================================================

  - id: "validate-recipes"
    type: "recipe"
    recipe: "@recipes:recipes/validate-recipes.yaml"
    condition: "{{validation_flags.validate_recipes}} == 'true'"
    context:
      repo_path: "{{repo_path}}"
      recipes_dir: "{{recipes_dir}}"
      known_agents: "{{known_agents}}"
    output: "recipe_validation"
    timeout: 600
    on_error: "continue"
    depends_on: ["repo-discovery", "validate-all-flags"]

  - id: "set-default-recipe-validation"
    type: "bash"
    condition: "{{validation_flags.validate_recipes}} != 'true'"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json

      result = {
          "quality_level": "good",
          "summary": "Recipe validation not performed",
          "recipes_validated": 0,
          "skipped": True
      }

      print(json.dumps(result))
      EOF
    output: "recipe_validation"
    parse_json: true
    timeout: 10
    on_error: "fail"
    depends_on: ["validate-all-flags"]

  # ============================================================================
  # PHASE 2.7: Mode Authoring Discipline Validation (NEW in v3.6.0)
  # Walks all modes/*.md files in the repo and applies two checks:
  #
  # Check A — Description token budget
  #   For each mode file's YAML frontmatter description: field:
  #   WARNING >500 tokens  (mode_description_high)
  #   ERROR   >800 tokens  (mode_description_excessive)
  #   Token estimate: len(description) // 4
  #   Analogous to behavior context.include thresholds in Phase 2.1.
  #
  # Check B — Advertising rule (mode-design-discipline §4)
  #   For each mode with advertised: false in frontmatter:
  #   Scan all agent-readable .md files in context/, agents/, behaviors/,
  #   skills/, modes/ (excluding the mode's own file) for mentions of the
  #   mode name via patterns: /<mode-name> and name="<mode-name>"/name='<mode-name>'
  #   ERROR: unadvertised_but_referenced
  # ============================================================================

  - id: "mode-validation"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      import sys
      from pathlib import Path

      repo_path = "{{repo_path}}"
      path = Path(repo_path).resolve()

      results = {
          "phase": "mode_validation",
          "modes_checked": 0,
          "errors": [],
          "warnings": [],
          "mode_details": []
      }

      # Find all modes/*.md files anywhere in the repo
      mode_files = list(path.rglob("*/modes/*.md")) + list(path.glob("modes/*.md"))
      # Deduplicate (rglob already covers top-level if depth allows, but be safe)
      seen = set()
      unique_mode_files = []
      for mf in mode_files:
          resolved = mf.resolve()
          if resolved not in seen:
              seen.add(resolved)
              unique_mode_files.append(mf)

      if not unique_mode_files:
          results["skipped"] = True
          results["passed"] = True
          results["reason"] = "No modes/*.md files found"
          print(json.dumps(results))
          sys.exit(0)

      # ── YAML parser (with graceful fallback) ───────────────────────────────
      try:
          import yaml as _yaml
          def parse_yaml(text):
              return _yaml.safe_load(text) or {}
      except ImportError:
          def parse_yaml(text):
              # Minimal regex fallback — sufficient for description/advertised/mode.name
              result = {}
              # description: single-line or first line of block scalar
              m = re.search(r'^description:\s*["\']?(.+?)["\']?\s*$', text, re.MULTILINE)
              if m:
                  result["description"] = m.group(1).strip()
              # advertised: true/false
              m2 = re.search(r'^advertised:\s*(true|false)', text, re.MULTILINE | re.IGNORECASE)
              if m2:
                  result["advertised"] = m2.group(1).lower() == "true"
              # mode.name under a mode: block
              m3 = re.search(r'^mode:\s*\n\s+name:\s*["\']?(.+?)["\']?\s*$', text, re.MULTILINE)
              if m3:
                  result["mode"] = {"name": m3.group(1).strip()}
              return result

      def extract_frontmatter(file_path):
          """Return (parsed_yaml_dict, raw_file_content)."""
          try:
              content = file_path.read_text(encoding="utf-8", errors="replace")
              match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
              if match:
                  return parse_yaml(match.group(1)), content
              return {}, content
          except Exception:
              return {}, ""

      def estimate_tokens(s):
          return len(s) // 4 if isinstance(s, str) else 0

      # Directories to scan for unadvertised-mode references
      SCAN_DIRS = ["context", "agents", "behaviors", "skills", "modes"]

      def collect_mode_internal_files(mode_file_path):
          """Return resolved paths the mode body @-mentions directly.

          These files are 'mode-internal' lazy context — the LLM sees them
          only when the mode is already active. References to the mode within
          them are self-references, not dead-end invocations from out-of-mode
          context, so the advertising-rule check skips them.

          Template placeholders like @bundle:context/<filename> are ignored
          (they do not resolve to an actual file).
          """
          internal = set()
          try:
              content = mode_file_path.read_text(encoding="utf-8", errors="replace")
          except Exception:
              return internal
          # Strip frontmatter; only look at the body where @-mentions live
          body_match = re.search(r'^---\s*\n.*?\n---\s*\n(.*)', content, re.DOTALL)
          body = body_match.group(1) if body_match else content
          # Match @namespace:path/to/file.md — kebab/snake names, dots/dashes/slashes in path
          for m in re.finditer(r'@[\w-]+:([\w/.\-]+\.md)', body):
              rel = m.group(1)
              candidate = path / rel
              if candidate.exists():
                  internal.add(candidate.resolve())
          return internal

      def scan_for_mode_mentions(mode_name, own_file_path, mode_internal_files):
          """Return list of relative paths where mode_name is mentioned as a
          slash-command invocation or by name= attribute.

          Skips:
          - The mode's own file
          - Files in mode_internal_files (lazy-loaded by this mode — references
            to mode_name within them are self-references, not dead-end invocations)

          The slash regex requires word/slash boundaries to avoid false positives
          from URL paths (https://.../langsmith/evaluation) and file paths
          (modes/evaluation.md, /evaluations/ as a directory segment).
          """
          mentions = []
          # /mode-name must NOT be preceded by an alphanumeric char or slash
          # (that would make it a path component, not a slash command), and
          # must NOT be followed by an alphanumeric char, dot, or slash
          # (which would make it part of a larger word or path).
          slash_pat = re.compile(
              r'(?<![\w/])`?/' + re.escape(mode_name) + r'`?(?![\w./])'
          )
          name_pat  = re.compile(r'name=["\']' + re.escape(mode_name) + r'["\']')
          own_resolved = Path(own_file_path).resolve()
          for dir_name in SCAN_DIRS:
              scan_dir = path / dir_name
              if not scan_dir.exists():
                  continue
              for md_file in scan_dir.rglob("*.md"):
                  resolved = md_file.resolve()
                  if resolved == own_resolved:
                      continue  # skip the mode's own file
                  if resolved in mode_internal_files:
                      continue  # mode-internal — LLM already in mode when it reads this
                  try:
                      file_content = md_file.read_text(encoding="utf-8", errors="replace")
                      if slash_pat.search(file_content) or name_pat.search(file_content):
                          mentions.append(str(md_file.relative_to(path)))
                  except Exception:
                      continue
          return mentions

      # ── Walk mode files ────────────────────────────────────────────────────
      for mode_file in sorted(unique_mode_files):
          fm, _ = extract_frontmatter(mode_file)

          # Skip if no mode: block — probably unrelated markdown
          if "mode" not in fm:
              continue

          mode_section = fm.get("mode", {})
          if not isinstance(mode_section, dict):
              continue

          mode_name = str(mode_section.get("name", "")).strip()
          if not mode_name:
              continue

          rel_path = str(mode_file.relative_to(path))
          results["modes_checked"] += 1
          detail = {
              "mode": mode_name,
              "file": rel_path,
              "issues": []
          }

          # ── Check A: Description token budget ────────────────────────────
          # NOTE: description lives under the `mode:` block per the schema; not at frontmatter top level.
          description = mode_section.get("description", "")
          # Handle YAML block scalars that parse as None or non-string
          if not isinstance(description, str):
              description = str(description) if description else ""
          token_count = estimate_tokens(description)
          detail["description_tokens"] = token_count

          if token_count > 800:
              results["errors"].append({
                  "type": "mode_description_excessive",
                  "mode": mode_name,
                  "file": rel_path,
                  "tokens": token_count,
                  "severity": "ERROR",
                  "message": (
                      f"Mode '{mode_name}' description is {token_count} tokens "
                      f"(>{800} threshold — must shorten)."
                  ),
                  "fix": (
                      "Shorten the description to <500 tokens. "
                      "See foundation:context/shared/description-authoring-principles.md "
                      "(V5) and modes/.../mode-design-discipline skill."
                  )
              })
              detail["issues"].append("mode_description_excessive")
          elif token_count > 500:
              results["warnings"].append({
                  "type": "mode_description_high",
                  "mode": mode_name,
                  "file": rel_path,
                  "tokens": token_count,
                  "severity": "WARNING",
                  "message": (
                      f"Mode '{mode_name}' description is {token_count} tokens "
                      f"(>500 threshold — consider trimming)."
                  ),
                  "fix": (
                      "Trim description toward <500 tokens. "
                      "See foundation:context/shared/description-authoring-principles.md "
                      "(V5) and modes/.../mode-design-discipline skill."
                  )
              })
              detail["issues"].append("mode_description_high")

          # ── Check B: Advertising rule ─────────────────────────────────────
          # NOTE: `advertised` lives under the `mode:` block per the schema; not at frontmatter top level.
          # Default True if key absent (opt-in to non-advertising is explicit).
          advertised = mode_section.get("advertised", True)
          detail["advertised"] = advertised

          if advertised is False:
              mode_internal = collect_mode_internal_files(mode_file)
              mentions = scan_for_mode_mentions(mode_name, mode_file, mode_internal)
              if mentions:
                  results["errors"].append({
                      "type": "unadvertised_but_referenced",
                      "mode": mode_name,
                      "file": rel_path,
                      "references_found_in": mentions,
                      "severity": "ERROR",
                      "message": (
                          f"Mode '{mode_name}' has advertised: false but is referenced "
                          f"by name in: {', '.join(mentions)}"
                      ),
                      "fix": (
                          "Either set 'advertised: true' OR remove the references. "
                          "Per mode-design-discipline \u00a74: agent-readable docs that "
                          "mention a mode by name must have the mode advertised, because "
                          "the LLM will infer the mode exists and attempt to invoke it."
                      )
                  })
                  detail["issues"].append("unadvertised_but_referenced")

          results["mode_details"].append(detail)

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "modes_checked": results["modes_checked"],
          "errors": len(results["errors"]),
          "warnings": len(results["warnings"]),
          "clean_modes": results["modes_checked"] - len(
              set(e["mode"] for e in results["errors"])
          )
      }

      print(json.dumps(results))
      EOF
    output: "mode_validation_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2.8: Agent Description Budget Validation
  #
  # Walks all agents/*.md files in the repo and applies the same description
  # budget + example/commentary checks validate-agents.yaml enforces, so a
  # bundle-repo-wide scan catches agent description bloat even when
  # validate-agents.yaml is not run separately.
  #
  # Check A -- Description token budget (PROVISIONAL, see foundation:context/
  # shared/description-authoring-principles.md V5)
  #   For each agent file's meta.description:
  #   WARNING >300 tokens  (agent_description_high)
  #   ERROR   >600 tokens  (agent_description_excessive)
  #   Token estimate: len(description) // 4 -- same formula as Phase 2.7
  #   Check A (mode descriptions), applied at the tighter agent-tier ceiling
  #   because agent descriptions are paid by every session with the agent
  #   in its catalog, not only sessions that use it.
  #
  # Check B -- <example>/<commentary> detection (description-authoring-
  # principles.md V3)
  #   WARNING: any <commentary> tag present (commentary_present)
  #   WARNING: more than 2 <example> blocks (too_many_examples)
  # ============================================================================

  - id: "agent-description-validation"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      from pathlib import Path

      repo_path = "{{repo_path}}"
      path = Path(repo_path).resolve()

      results = {
          "phase": "agent_description_validation",
          "agents_checked": 0,
          "errors": [],
          "warnings": [],
          "agent_details": []
      }

      EXCLUDED_DIRS = {"test-fixtures", "tests", "node_modules", ".git", ".venv"}

      agent_files = list(path.rglob("*/agents/*.md")) + list(path.glob("agents/*.md"))
      seen = set()
      unique_agent_files = []
      for f in agent_files:
          if EXCLUDED_DIRS & set(f.parts):
              continue
          resolved = f.resolve()
          if resolved not in seen:
              seen.add(resolved)
              unique_agent_files.append(f)

      def extract_description(agent_file: Path) -> str:
          try:
              content = agent_file.read_text(encoding="utf-8", errors="replace")
          except Exception:
              return ""
          match = re.match(r'^---\s*\n(.*?)\n---\s*\n', content, re.DOTALL)
          if not match:
              return ""
          try:
              import yaml
              fm = yaml.safe_load(match.group(1))
          except Exception:
              return ""
          if not isinstance(fm, dict):
              return ""
          meta = fm.get("meta", {})
          if not isinstance(meta, dict):
              return ""
          description = meta.get("description", "")
          return description if isinstance(description, str) else str(description or "")

      for agent_file in sorted(unique_agent_files):
          description = extract_description(agent_file)
          rel_path = str(agent_file.relative_to(path))
          results["agents_checked"] += 1
          detail = {"file": rel_path, "issues": []}

          token_count = len(description) // 4
          detail["description_tokens"] = token_count

          if token_count > 600:
              results["errors"].append({
                  "type": "agent_description_excessive",
                  "file": rel_path,
                  "tokens": token_count,
                  "severity": "ERROR",
                  "message": (
                      f"Agent description in {rel_path} is {token_count} tokens "
                      f"(>600 threshold -- must shorten)."
                  ),
                  "fix": (
                      "Shorten the description to <300 tokens. See "
                      "foundation:context/shared/description-authoring-principles.md "
                      "V5 (provisional tier)."
                  )
              })
              detail["issues"].append("agent_description_excessive")
          elif token_count > 300:
              results["warnings"].append({
                  "type": "agent_description_high",
                  "file": rel_path,
                  "tokens": token_count,
                  "severity": "WARNING",
                  "message": (
                      f"Agent description in {rel_path} is {token_count} tokens "
                      f"(>300 threshold -- consider trimming)."
                  ),
                  "fix": (
                      "Trim description toward <300 tokens. See "
                      "foundation:context/shared/description-authoring-principles.md "
                      "V5 (provisional tier)."
                  )
              })
              detail["issues"].append("agent_description_high")

          # v3.10.0: <commentary> presence is now ERROR, not WARNING --
          # consistency with <example> below (commentary only ever occurs
          # inside a now-banned example block).
          commentary_count = description.lower().count("<commentary>") if description else 0
          detail["commentary_count"] = commentary_count
          if commentary_count > 0:
              results["errors"].append({
                  "type": "commentary_present",
                  "file": rel_path,
                  "severity": "ERROR",
                  "message": f"{rel_path}: description has {commentary_count} <commentary> tag(s) -- rejected entirely",
                  "fix": (
                      "Delete <commentary> tags (and the <example> block containing "
                      "them). See description-authoring-principles.md V3."
                  )
              })
              detail["issues"].append("commentary_present")

          # v3.10.0: ANY <example> block is now ERROR (was WARNING at >2).
          # description-authoring-principles.md V3: examples are rejected
          # entirely, not merely capped -- the eval evidence (P2 delegation
          # wave) showed removing ALL examples does not reduce delegation
          # quality.
          example_count = len(re.findall(r'<example>', description, re.IGNORECASE)) if description else 0
          detail["example_count"] = example_count
          if example_count > 0:
              results["errors"].append({
                  "type": "example_block_present",
                  "file": rel_path,
                  "severity": "ERROR",
                  "message": f"{rel_path}: description has {example_count} <example> block(s) -- example blocks are rejected entirely, not merely capped",
                  "fix": (
                      "Delete all <example> blocks. State the trigger condition as "
                      "a decision rule in the WHEN clause instead (V6). See "
                      "description-authoring-principles.md V3."
                  )
              })
              detail["issues"].append("example_block_present")

          results["agent_details"].append(detail)

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "agents_checked": results["agents_checked"],
          "errors": len(results["errors"]),
          "warnings": len(results["warnings"])
      }

      print(json.dumps(results))
      EOF
    output: "agent_description_validation_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2.85: README Install-Instructions Convention Check (v3.10.0)
  #
  # Scans the ROOT README.md for two conventions:
  #
  # Check A -- readme_install_recommendation:
  #   The PRIMARY `amplifier bundle add` command should target a behavior
  #   (`#subdirectory=behaviors/<name>.yaml`), not the bare root bundle --
  #   UNLESS this repo's own purpose is to produce root bundles for users
  #   (uncommon; set context var root_bundle_repo: "true" to suppress).
  #   Every `amplifier bundle add` command should include --app.
  #   Findings: readme_recommends_root_bundle, readme_missing_app_flag
  #   (both severity needs_work).
  #
  # Check B -- tool_install_convention:
  #   `pip install` in README.md instructional text is a needs_work finding
  #   (readme_pip_install) -- should be `uv tool install git+https://...`
  #   for CLI tools, or `uv pip install` for libraries. docs/*.md are
  #   scanned too, but only at INFO level (docs_pip_install). A repo that
  #   ships a CLI ([project.scripts] in pyproject.toml) and shows an
  #   install command but no git+https:// form anywhere is
  #   readme_missing_git_install (needs_work) -- pypi MAY be offered in
  #   addition to git+https, never as a replacement for it.
  #
  # No README, or a README with no `amplifier bundle add` commands at all,
  # is reported at INFO level only -- absence of install docs is not
  # itself the defect this check exists to catch.
  # ============================================================================

  - id: "readme-install-convention-check"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import re
      from pathlib import Path

      repo_path = "{{repo_path}}"
      root_bundle_repo = "{{root_bundle_repo}}".strip().lower() == "true"
      path = Path(repo_path).resolve()

      results = {
          "phase": "readme_install_convention",
          "skipped": False,
          "root_bundle_repo": root_bundle_repo,
          "errors": [],
          "warnings": [],
          "info": []
      }

      readme_path = path / "README.md"
      readme_text = ""
      if not readme_path.exists():
          results["skipped"] = True
          results["info"].append({
              "type": "no_readme",
              "message": "No root README.md found -- install-instructions convention check skipped.",
              "severity": "INFO"
          })
      else:
          try:
              readme_text = readme_path.read_text(encoding="utf-8", errors="replace")
          except Exception as exc:
              results["skipped"] = True
              results["info"].append({
                  "type": "readme_unreadable",
                  "message": f"Could not read README.md: {exc}",
                  "severity": "INFO"
              })

      # `amplifier bundle add <uri> [flags]` -- capture the URI and the rest
      # of the line (where --app would appear).
      bundle_add_pattern = re.compile(
          r'amplifier\s+bundle\s+add\s+["\']?([^\s"\'`]+)["\']?([^\n]*)',
          re.IGNORECASE
      )
      bundle_add_matches = list(bundle_add_pattern.finditer(readme_text)) if readme_text else []

      if readme_text and not bundle_add_matches:
          results["info"].append({
              "type": "no_bundle_add_commands",
              "message": "README.md has no `amplifier bundle add` commands -- nothing to evaluate for the install-recommendation check.",
              "severity": "INFO"
          })
      elif bundle_add_matches:
          first_uri, first_rest = bundle_add_matches[0].group(1), bundle_add_matches[0].group(2)
          recommends_root = (
              "#subdirectory=behaviors/" not in first_uri
              and "#subdirectory=behaviors/" not in first_rest
          )
          if recommends_root and not root_bundle_repo:
              results["warnings"].append({
                  "type": "readme_recommends_root_bundle",
                  "severity": "needs_work",
                  "message": (
                      "README.md's primary `amplifier bundle add` command installs "
                      "the root bundle, not a behavior. Most repos are capability "
                      "providers -- lead with `amplifier bundle add "
                      "\"<repo>#subdirectory=behaviors/<name>.yaml\" --app` instead, "
                      "unless this repo's own purpose IS to produce root bundles for "
                      "users."
                  ),
                  "fix": "Recommend a behaviors/<name>.yaml install as the primary path, or set context var root_bundle_repo: \"true\" if this repo genuinely ships root bundles for users."
              })

          missing_app = [m.group(0) for m in bundle_add_matches if "--app" not in m.group(2)]
          if missing_app:
              results["warnings"].append({
                  "type": "readme_missing_app_flag",
                  "severity": "needs_work",
                  "message": f"{len(missing_app)}/{len(bundle_add_matches)} `amplifier bundle add` command(s) in README.md are missing the --app flag.",
                  "fix": "Add --app to every `amplifier bundle add` command shown in README.md."
              })

      if readme_text:
          pip_install_count = len(re.findall(r'(?<!uv )pip install', readme_text))
          if pip_install_count:
              results["warnings"].append({
                  "type": "readme_pip_install",
                  "severity": "needs_work",
                  "message": f"README.md shows `pip install` {pip_install_count} time(s) in instructional text.",
                  "fix": "Use `uv tool install git+https://...` for CLI tools, or `uv pip install` for libraries, instead of bare `pip install`."
              })

          docs_dir = path / "docs"
          if docs_dir.is_dir():
              doc_pip_hits = []
              for doc_file in sorted(docs_dir.rglob("*.md")):
                  try:
                      doc_text = doc_file.read_text(encoding="utf-8", errors="replace")
                  except Exception:
                      continue
                  if re.search(r'(?<!uv )pip install', doc_text):
                      doc_pip_hits.append(str(doc_file.relative_to(path)))
              if doc_pip_hits:
                  results["info"].append({
                      "type": "docs_pip_install",
                      "message": f"{len(doc_pip_hits)} doc file(s) under docs/ show `pip install`: {', '.join(doc_pip_hits[:10])}",
                      "severity": "INFO"
                  })

          pyproject_path = path / "pyproject.toml"
          ships_cli = False
          if pyproject_path.exists():
              try:
                  ships_cli = "[project.scripts]" in pyproject_path.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  ships_cli = False

          has_install_command = bool(re.search(r'(uv tool install|uv pip install|pip install)', readme_text))
          has_git_install = "git+https://" in readme_text

          if ships_cli and has_install_command and not has_git_install:
              results["warnings"].append({
                  "type": "readme_missing_git_install",
                  "severity": "needs_work",
                  "message": "Repo ships a CLI ([project.scripts] in pyproject.toml) and README.md shows an install command, but no git+https:// form is shown anywhere.",
                  "fix": "Always show a `uv tool install git+https://...` form, even when the package is also on PyPI -- PyPI is an additional convenience form, never a replacement."
              })

      results["passed"] = len(results["errors"]) == 0
      results["summary"] = {
          "bundle_add_commands_found": len(bundle_add_matches),
          "warnings": len(results["warnings"]),
          "errors": len(results["errors"]),
          "info": len(results["info"])
      }

      print(json.dumps(results))
      EOF
    output: "readme_install_convention_results"
    parse_json: true
    timeout: 60
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2.55: Body Instruction Check (v3.7.0)
  # Everything below a bundle.md / agent.md file's YAML frontmatter is loaded
  # verbatim as the session's system instruction. Descriptive/documentation
  # prose there is a defect -- only instruction (or @mention pointers to
  # instruction files) belongs below the frontmatter. WARNING level (not
  # ERROR) -- a large fraction of the current ecosystem trips this check.
  #
  # Scope: bundle.md and agents/*.md. Mode files (modes/*.md) are NOT covered.
  # The mode-validation step above checks a mode's frontmatter description
  # budget and its advertising references -- it does not inspect the body for
  # prose. Extending this check to modes is deliberately left for a follow-up.
  # ============================================================================

  - id: "body-instruction-check"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import sys
      from pathlib import Path

      # amplifier_foundation is not guaranteed to be importable in every
      # environment this recipe runs in. Report a clean skip rather than
      # dying silently into the downstream json.loads fallback.
      # BUG 2ii: catch the real failure and report it. A stale package copy
      # imports fine but is missing the SYMBOL check_body_is_instruction — that
      # raises ImportError too, so the old hard-coded "amplifier_foundation not
      # importable" was misleading. Bind the exception and report it verbatim.
      try:
          from amplifier_foundation.validator import check_body_is_instruction
      except Exception as exc:
          print(json.dumps({
              "phase": "body_instruction_check",
              "skipped": True,
              "passed": True,
              "reason": f"check_body_is_instruction unavailable: {exc}",
              "files_checked": 0,
              "errors": [],
              "warnings": []
          }))
          sys.exit(0)

      repo_path = "{{repo_path}}"
      path = Path(repo_path).resolve()

      results = {
          "phase": "body_instruction_check",
          "files_checked": 0,
          "errors": [],
          "warnings": []
      }

      # Find all bundle.md files (root + nested behaviors/providers/etc.) and
      # agent definition files anywhere in the repo.
      bundle_files = list(path.rglob("bundle.md"))
      agent_files = list(path.rglob("*/agents/*.md")) + list(path.glob("agents/*.md"))

      # Test fixtures are deliberately synthetic -- they exist to exercise the
      # validators and are not shipped instruction. Flagging them is noise.
      EXCLUDED_DIRS = {"test-fixtures", "tests", "node_modules", ".git", ".venv"}

      # Deduplicate (rglob/glob patterns can overlap)
      seen = set()
      unique_files = []
      for f in bundle_files + agent_files:
          if EXCLUDED_DIRS & set(f.parts):
              continue
          resolved = f.resolve()
          if resolved not in seen:
              seen.add(resolved)
              unique_files.append(f)

      if not unique_files:
          results["skipped"] = True
          results["passed"] = True
          results["reason"] = "No bundle.md or agents/*.md files found"
          print(json.dumps(results))
          sys.exit(0)

      for file_path in sorted(unique_files):
          try:
              content = file_path.read_text(encoding="utf-8", errors="replace")
          except Exception:
              continue

          results["files_checked"] += 1
          rel_path = str(file_path.relative_to(path))

          check = check_body_is_instruction(content)
          if check["verdict"] == "FLAG":
              results["warnings"].append({
                  "type": "prose_below_frontmatter",
                  "file": rel_path,
                  "message": (
                      f"{rel_path}: body has {check['prose_chars']} chars of "
                      f"documentation-style prose below the frontmatter: "
                      f"\"{check['prose_preview']}\""
                  ),
                  "severity": "WARNING",
                  "fix": (
                      "Everything below the frontmatter is sent to the model as "
                      "system instruction. Move descriptive prose into the "
                      "frontmatter description field (metadata, never sent) or "
                      "delete it. Keep @mention pointers to instruction files."
                  )
              })

      results["passed"] = True  # WARNING-only check -- never fails the build
      results["summary"] = {
          "files_checked": results["files_checked"],
          "warnings": len(results["warnings"])
      }

      print(json.dumps(results))
      EOF
    output: "body_instruction_check_results"
    parse_json: true
    timeout: 120
    on_error: "continue"
    depends_on: ["repo-discovery"]

  # ============================================================================
  # PHASE 2.6: Quality Classification (Deterministic)
  # Enhanced in v3.0.0 to incorporate all new validation phases
  # ============================================================================

  - id: "quality-classification"
    type: "bash"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      import sys

      # Parse all results
      individual = json.loads('''{{individual_validation}}''')
      discovery = json.loads('''{{discovery_results}}''')
      packaging = json.loads('''{{packaging_check}}''')
      
      # v3.2.0: Parse environment check for environment status tracking
      env_check_raw = '''{{env_check}}'''
      try:
          env_check = json.loads(env_check_raw)
      except (json.JSONDecodeError, ValueError):
          env_check = {"capabilities": {}, "limitations": [], "install_instructions": [], "validation_mode": "unknown"}
      
      build_check_raw = '''{{build_check}}'''
      try:
          build = json.loads(build_check_raw)
      except (json.JSONDecodeError, ValueError):
          build = {"passed": True, "skipped": True, "reason": "build check output not available"}

      # NEW in v3.0.0: Parse new validation phase results
      behavior_hygiene_raw = '''{{behavior_hygiene_results}}'''
      try:
          behavior_hygiene = json.loads(behavior_hygiene_raw)
      except (json.JSONDecodeError, ValueError):
          behavior_hygiene = {"passed": True, "skipped": True}

      # NEW in v3.5.0: Parse behavior reference hygiene results
      behavior_ref_hygiene_raw = '''{{behavior_reference_hygiene_results}}'''
      try:
          behavior_ref_hygiene = json.loads(behavior_ref_hygiene_raw)
      except (json.JSONDecodeError, ValueError):
          behavior_ref_hygiene = {"passed": True, "skipped": True, "warnings": []}

      standalone_raw = '''{{standalone_completeness_results}}'''
      try:
          standalone = json.loads(standalone_raw)
      except (json.JSONDecodeError, ValueError):
          standalone = {"passed": True, "skipped": True}

      experiments_raw = '''{{experiments_validation_results}}'''
      try:
          experiments = json.loads(experiments_raw)
      except (json.JSONDecodeError, ValueError):
          experiments = {"passed": True, "skipped": True}

      context_sink_raw = '''{{context_sink_results}}'''
      try:
          context_sink = json.loads(context_sink_raw)
      except (json.JSONDecodeError, ValueError):
          context_sink = {"passed": True, "skipped": True}

      tool_placement_raw = '''{{tool_placement_results}}'''
      try:
          tool_placement = json.loads(tool_placement_raw)
      except (json.JSONDecodeError, ValueError):
          tool_placement = {"passed": True, "skipped": True}

      recipe_validation_raw = '''{{recipe_validation}}'''
      try:
          recipe_validation = json.loads(recipe_validation_raw)
      except (json.JSONDecodeError, ValueError):
          recipe_validation = {"quality_level": "good", "skipped": True, "summary": "Recipe validation not performed"}

      # v3.4.0: Parse YAML structure lint results
      structure_lint_raw = '''{{structure_lint}}'''
      try:
          structure_lint = json.loads(structure_lint_raw)
      except (json.JSONDecodeError, ValueError):
          structure_lint = {"passed": True, "skipped": True, "errors": []}

      # v3.6.0: Parse mode validation results
      mode_validation_raw = '''{{mode_validation_results}}'''
      try:
          mode_validation = json.loads(mode_validation_raw)
      except (json.JSONDecodeError, ValueError):
          mode_validation = {"passed": True, "skipped": True, "errors": [], "warnings": []}

      # v3.7.0: Parse body instruction check results
      body_instruction_raw = '''{{body_instruction_check_results}}'''
      try:
          body_instruction = json.loads(body_instruction_raw)
      except (json.JSONDecodeError, ValueError):
          body_instruction = {"passed": True, "skipped": True, "errors": [], "warnings": []}

      # Phase 2.8: Parse agent description budget validation results
      agent_description_raw = '''{{agent_description_validation_results}}'''
      try:
          agent_description_validation = json.loads(agent_description_raw)
      except (json.JSONDecodeError, ValueError):
          agent_description_validation = {"passed": True, "skipped": True, "errors": [], "warnings": []}

      # v3.10.0: Parse README install-instructions convention check results
      readme_convention_raw = '''{{readme_install_convention_results}}'''
      try:
          readme_convention = json.loads(readme_convention_raw)
      except (json.JSONDecodeError, ValueError):
          readme_convention = {"passed": True, "skipped": True, "errors": [], "warnings": [], "info": []}

      # Handle case where individual validation was skipped
      if individual.get("skipped", False):
          # v3.2.0: Check if this is an environment limitation (not a bundle problem)
          is_env_limitation = individual.get("environment_limitation", False)
          
          if is_env_limitation:
              # Environment limitation - NOT critical, just limited validation
              result = {
                  "phase": "quality_classification",
                  "quality_level": "limited",  # v3.2.0: New level for env limitations
                  "requires_llm_analysis": True,
                  "environment_limitation": True,
                  "validation_mode": individual.get("validation_mode", "structural_only"),
                  "skipped_reason": individual.get("reason", "validation skipped"),
                  "bundles": [],
                  "summary": {
                      "total": discovery.get("total_count", 0),
                      "good": 0,
                      "polish": 0,
                      "needs_work": 0,
                      "critical": 0,
                      "not_validated": discovery.get("total_count", 0)
                  },
                  "structural_issues": [],
                  "packaging_issues": [],
                  "hygiene_issues": [],
                  "completeness_issues": [],
                  "environment_status": {
                      "foundation_available": False,
                      "hatchling_available": env_check.get("capabilities", {}).get("hatchling_available", False),
                      "limitations": env_check.get("limitations", []),
                      "install_instructions": env_check.get("install_instructions", [])
                  },
                  "message": f"ℹ️ Limited validation mode: {individual.get('reason', 'foundation not available')}. Structural checks passed."
              }
          else:
              # Actual validation failure (not env related)
              result = {
                  "phase": "quality_classification",
                  "quality_level": "critical",
                  "requires_llm_analysis": True,
                  "skipped_reason": individual.get("reason", "validation skipped"),
                  "bundles": [],
                  "summary": {
                      "total": 0,
                      "good": 0,
                      "polish": 0,
                      "needs_work": 0,
                      "critical": 0
                  },
                  "structural_issues": [{
                      "type": "validation_skipped",
                      "message": individual.get("reason", "Individual bundle validation was skipped"),
                      "severity": "critical"
                  }],
                  "packaging_issues": [],
                  "hygiene_issues": [],
                  "completeness_issues": [],
                  "message": f"⚠️ Bundle validation could not run: {individual.get('reason', 'unknown reason')}"
              }
          print(json.dumps(result))
          sys.exit(0)

      def classify_bundle(bundle: dict) -> dict:
          """Classify a single bundle's quality level."""
          has_errors = len(bundle.get("errors", [])) > 0
          has_warnings = len(bundle.get("warnings", [])) > 0
          has_description = bundle.get("has_description", False)
          
          if has_errors:
              quality = "critical"
              reason = f"Bundle failed to load: {bundle.get('errors', ['unknown'])[0]}"
          elif has_warnings:
              quality = "polish"
              reason = f"Has {len(bundle.get('warnings', []))} warnings"
          else:
              quality = "good"
              reason = "Loads successfully with no issues"
          
          return {
              "path": bundle.get("path"),
              "name": bundle.get("name"),
              "category": bundle.get("category"),
              "quality": quality,
              "reason": reason,
              "has_description": has_description,
              "error_count": len(bundle.get("errors", [])),
              "warning_count": len(bundle.get("warnings", []))
          }

      def classify_repo():
          results = {
              "phase": "classification",
              "bundles": [],
              "summary": {
                  "total": 0,
                  "good": 0,
                  "polish": 0,
                  "needs_work": 0,
                  "critical": 0
              },
              "quality_level": "good",
              "requires_llm_analysis": False,
              "structural_issues": [],
              "packaging_issues": [],
              "hygiene_issues": [],
              "completeness_issues": [],
              "experiment_issues": [],
              "context_sink_issues": [],
              "tool_placement_issues": [],
              "structure_lint_issues": [],  # v3.4.0
              "behavior_reference_hygiene_issues": [],  # v3.5.0
              "mode_validation_issues": [],  # v3.6.0
              "body_instruction_issues": [],  # v3.7.0
              "agent_description_issues": [],  # Phase 2.8
              "readme_convention_issues": [],  # v3.10.0
              # v3.2.0: Environment status tracking
              "environment_status": {
                  "validation_mode": env_check.get("validation_mode", "unknown"),
                  "foundation_available": env_check.get("capabilities", {}).get("foundation_available", False),
                  "hatchling_available": env_check.get("capabilities", {}).get("hatchling_available", False),
                  "limitations": env_check.get("limitations", []),
                  "full_validation": env_check.get("summary", {}).get("full_validation_available", False)
              },
              "environment_info": []  # v3.2.0: Info messages about env limitations
          }
          
          # Classify each bundle
          for bundle in individual.get("bundles", []):
              classification = classify_bundle(bundle)
              results["bundles"].append(classification)
              results["summary"]["total"] += 1
              results["summary"][classification["quality"]] += 1
          
          # Check structural requirements
          repo_structure = discovery.get("repo_structure", {})
          has_root = repo_structure.get("has_root_bundle", False)
          has_behaviors = repo_structure.get("has_behaviors", False)
          has_standalone = repo_structure.get("has_standalone", False)
          has_agents = repo_structure.get("has_agents", False)
          has_skills = repo_structure.get("has_skills", False)
          
          if not has_root and not has_behaviors and not has_standalone:
              results["structural_issues"].append({
                  "type": "no_entry_point",
                  "message": "No root bundle, behaviors/, or bundles/ directory found",
                  "severity": "needs_work"
              })
          
          orphan_agents_fired = has_agents and not has_behaviors and not has_root
          if orphan_agents_fired:
              results["structural_issues"].append({
                  "type": "orphan_agents",
                  "message": "agents/ directory exists but no behaviors or root bundle to include them",
                  "severity": "needs_work"
              })
          
          # NEW (v3.9.0): a repo shipping agents/ and/or skills/ but no behaviors/
          # has no composable per-behavior --app install surface. orphan_agents
          # only fires when there is ALSO no root bundle, so the has-root case
          # (and the skills-only case) previously passed silent. Report it as a
          # distinct sibling finding, without double-firing with orphan_agents.
          if (has_agents or has_skills) and not has_behaviors and not orphan_agents_fired:
              results["structural_issues"].append({
                  "type": "no_composable_surface",
                  "message": (
                      "Repo ships agents/ and/or skills/ but no behaviors/ directory, "
                      "so there is no composable --app install surface. Ship a "
                      "behaviors/<name>.yaml so consumers can `amplifier bundle add "
                      "<repo>#subdirectory=behaviors/<name>.yaml --app`."
                  ),
                  "severity": "needs_work"
              })
          
          # Check packaging errors
          if not packaging.get("passed", True):
              for error in packaging.get("errors", []):
                  results["packaging_issues"].append({
                      "type": error.get("type", "packaging_error"),
                      "message": error.get("message", "Unknown packaging error"),
                      "severity": "critical",
                      "fix": error.get("fix", "Check pyproject.toml configuration")
                  })
          
          if not build.get("passed", True):
              for error in build.get("errors", []):
                  results["packaging_issues"].append({
                      "type": error.get("type", "build_error"),
                      "message": error.get("message", "Unknown build error"),
                      "severity": "critical",
                      "details": error.get("details", "")[:500]
                  })
          
          # v3.2.0: Track build environment limitations (INFO, not errors)
          if build.get("environment_limitation", False):
              for info in build.get("info", []):
                  results["environment_info"].append({
                      "type": info.get("type", "env_info"),
                      "message": info.get("message", "Environment limitation"),
                      "severity": "INFO",
                      "suggestion": info.get("suggestion", "")
                  })

          # NEW in v3.0.0: Check hygiene errors
          if not behavior_hygiene.get("skipped", False) and not behavior_hygiene.get("passed", True):
              for error in behavior_hygiene.get("errors", []):
                  results["hygiene_issues"].append({
                      "type": error.get("type"),
                      "behavior": error.get("behavior"),
                      "message": error.get("message"),
                      "severity": error.get("severity", "ERROR"),
                      "fix": error.get("fix", "")
                  })
          
          # Add hygiene warnings
          for warning in behavior_hygiene.get("warnings", []):
              results["hygiene_issues"].append({
                  "type": warning.get("type"),
                  "behavior": warning.get("behavior"),
                  "message": warning.get("message"),
                  "severity": "WARNING"
              })

          # Check standalone completeness errors
          if not standalone.get("skipped", False) and not standalone.get("passed", True):
              for error in standalone.get("errors", []):
                  results["completeness_issues"].append({
                      "type": error.get("type"),
                      "bundle": error.get("bundle"),
                      "message": error.get("message"),
                      "severity": error.get("severity", "ERROR")
                  })

          # Check experiments errors
          if not experiments.get("skipped", False) and not experiments.get("passed", True):
              for error in experiments.get("errors", []):
                  results["experiment_issues"].append({
                      "type": error.get("type"),
                      "experiment": error.get("experiment"),
                      "message": error.get("message"),
                      "severity": error.get("severity", "ERROR")
                  })
          
          # Add experiment warnings
          for warning in experiments.get("warnings", []):
              results["experiment_issues"].append({
                  "type": warning.get("type"),
                  "experiment": warning.get("experiment"),
                  "message": warning.get("message"),
                  "severity": "WARNING"
              })

          # Context sink issues (warnings/info only)
          for warning in context_sink.get("warnings", []):
              results["context_sink_issues"].append({
                  "type": warning.get("type"),
                  "message": warning.get("message"),
                  "severity": "WARNING"
              })
          for info in context_sink.get("info", []):
              results["context_sink_issues"].append({
                  "type": info.get("type"),
                  "message": info.get("message"),
                  "severity": "INFO"
              })

          # Tool placement suggestions
          for suggestion in tool_placement.get("suggestions", []):
              results["tool_placement_issues"].append({
                  "type": suggestion.get("type"),
                  "tool": suggestion.get("tool"),
                  "message": suggestion.get("message"),
                  "severity": "INFO"
              })

          # v3.4.0: YAML Structure Lint errors (highest priority — silent data loss)
          if not structure_lint.get("skipped", False) and not structure_lint.get("passed", True):
              for error in structure_lint.get("errors", []):
                  results["structure_lint_issues"].append({
                      "type": error.get("type"),
                      "bundle_path": error.get("bundle_path"),
                      "bundle_name": error.get("bundle_name"),
                      "category": error.get("category"),
                      "message": error.get("message"),
                      "severity": "ERROR",
                      "fix": error.get("fix", "")
                  })

          # v3.5.0: Behavior reference hygiene warnings
          if not behavior_ref_hygiene.get("skipped", False):
              for warning in behavior_ref_hygiene.get("warnings", []):
                  results["behavior_reference_hygiene_issues"].append({
                      "type": warning.get("type"),
                      "behavior": warning.get("behavior"),
                      "message": warning.get("message"),
                      "severity": "WARNING",
                      "fix": warning.get("fix", "")
                  })

          # v3.6.0: Mode validation errors and warnings
          if not mode_validation.get("skipped", False):
              for error in mode_validation.get("errors", []):
                  results["mode_validation_issues"].append({
                      "type": error.get("type"),
                      "mode": error.get("mode"),
                      "file": error.get("file"),
                      "message": error.get("message"),
                      "severity": "ERROR",
                      "fix": error.get("fix", "")
                  })
              for warning in mode_validation.get("warnings", []):
                  results["mode_validation_issues"].append({
                      "type": warning.get("type"),
                      "mode": warning.get("mode"),
                      "file": warning.get("file"),
                      "message": warning.get("message"),
                      "severity": "WARNING",
                      "fix": warning.get("fix", "")
                  })

          # v3.7.0: Body instruction check warnings (prose below frontmatter)
          if not body_instruction.get("skipped", False):
              for warning in body_instruction.get("warnings", []):
                  results["body_instruction_issues"].append({
                      "type": warning.get("type"),
                      "file": warning.get("file"),
                      "message": warning.get("message"),
                      "severity": "WARNING",
                      "fix": warning.get("fix", "")
                  })

          # Phase 2.8: Agent description budget errors and warnings
          if not agent_description_validation.get("skipped", False):
              for error in agent_description_validation.get("errors", []):
                  results["agent_description_issues"].append({
                      "type": error.get("type"),
                      "file": error.get("file"),
                      "message": error.get("message"),
                      "severity": "ERROR",
                      "fix": error.get("fix", "")
                  })
              for warning in agent_description_validation.get("warnings", []):
                  results["agent_description_issues"].append({
                      "type": warning.get("type"),
                      "file": warning.get("file"),
                      "message": warning.get("message"),
                      "severity": "WARNING",
                      "fix": warning.get("fix", "")
                  })

          # v3.10.0: README install-instructions convention findings.
          # Severity is "needs_work" (not ERROR/WARNING) -- these are
          # structural/convention findings, same tier as orphan_agents /
          # no_composable_surface above, not blocking errors.
          if not readme_convention.get("skipped", False):
              for warning in readme_convention.get("warnings", []):
                  results["readme_convention_issues"].append({
                      "type": warning.get("type"),
                      "message": warning.get("message"),
                      "severity": warning.get("severity", "needs_work"),
                      "fix": warning.get("fix", "")
                  })
              for info in readme_convention.get("info", []):
                  results["readme_convention_issues"].append({
                      "type": info.get("type"),
                      "message": info.get("message"),
                      "severity": "INFO"
                  })

          # Determine overall quality level
          # Priority: critical > needs_work > polish > good
          
          critical_count = results["summary"]["critical"]
          critical_count += len([i for i in results["packaging_issues"] if i.get("severity") == "critical"])
          critical_count += len([i for i in results["structure_lint_issues"] if i.get("severity") == "ERROR"])
          critical_count += len([i for i in results["hygiene_issues"] if i.get("severity") == "ERROR"])
          critical_count += len([i for i in results["completeness_issues"] if i.get("severity") == "ERROR"])
          critical_count += len([i for i in results["experiment_issues"] if i.get("severity") == "ERROR"])
          critical_count += len([i for i in results["mode_validation_issues"] if i.get("severity") == "ERROR"])  # v3.6.0
          critical_count += len([i for i in results["agent_description_issues"] if i.get("severity") == "ERROR"])  # Phase 2.8

          # Recipe validation impact
          recipe_quality = recipe_validation.get("quality_level", "good")
          if recipe_quality == "critical":
              critical_count += 1
          
          needs_work_count = results["summary"]["needs_work"]
          needs_work_count += len([i for i in results["structural_issues"] if i.get("severity") == "needs_work"])
          needs_work_count += len([i for i in results["readme_convention_issues"] if i.get("severity") == "needs_work"])  # v3.10.0
          if recipe_quality == "needs_work":
              needs_work_count += 1
          
          warning_count = results["summary"]["polish"]
          warning_count += len([i for i in results["hygiene_issues"] if i.get("severity") == "WARNING"])
          warning_count += len([i for i in results["context_sink_issues"] if i.get("severity") == "WARNING"])
          warning_count += len([i for i in results["experiment_issues"] if i.get("severity") == "WARNING"])
          warning_count += len(results["behavior_reference_hygiene_issues"])  # v3.5.0: all are WARNING
          warning_count += len([i for i in results["mode_validation_issues"] if i.get("severity") == "WARNING"])  # v3.6.0
          warning_count += len(results["body_instruction_issues"])  # v3.7.0: all are WARNING
          warning_count += len([i for i in results["agent_description_issues"] if i.get("severity") == "WARNING"])  # Phase 2.8
          if recipe_quality == "polish":
              warning_count += 1
          
          if critical_count > 0:
              results["quality_level"] = "critical"
              results["requires_llm_analysis"] = True
          elif needs_work_count > 0:
              results["quality_level"] = "needs_work"
              results["requires_llm_analysis"] = True
          elif warning_count > 0:
              results["quality_level"] = "polish"
              results["requires_llm_analysis"] = True
          else:
              results["quality_level"] = "good"
              results["requires_llm_analysis"] = False
          
          # Summary message
          total = results["summary"]["total"]
          good = results["summary"]["good"]
          
          if results["quality_level"] == "good":
              results["message"] = f"✅ All {total} bundles meet quality thresholds. No further analysis needed."
          else:
              issues = []
              if critical_count > 0:
                  issues.append(f"{critical_count} critical")
              if needs_work_count > 0:
                  issues.append(f"{needs_work_count} need work")
              if warning_count > 0:
                  issues.append(f"{warning_count} warnings")
              
              results["message"] = f"⚠️ Issues found: {', '.join(issues)}. {good}/{total} bundles are good."
          
          # v3.0.0 hygiene summary
          results["hygiene_summary"] = {
              "behavior_hygiene_passed": behavior_hygiene.get("passed", True),
              "standalone_completeness_passed": standalone.get("passed", True),
              "experiments_passed": experiments.get("passed", True),
              "total_hygiene_errors": len(results["hygiene_issues"]) + len(results["completeness_issues"]) + len(results["experiment_issues"]),
              "context_sink_warnings": len([i for i in results["context_sink_issues"] if i.get("severity") == "WARNING"]),
              "tool_placement_suggestions": len(results["tool_placement_issues"]),
              "structure_lint_errors": len(results["structure_lint_issues"]),
              "behavior_ref_hygiene_warnings": len(results["behavior_reference_hygiene_issues"]),  # v3.5.0
              "mode_validation_errors": len([i for i in results["mode_validation_issues"] if i.get("severity") == "ERROR"]),  # v3.6.0
              "mode_validation_warnings": len([i for i in results["mode_validation_issues"] if i.get("severity") == "WARNING"]),  # v3.6.0
              "body_instruction_warnings": len(results["body_instruction_issues"]),  # v3.7.0
              "agent_description_errors": len([i for i in results["agent_description_issues"] if i.get("severity") == "ERROR"]),  # Phase 2.8
              "agent_description_warnings": len([i for i in results["agent_description_issues"] if i.get("severity") == "WARNING"]),  # Phase 2.8
              "readme_convention_needs_work": len([i for i in results["readme_convention_issues"] if i.get("severity") == "needs_work"])  # v3.10.0
          }

          # v3.3.0: Recipe validation summary
          results["recipe_validation_summary"] = {
              "performed": not recipe_validation.get("skipped", False),
              "quality_level": recipe_validation.get("quality_level", "good"),
              "summary": recipe_validation.get("summary", "Recipe validation not performed"),
              "recipes_validated": recipe_validation.get("recipes_validated", 0)
          }
          
          # v3.2.0: Add environment limitations summary
          results["environment_summary"] = {
              "validation_mode": results["environment_status"]["validation_mode"],
              "full_validation_available": results["environment_status"]["full_validation"],
              "limitations_count": len(results["environment_status"]["limitations"]),
              "environment_info_count": len(results["environment_info"])
          }
          
          print(json.dumps(results))

      classify_repo()
      EOF
    output: "quality_classification"
    parse_json: true
    timeout: 60
    on_error: "fail"
    depends_on: ["validate-all-bundles", "behavior-hygiene-validation", "behavior-reference-hygiene", "standalone-completeness-validation", "experiments-validation", "context-sink-compliance", "tool-placement-analysis", "validate-recipes", "set-default-recipe-validation", "yaml-structure-lint", "mode-validation", "body-instruction-check", "agent-description-validation", "readme-install-convention-check"]

