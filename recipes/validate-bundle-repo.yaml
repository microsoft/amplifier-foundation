  # ============================================================================
  # PHASE 4: Repository Composition Analysis (Conditional)
  # ============================================================================

  - id: "composition-analysis"
    agent: "foundation:zen-architect"
    mode: "ANALYZE"
    condition: "{{quality_classification.requires_llm_analysis}} == true"
    prompt: |
      Analyze the composition of this bundle repository with focus on hygiene violations.

      **Repository Path:** {{repo_path}}

      **Quality Classification (focus on these issues):**
      ```json
      {{quality_classification}}
      ```

      **Discovery Results:**
      ```json
      {{discovery_results}}
      ```

      **Behavior Hygiene Results:**
      ```json
      {{behavior_hygiene_results}}
      ```

      **Standalone Completeness Results:**
      ```json
      {{standalone_completeness_results}}
      ```

      **Experiments Validation Results:**
      ```json
      {{experiments_validation_results}}
      ```

      **Context Sink Compliance:**
      ```json
      {{context_sink_results}}
      ```

      **Tool Placement Analysis:**
      ```json
      {{tool_placement_results}}
      ```

      **Behavior Reference Hygiene (v3.5.0):**
      ```json
      {{behavior_reference_hygiene_results}}
      ```

      **IMPORTANT: Focus on actual issues identified in the validation phases above.**

      **v3.0.0 Hygiene Rules to Enforce:**

      1. **Behavior Hygiene (ERROR if violated):**
         - Behaviors must NOT include root bundles (context bloat anti-pattern)
         - Behaviors must NOT have session.orchestrator (not standalone)
         - Behaviors must NOT define providers
         - context.include tokens must be <2000 (ERROR) / <1000 (WARNING)
         - Behaviors should have ≤3 context.include files
         - Behaviors should have ≤2 tools

      2. **Standalone Completeness (ERROR if violated):**
         - Bundles in /bundles/ MUST have orchestrator + context (direct or via includes)
         - Missing provider is WARNING only (intentional flexibility)

      3. **Experiments Rules:**
         - Should be exp-* prefixed (WARNING)
         - Description should include EXPERIMENTAL (WARNING)
         - Must be complete like standalone bundles (ERROR)

      4. **Context Sink Pattern (INFO/WARNING):**
         - Root with >5 context.include files → WARNING
         - Individual files >2000 tokens → INFO (candidate for agent)
         - Root owns >50% of context → INFO

      5. **Tool Placement (INFO/SUGGESTION) - v3.1.0 Inheritance-Aware:**
         - Universal tools OK in root
         - Specialized tools used by one behavior → suggest moving to behavior
         - Agent tool declarations checked against inheritance:
           - Tools in exclude_tools (default: ["delegate"]) → agent MUST declare (CORRECT)
           - Tools NOT in exclude_tools → agent declaration is REDUNDANT (SUGGESTION to remove)

      6. **Behavior Reference Hygiene (WARNING) - v3.5.0:**
         - Behaviors must NOT include cross-repo root bundles via bare git+https URL without #subdirectory= fragment
           Example of bug:  (no #subdirectory)
           Example of fix: 
         - Behavior bundle.name must NOT equal root bundle.name
           (causes BundleState self-referential registry entries like BundleState["X"].included_by = ["X", ...])

      **What is NOT an Issue:**
      - Using /bundles/ vs /behaviors/ is a LOCATION choice
      - Alternative valid patterns that still work
      - Personal preferences about organization

      **Output Format:**
      For each validation domain with issues:
      - **Domain**: behavior_hygiene | standalone_completeness | experiments | context_sink | tool_placement
      - **Finding**: What was observed
      - **Status**: ERROR | WARNING | INFO
      - **Fix**: How to resolve
    output: "composition_analysis"
    timeout: 300
    on_error: "continue"
    depends_on: ["set-default-composition-analysis", "quality-classification"]

  # ============================================================================
  # PHASE 4.5: Convention Compliance (Conditional)
  # ============================================================================

  - id: "repo-conventions"
    agent: "foundation:zen-architect"
    mode: "REVIEW"
    condition: "{{quality_classification.requires_llm_analysis}} == true"
    prompt: |
      Review repository-wide convention compliance, incorporating v3.0.0 hygiene findings.

      **Repository Path:** {{repo_path}}

      **Quality Classification:**
      ```json
      {{quality_classification}}
      ```

      **Discovery:**
      ```json
      {{discovery_results}}
      ```

      **Focus on genuine convention violations that impact functionality.**

      **Conventions to Check:**

      1. **Directory Structure:**
         - /bundle.md or /bundle.yaml at root
         - /behaviors/ for capability bundles (should be thin!)
         - /bundles/ for standalone variant bundles (must be complete!)
         - /experiments/ for experimental bundles (prefixed exp-*)
         - /providers/ for provider configurations
         - /agents/ for agent definitions
         - /context/ for shared context files

      2. **Bundle Hygiene (v3.0.0):**
         - Behaviors: thin, no root includes, no session config, limited context
         - Standalones: complete session config (direct or via includes)
         - Experiments: prefixed, warned, complete

      3. **Context Sink Pattern:**
         - Heavy context should be in agents, not root/behaviors
         - Root should have awareness-level context only
         - Specialized knowledge → agents

      4. **Tool Placement:**
         - Universal tools (filesystem, bash, web, search) → root OK
         - Capability tools → behaviors
         - Specialized tools → behind agents

      **Output Format:**
      Convention checklist with PASS/FAIL/N/A and notes.
      Only list FAIL items if they genuinely break functionality or violate hygiene rules.
    output: "repo_conventions"
    timeout: 300
    on_error: "continue"
    depends_on: ["set-default-repo-conventions", "composition-analysis"]

  # ============================================================================
  # PHASE 6: Bundle Doc Freshness Check (v3)
  # Checks that bundle.dot exists at repo root and is fresh.
  # Uses source_hash embedded in bundle.dot attribute.
  # Gracefully degrades if amplifier_foundation.bundle_docs is not importable.
  # Produces BUNDLE_DOT_MISSING (SUGGESTION) and BUNDLE_DOT_STALE (WARNING).
  # ============================================================================

  - id: "bundle-doc-freshness-check"
    type: "bash"
    depends_on: ["repo-discovery"]
    on_error: "continue"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json, re, sys
      from pathlib import Path

      _discovery_raw = r"""{{discovery_results}}"""
      discovery = json.loads(_discovery_raw)
      repo_path = Path(discovery.get("repo_path", "")).resolve()

      # Check if amplifier_foundation.bundle_docs is available (installed package)
      dot_available = False
      try:
          from amplifier_foundation.bundle_docs import bundle_repo_dot
          dot_available = True
      except ImportError:
          pass

      results = {
          "phase": "bundle_doc_freshness",
          "dot_available": dot_available,
          "findings": [],
          "summary": {
              "bundle_dot_status": "not_checked",
              "skipped": 0,
          },
      }

      if not dot_available:
          results["findings"].append({
              "code": "DOT_TOOL_UNAVAILABLE",
              "severity": "INFO",
              "message": (
                  "amplifier_foundation.bundle_docs not available — skipping bundle doc freshness checks. "
                  "Install amplifier-foundation for freshness checking."
              ),
              "detail": "",
          })
          print(json.dumps(results))
          raise SystemExit(0)

      # Generate fresh structural DOT and check bundle.dot freshness
      try:
          fresh_dot = bundle_repo_dot(repo_path)
          bundle_path = repo_path / "bundle.dot"
          if not bundle_path.exists():
              results["summary"]["bundle_dot_status"] = "missing"
              results["findings"].append({
                  "code": "BUNDLE_DOT_MISSING",
                  "severity": "SUGGESTION",
                  "message": "bundle.dot missing at repo root — run generate-bundle-docs",
                  "detail": "bundle.dot",
                  "bundle_path": None,
                  "bundle_name": "bundle",
              })
          else:
              existing_dot = bundle_path.read_text()
              fresh_hash = re.search(r'source_hash="([a-f0-9]+)"', fresh_dot)
              old_hash = re.search(r'source_hash="([a-f0-9]+)"', existing_dot)
              if fresh_hash and old_hash and fresh_hash.group(1) == old_hash.group(1):
                  results["summary"]["bundle_dot_status"] = "fresh"
              else:
                  results["summary"]["bundle_dot_status"] = "stale"
                  results["findings"].append({
                      "code": "BUNDLE_DOT_STALE",
                      "severity": "WARNING",
                      "message": "bundle.dot is stale (repo changed). Regenerate.",
                      "detail": "bundle.dot",
                      "bundle_path": None,
                      "bundle_name": "bundle",
                  })
          results["overview_structural_dot"] = fresh_dot
      except Exception as exc:
          results["summary"]["bundle_dot_status"] = "error"
          results["overview_structural_dot"] = ""
          results["findings"].append({
              "code": "DOC_CHECK_ERROR",
              "severity": "INFO",
              "message": f"Error checking bundle.dot: {exc}",
              "detail": str(exc),
          })

      print(json.dumps(results))
      EOF
    output: "bundle_doc_freshness"
    parse_json: true
    timeout: 60

  # ============================================================================
  # PHASE 6b: Bundle Doc Auto-Regeneration (v3)
  #
  # 6b-detail: No-op (no per-entry-point .detail.md files in v3).
  # 6b-overview-structural: Pass through structural DOT from freshness check.
  # 6b-overview-enhance: LLM-enhance bundle DOT labels (conditional).
  # 6b-overview-write: Write bundle.dot + render bundle.png.
  # ============================================================================

  - id: "bundle-doc-regen-detail"
    type: "bash"
    depends_on: ["bundle-doc-freshness-check"]
    on_error: "continue"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json
      # v3: No per-entry-point .detail.md files — this step is a no-op.
      print(json.dumps({"skipped": True, "written": 0, "errors": []}))
      EOF
    output: "bundle_detail_regen"
    parse_json: true
    timeout: 10

  - id: "bundle-overview-regen-structural"
    type: "bash"
    depends_on: ["bundle-doc-freshness-check"]
    on_error: "continue"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json, sys
      from pathlib import Path

      raw = r"""{{bundle_doc_freshness}}"""
      freshness = json.loads(raw)
      if not freshness.get("dot_available"):
          print(json.dumps({"skipped": True, "needs_regen": False, "overview_dot": ""}))
          sys.exit(0)

      # Check if bundle.dot needs regen
      bundle_dot_status = freshness.get("summary", {}).get("bundle_dot_status", "not_checked")
      needs_regen = bundle_dot_status in ("missing", "stale")
      overview_dot = freshness.get("overview_structural_dot", "")

      print(json.dumps({
          "skipped": False,
          "needs_regen": needs_regen,
          "overview_dot": overview_dot,
      }))
      EOF
    output: "bundle_overview_regen_targets"
    parse_json: true
    timeout: 30

  - id: "bundle-overview-regen-enhance"
    agent: "foundation:zen-architect"
    mode: "ARCHITECT"
    condition: "{{enhance_diagrams}} != 'false'"
    depends_on: ["bundle-overview-regen-structural"]
    on_error: "continue"
    timeout: 120
    prompt: |
      You are rewriting the labels of a DOT diagram for an Amplifier bundle repository.
      The goal: a non-technical person should understand the repository structure
      just from reading the diagram.

      ## Structural DOT (current auto-generated labels)
      ```dot
      {{bundle_overview_regen_targets.overview_dot}}
      ```

      ## Your Task

      Rewrite the DOT to have clear, accessible labels. Rules:
      CRITICAL: Preserve ALL numerical annotations EXACTLY as they appear in the structural DOT:
      - Token costs: ~N tok, ~N tok desc, ~N tok aggregate
      - Counts: N tools · M agents · K ctx
      - Version strings: vX.Y.Z
      - Filenames: keep the original filename alongside any description you add
      These are structural data, not labels to rewrite. Only add a BRIEF friendly description BEFORE the existing annotation. Example:
        BEFORE: "behavior-agents\n2 tools · 2 ctx\n~5583 tok"
        AFTER:  "Agent Delegation & Context\n2 tools · 2 ctx\n~5583 tok"
      1. Keep ALL structural elements unchanged: node IDs, edges, shapes, colors,
         fillcolor, style, cluster subgraphs — these are correct, don't touch them.
      2. ONLY change label values on nodes and subgraph clusters, AND the graph title.
      3. For the graph title: write a descriptive name + subtitle. In DOT, use \n
         (backslash-n) for a newline within a label string.
      4. For each node: rewrite to clear, plain English a non-technical person
         would understand. Use \n (backslash-n) for line breaks within label strings.
      5. For cluster subgraph labels: make them descriptive.
      6. Keep labels to 2-3 lines max.
      7. Add a short // comment at the top explaining the repository in one sentence.
      8. Keep the source_hash="..." graph attribute exactly as-is.

      Return ONLY the complete rewritten DOT. No explanation, no markdown fences,
      just the raw DOT content starting with // and ending with }.

      CRITICAL: Preserve every node ID, every edge, every shape/color/style attribute.
      Only labels and the top comment change.
    output: "bundle_overview_enhanced_dot"

  - id: "bundle-overview-regen-write"
    type: "bash"
    depends_on: ["bundle-overview-regen-enhance"]
    on_error: "continue"
    command: |
      "${AMPLIFIER_PYTHON:-python3}" << 'EOF'
      import json, subprocess, re, sys
      from pathlib import Path

      targets = json.loads(r"""{{bundle_overview_regen_targets}}""")
      if targets.get("skipped") or not targets.get("needs_regen") or not targets.get("overview_dot"):
          print(json.dumps({"written": 0, "rendered": 0, "fallback": 0, "errors": []}))
          sys.exit(0)

      overview_dot = targets["overview_dot"]
      _discovery_raw = r"""{{discovery_results}}"""
      discovery = json.loads(_discovery_raw)
      repo_path = Path(discovery.get("repo_path", "")).resolve()
      bundle_path = repo_path / "bundle.dot"
      png_path = repo_path / "bundle.png"

      results = {"written": 0, "rendered": 0, "fallback": 0, "errors": []}

      # Try LLM-enhanced version first
      enhanced_raw = r"""{{bundle_overview_enhanced_dot}}"""
      dot_content = None
      if enhanced_raw and enhanced_raw.strip() and enhanced_raw.strip() != "null":
          candidate = enhanced_raw.strip()
          candidate = re.sub(r"^```(?:dot)?\s*\n", "", candidate)
          candidate = re.sub(r"\n```\s*$", "", candidate)
          if candidate.startswith("//") or candidate.startswith("digraph"):
              dot_content = candidate
          elif "digraph" in candidate:
              m = re.search(r"((?://[^\n]*\n)*digraph\s+\w+\s*\{.*\})", candidate, re.DOTALL)
              if m:
                  dot_content = m.group(1)

      if not dot_content:
          dot_content = overview_dot
          results["fallback"] += 1

      if "source_hash" not in dot_content:
          m = re.search(r'source_hash="[a-f0-9]+"', overview_dot)
          if m:
              dot_content = dot_content.replace('bgcolor="white"',
                  'bgcolor="white"\n    ' + m.group(0))

      try:
          bundle_path.write_text(dot_content)
          results["written"] += 1
      except Exception as exc:
          results["errors"].append(f"Write failed: {exc}")
          print(json.dumps(results))
          sys.exit(0)

      proc = subprocess.run(["dot", "-Tpng", str(bundle_path), "-o", str(png_path)],
                            capture_output=True, text=True, timeout=15)
      if proc.returncode == 0:
          results["rendered"] += 1
      else:
          bundle_path.write_text(overview_dot)
          results["fallback"] += 1
          proc2 = subprocess.run(["dot", "-Tpng", str(bundle_path), "-o", str(png_path)],
                                 capture_output=True, text=True, timeout=15)
          if proc2.returncode == 0:
              results["rendered"] += 1
          else:
              results["errors"].append(f"Render failed: {proc2.stderr[:100]}")

      results["total"] = 1
      print(json.dumps(results))
      EOF
    output: "bundle_overview_regen"
    parse_json: true
    timeout: 120

